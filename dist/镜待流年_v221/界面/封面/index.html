f)('main'),f=[{title:'《对谁都冷艳的教授干妈私下是只宠我一人的至上仙尊》',char:'虞姝昀',location:'新湖区 · {{user}}的公寓',teaser:'搬出来独居好几年了，干妈却还是老一套小把戏',message:'根据以下设定构建剧情开头：\n时间：傍晚\n地点：{{user}}的公寓（主世界·新湖区）\n出场角色：虞姝昀\n剧情大纲：{{user}}搬出独居好几年了，虞姝昀至今仍把这当成换个地方照顾他。这天傍晚{{user}}回家，发现虞姝昀用"家里停水"的理由进了他家，刚洗完澡裹着浴袍靠在沙发上，茶几上摆着新买的草莓。她让{{user}}帮她看看新买的浴袍合不合身，在他面前转了一圈，展示着那傲人的身段。'},{title:'《粘人青梅白狐仙和人妻味十足的涂山夫人都是住我隔壁的九尾狐》',char:'涂山素凝 · 涂山曦华',location:'学府区与新湖区交界 · 涂山姐妹的温馨小楼',teaser:'推开门撞见姐妹俩在沙发上闹作一团，春光乍泄的画面比想象中更香艳',message:'根据以下设定构建剧情开头：\n时间：下午\n地点：涂山素凝与涂山曦华家客厅（主世界·学府区与新湖区交界）\n出场角色：涂山素凝、涂山曦华\n剧情大纲：{{user}}去素凝家串门，推开门发现素凝正把曦华压在沙发上玩闹。两人衣裙凌乱，狐耳狐尾全露了出来，姿势暧昧得像是在做那些百合间不可描述的事。素凝看到{{user}}正要欣喜出声，曦华已经微红着脸坐起来整理衣襟。素凝只好眨巴眼睛解释说狐耳和狐尾是coser道具，曦华默契地帮她圆场，然后解释说刚刚是自己肩膀不舒服，素凝在帮她按摩。'},{title:'《对我百依百顺的冷脸萌小师姐颇有古风仪态》',char:'慕容霁宁',location:'新湖区 · {{user}}的公寓',teaser:'暑假的雨季，小师姐撑着油纸伞款款而来，说江南有座园林在等你',message:'根据以下设定构建剧情开头：\n时间：暑假某日下午，小雨\n地点：{{user}}的公寓门口（主世界·新湖区）\n出场角色：慕容霁宁\n剧情大纲：暑假刚开始，星见市下着绵绵细雨。慕容霁宁撑着一柄油纸伞出现在{{user}}公寓门前，说在南方一处风景秀美的江南小镇，她刚刚买下一座精致的小园林做那避暑山庄，觉着{{user}}会喜欢便趁着暑假想邀{{user}}一起去看看。'},{title:'《禁欲纯情的纯白邻居大姐姐一个月总有特别绵软的几天》',char:'伊莉雅丝',location:'学府区与新湖区交界 · 白伊心理咨询角',teaser:'纯洁病症发作，疲惫的纯白女王需要你的温度',message:'根据以下设定构建剧情开头：\n时间：下午\n地点：伊莉雅丝家一楼心理咨询角（主世界·学府区与新湖区交界）\n出场角色：伊莉雅丝\n剧情大纲：伊莉雅丝的纯洁病症犯了，连着几天对什么都提不起劲儿。这段时间借着心理咨询名义来找她打听{{user}}消息的女学生越来越多，让她身心俱疲。她撑不住了，把{{user}}叫来，微嘟着唇瓣，故作可怜地让他帮自己按按摩。'},{title:'《人前圣洁端庄的剑之圣女大主教私下满是孩子气》',char:'薇奥莱塔',location:'新湖区 · {{user}}的公寓',teaser:'初冬第一场小雪，纯洁版剑之圣女化身薇奥莱塔穿越而来',message:'根据以下设定构建剧情开头：\n时间：初冬傍晚，飘着第一场小雪\n地点：{{user}}的公寓客厅（主世界·新湖区）\n出场角色：薇奥莱塔\n剧情大纲：初冬的第一场小雪悄无声息地落下来时，{{user}}刚从外面回到家，还没来得及开灯。客厅里有一团微弱的金色光芒在闪烁——那是子镜的波纹。光芒消散后，一个金发垂落、双眼蒙着黑色布条的女子踉跄着跌坐在地板上，半透的白袍因身形而紧贴在身上，手中那柄天秤剑磕在地砖上发出清脆的声响。她抬起头，无法聚焦的眼眸朝着门口的方向望过来，用带着异域口音的轻柔嗓音试探着问这里是不是她镜中看到的那个人的住处。'}],N=[{title:'《成了清冷画仙师尊笔下的画中人，被她和软糯乖徒儿唤进了苍溟界》',char:'苏墨染 · 苏幼清',location:'画道峰 · 云烟阁',teaser:'一幅缺了魂的画，一句含了情的诗，误打误撞唤来了画中人',message:'根据以下设定构建剧情开头：\n时间：清晨\n地点：画道峰云烟阁（苍溟界）\n出场角色：苏墨染、苏幼清\n剧情大纲：苏墨染按心中所想之人的模样作了一幅画，画完后总觉得有形无神。徒儿苏幼清凑过来看了一眼，喃喃念了一句诗——那声音轻得像梦里念叨过无数遍的句子。话音落下，画上墨迹忽然晕开，子镜与母镜同时嗡鸣，师徒二人的共鸣竟将画中人的本尊从另一个世界唤了过来。'},{title:'《雨夜醉拥高冷师尊，醒后她却一本正经问我怎么看小师妹》',char:'曦泠玥',location:'中元州 · 凌霄剑宗归一院',teaser:'离开镜月天独自出门历练的我，成了凌霄剑宗宗主的亲传弟子。今夜小雨，她邀我饮酒却借着酒意扑进怀里，醒后却端坐着问起那位小师妹',message:'根据以下设定构建剧情开头：\n时间：深夜，初春小雨未歇\n地点：凌霄剑宗凌霄峰·归一院（苍溟界·中元州）\n出场角色：曦泠玥\n前情提要：{{user}}离开与虞姝昀共同居住的镜月天，在苍溟界独自历练，在途经凌霄剑宗时，因一场意外与宗主曦泠玥相遇，被她破例收为亲传弟子几年后\n剧情大纲：曦泠玥邀{{user}}在归一院小酌。雨夜的归一院灯火清冷，檐外暴雨不断，曦泠玥独自饮着灵酒等候{{user}}。她早年和{{user}}初识便认出了子镜相识留下的气息，却没有立刻揭露自己与玥泠儿的关系，只以宗主和师尊身份收为自己的亲传弟子。几杯酒后，她平日维持的清冷外壳出现裂缝，忽然起身扑进{{user}}怀里，带着酒意和压抑许久的疲惫，像个被冷落多年的怨妇般低声祈求一个拥抱、摸摸头或安静的安抚（这一段只写温柔的依偎与幽怨的情绪释放，不替{{user}}决定回应。）待酒劲在雨声与片刻相处中消散，她重新整理衣襟，在{{user}}面前正襟危坐，像什么都没有失态过一样，却又旁敲侧击地询问{{user}}对宗门里那位活泼可爱的小师妹玥泠儿有何看法。她问得像是在谈论一名普通同门，实际却在试探{{user}}对自己少女形态的第一印象；表面仍维持师尊威仪，语气和眼神却会泄露期待、紧张与一点成熟女人的吃味。'},{title:'《耐不住空寂的小师妹夜里钻进被窝，趴在我身上睡到了天亮》',char:'玥泠儿',location:'中元州 · 凌霄剑宗归一院',teaser:'清冷师尊无人处化作黏人的小师妹，趁夜溜进卧房，在我身上寻了个舒服位置便赖到了晨光入窗',message:'根据以下设定构建剧情开头：\n时间：次日清晨，晨光初入\n地点：凌霄剑宗凌霄峰·归一院，{{user}}的卧房（苍溟界·中元州）\n出场角色：玥泠儿\n前情提要：{{user}}离开与虞姝昀共同居住的镜月天，在苍溟界独自历练，途经凌霄剑宗时被宗主曦泠玥破例收为亲传弟子几年后。玥泠儿名义上同样是曦泠玥亲自收入门下的灵族亲传弟子，是{{user}}的同门小师妹；她并非普通弟子，而是曦泠玥以溯影归真化成的少女形态，这一秘密尚未向{{user}}揭露。\n剧情大纲：前一夜，独处归一院的曦泠玥耐不住满院空寂，又不愿以师尊身份袒露想念，便化作玥泠儿，悄悄来到{{user}}卧房。她像寻到最安心的枕席一样趴在{{user}}身上，抱着不肯松开，睡梦中仍不安分地蹭动、蜷腿、调整位置，把被角和一缕铂金长发都缠在两人之间，就这样赖到了天亮。正文从次日清晨玥泠儿自然醒来开始：晨光照亮她露在发辫外的精灵尖耳，她仍伏在{{user}}身上，先迷迷糊糊寻找更舒服的位置，片刻后才意识到天已经亮了。她对昨夜的主动既满足又有一点被当场撞见般的羞赧，却仍舍不得立刻起身，于是以小师妹的活泼黏人掩饰心虚。只描写玥泠儿的行动、感受与对白，不替{{user}}补写昨夜或清晨的动作、回应、心理与决定。'},{title:'《风情万种的九尾赤狐提前苦练撩人本领，缩在我被窝里等着献媚》',char:'涂山绯汣',location:'中元州 · 凌霄剑宗客居洞府',teaser:'嘴上什么都敢说的赤狐姑娘认真准备了好几天，今晚终于把自己藏进你的被窝',message:'根据以下设定构建剧情开头：\n时间：深夜\n地点：凌霄剑宗客居洞府·{{user}}的卧房（苍溟界·中元州）\n出场角色：涂山绯汣\n前情提要：涂山绯汣是来自妖灵位面的九尾赤狐，幼年因玥泠儿与{{user}}隔着子镜相助而获救。如今她以凌霄剑宗的客居灵兽身份暂住宗门，已经确认眼前的{{user}}正是当年救过自己的那个人，却还没有把这段旧事直接说破。\n剧情大纲：涂山绯汣难得打定主意，要认真用一次自己引以为傲的妩媚与风情来撩动{{user}}。为了不让临场发挥再像平时那样只会口头逞强，她提前几天偷偷翻看情爱画本、研究双修功法中关于气息与距离的描述，反复琢磨怎样说话、怎样停顿、怎样在不越过对方意愿的前提下显得更有诱惑力。她还精心挑选了贴身的精致丝衣与合适的香气，梳理好长发和九条尾巴，给自己准备了一套自以为万无一失的登场计划。\n夜深后，她先若无其事地来到{{user}}的卧房附近，确认四下无人，才把鞋履和外衣整齐放到一旁，悄悄缩进{{user}}的被窝。她把自己藏在被褥与枕边之间，只露出一点绯红挑染、狐耳和尾尖，努力摆出画本里那种慵懒妩媚的姿态，心里却因为即将真正面对{{user}}而紧张得耳朵发热。她预演了几句大胆的台词，又觉得太直白会显得自己像个没经验的笨蛋，于是改成更像玩笑的说法；可每当听见门外动静，九条尾巴还是会先一步泄露她的期待与慌乱。\n正文从{{user}}发现被窝里多了一个人开始。绯汣应当保持成年女性的主动与风情，允许用靠近、眼神、衣料与尾巴制造暧昧气氛，但不能替{{user}}决定接受、拒绝或进行任何亲密行为。若{{user}}认真回应，她平日的“老司姬”姿态应迅速出现破绽，表现出脸红、僵住、尾巴炸开、嘴硬辩解等纯情反差；若{{user}}表现出拒绝或不适，她应立即收敛并用玩笑或道歉化解，不以媚术、力量或情绪绑架对方。'}],h=[{title:'《随涂山姐妹归乡历练，抬眼便见万灵栖于通天建木》',char:'涂山素凝 · 涂山曦华',location:'建木天都 · 接天云桥',teaser:'母镜通道在云海之上展开，建木、浮岛、灵海与无数奇珍异兽一并铺满视野',message:'根据以下设定构建剧情开头：\n时间：清晨，极光灵潮刚刚退去\n地点：云渺万灵界·建木天都外缘·接天云桥\n出场角色：涂山素凝、涂山曦华\n前情提要：涂山素凝与涂山曦华都出生于云渺万灵界，后来才在主世界定居。她们此次邀请{{user}}一同返回故乡历练，由熟悉本地风物的姐妹二人同行，也借此让{{user}}真正认识她们生长的世界。\n剧情大纲：母镜开启的跨界通道在高空云桥上稳定下来，云渺万灵界的辽阔天地第一次完整展现在眼前。贯穿天穹的远古建木从云海深处拔起，宽如陆地的枝干托着层叠灵市与宫阙，悬浮仙岛环绕树冠缓慢迁移，瀑布自岛缘坠入下方云潮；更远处，青丘幻洲铺展成花海、仙丘与红叶深谷，归墟龙海在天际映出雷光与巨浪。披羽、负鳞、生角或由草木化灵的万族生灵穿行其间，成群飞禽掠过云桥上空，灵兽沿枝海迁徙，巨大的原形与精巧的人形共同构成繁盛而有秩序的万灵世界。\n素凝回到故乡后难掩雀跃，狐耳与九尾自然显露，兴致勃勃地想把熟悉的一切介绍给{{user}}；曦华同样露出金狐耳尾，温柔地补充各地的规矩与风物，也留意着第一次来访者可能需要适应的灵气与高度。正文从界门在三人身后合拢、姐妹二人站在云桥前等待{{user}}决定先去何处开始，先以开阔而具体的景象呈现这个生机勃勃的巨构世界，再让历练方向从现场自然展开；不要替{{user}}预设震撼、赞叹、动作、对白或选择。'}],k=[{title:'《洪荒入侵，却被软萌垂耳玉兔和追着她跑的贪吃饕餮双双赖上了》',char:'白糯糯 · 陶冶月',location:'东海州 · 位面裂隙附近',teaser:'一只小兔子慌不择路穿过位面裂隙，身后追来一只贪她软毛的饕餮大妖',message:'根据以下设定构建剧情开头：\n时间：黄昏\n地点：星见市郊外（主世界·东海州，位面裂隙附近）\n出场角色：白糯糯、陶冶月\n剧情大纲：洪荒与主世界边界重叠，穿越两个位面的裂隙常年存在……一只垂耳玉兔穿过裂隙，慌不择路撞进了{{user}}怀里，化作一团温香软玉的人形。身后追来的饕餮大妖停在不远处，歪头看着{{user}}把那刚化形未着寸缕的娇软小美人护在身后的样子，饶有兴致地蹲了下来瞪大眼睛看着这一幕。一副跃跃欲试也想要抱抱的模样，可似乎觉得原形不方便，便学着化作人形。'}],y=[{title:'《外柔内刚的江南首富女当家暗暗仰慕了我许久》',char:'沈晚絮',location:'太渊城 · 沈氏商号书房',teaser:'秉烛夜读，一灯如豆，两人对坐。一人看诗，一人却在看另一人',message:'根据以下设定构建剧情开头：\n时间：深夜\n地点：沈氏商号书房（晏云界·太渊城）\n出场角色：沈晚絮\n剧情大纲：江南微凉的秋夜，书房里一灯如豆。沈晚絮在案前拨着算盘核对账目，{{user}}坐在另一侧执卷读诗。满室只有算珠轻响与翻页声。算珠声渐渐慢了，末了歇了下来。她手边的账本停在同一页许久，目光早已落在{{user}}低眉读诗的侧脸上。烛花轻轻爆了一下，她回过神，垂眸翻过一页账册。'},{title:'《女扮男装的当朝女帝和慵懒威严的国师联手把我迎进了深宫》',char:'晏云舒 · 姬望舒',location:'太渊城 · 静安王府',teaser:'天子与国师微服登门，一道不便明说的托付，将静安王请入九重宫阙',message:'根据以下设定构建剧情开头：\n时间：午后\n地点：静安王府（晏云界·太渊城）\n出场角色：晏云舒、姬望舒\n剧情大纲：晏云舒以"晏九渊"的身份与国师姬望舒微服到访静安王府。落座奉茶后，姬望舒将皇室困境和盘托出——天子实为女子之身，朝中催嗣日急，藩王蠢蠢欲动。她们希望{{user}}以"协理后宫事务"的名义入住宫中。至于入宫后真正需要他做什么，姬望舒没有明说，但话里话外的意思已经再清楚不过，不过是与后宫环肥燕瘦行那夫妻之实、孕以子嗣，以堵住众人之口。晏云舒坐在一旁，自始至终没有开口，只是偶尔抬眸看{{user}}一眼，又很快移开。姬望舒将话说完了，等他答复。'},{title:'《外冷内热的清冷医仙总拿医理解释对我的心动》',char:'白芙澪',location:'坠月幽谷 · 听雨竹楼',teaser:'皇室数次求药皆被一句"无缘"挡回，静安王亲至幽谷，帘后那位冷面医仙亲自打破了规矩',message:'根据以下设定构建剧情开头：\n时间：清晨\n地点：坠月幽谷听雨竹楼（晏云界）\n出场角色：白芙澪\n剧情大纲：晏云舒曾数次派人入坠月幽谷向白芙澪求药，次次被一句"无缘"挡回。{{user}}听闻此事，亲自策马前往幽谷替晏云舒求药。竹楼二层，白芙澪照例悬丝垂帘，冷声让来者自报来意。在{{user}}说完来意后，楼上沉默了片刻。悬丝收了，帘子也撩开了。她从竹楼上走下来，虽仍是那副清冷的眉眼，只是眼底多了一份异彩，她径直走到药炉前，美目流转间，亲手为他烹了一壶茶。'}],g=[{title:'《身材巨好的矜贵未婚妻伪装成我的贴身女仆》',char:'伊莲',intro:'婚约既定，相见却遥遥无期。她扮成贴身女仆住进我的宅邸，只为看清未来的丈夫。这个清晨，她拉开窗帘，决定尽一尽女仆的本分',message:'根据以下设定构建剧情开头：\n时间：清晨\n地点：晨星公爵宅邸 · {{user}}的卧房（曦光穹界·圣芒大陆）\n出场角色：伊莲（真实身份塞西莉亚）\n剧情大纲：晨星公爵宅邸新来的贴身女仆「伊莲」，真实身份是{{user}}素未谋面的未婚妻，阿斯特雷亚大公爵之女塞西莉亚。按两大世家婚约后的惯例，正式相见前女方会先遣女仆住进未婚夫的宅邸照料起居；塞西莉亚便隐去身份，亲自扮作女仆，想贴身看清这个将来要嫁的男人是何心性。于是这天清晨，伊莲照例进{{user}}的卧房伺候，一眼瞥见薄被下被悄然撑起的一处。服侍主人梳洗、打理身体的每一处本是贴身女仆的分内之事，她正要上前尽职；那点不愿承认的心思也在这一刻悄悄浮了上来。她想借着女仆的身份，带着那一分说不清的试探，瞧瞧究竟是大公爵之女的矜贵身份更教他动心，还是眼前这个身材样貌俱佳、又处处懂事的女仆更能勾住他。'},{title:'《千年血族小主人在我面前从威严御姐缩回了撒娇萝莉》',char:'莉泽洛特',intro:'星碎多岛海的吸血鬼小主人亲自领我参观她的领地，端庄从容尽显家主威仪。可一寻由头把我引回清静的公馆后，她便褪去成熟姿态，缩成娇小的模样扑进怀里，讨一个等了千年的拥抱',message:'根据以下设定构建剧情开头：\n时间：白日\n地点：星碎多岛海 · 梵卓世家领地（曦光穹界）\n出场角色：莉泽洛特\n剧情大纲：游历至星碎多岛海的{{user}}受邀踏入梵卓世家的领地，血族共尊的”小主人”莉泽洛特亲自接待。她此番敛去魔力，以成熟御姐的姿态端着家主威仪，领{{user}}参观领地；待寻由头将他引回私人公馆、屏退左右，独处时便卸下端庄，变回萝莉常态，扑进他怀里讨要守候千年的安抚。'},{title:'《娇小丰盈的摸鱼勇者和雌小鬼魔王姐姐的世界大战全是演的》',char:'奥罗拉·索拉瑞斯、维斯佩拉·诺克提斯',intro:'圣辉修道十字军与深渊魔王军在结界外严阵以待，等候光暗对决的结果。我在丰满修女的请求下踏入结界，却撞见娇小丰盈的勇者和雌小鬼魔王正在分零食',message:'根据以下设定构建剧情开头：\n时间：午后\n地点：曦光穹界边境 · 极光屏障下的中立地带\n出场角色：奥罗拉·索拉瑞斯、维斯佩拉·诺克提斯\n剧情大纲：曦光穹界每隔数十年就会上演一次”勇者与魔王的宿命对决”。这一日，圣辉修道十字军与深渊魔王军在极光屏障下的中立地带严阵以待，双方隔着巨大的魔法结界，等候结界内光暗对决的结果。圣辉修道十字军中一位身材丰满的年轻修女神色焦急，她拉住游历至此的{{user}}，恳求他进入结界确认勇者的安危——结界只允许非双方阵营的人通过。{{user}}踏入结界，穿过浓雾，却看到与想象中完全不同的画面：身量娇小、身姿丰盈的勇者奥罗拉正慵懒地靠在一块巨石上打瞌睡，身材娇小的魔王维斯佩拉叉着腰站在她面前，一边嘴上凶巴巴地说”妹妹你也太懒了吧”，一边用影子魔法递零食过去。两人察觉{{user}}的出现，同时僵住——娇小的魔王瞬间炸毛般跳起来，奥罗拉慢吞吞地眨巴眼睛。'}],b=(0,o.computed)(()=>'hongHuang'===E.value?k:'xianDao'===E.value?N:'yunMiao'===E.value?h:'yanYun'===E.value?y:'
