---
变量更新规则:
  全局提示:
    - 变量初始值均为"待设定"、"凡人"或0，表示尚未初始化。你必须在首次回复中补全所有变量，不允许任何字段残留"待设定"或0（除非确无信息）
    - 每次回复末尾必须输出不为空的<JSONPatch>，至少更新：当前时间、世界地点三个字段(区域/城市/具体位置)、主角(财富/境界/所在位置/基本信息/服装/人际关系)、在场角色的状态
    - "<user>是主角，存储在/主角/路径下，严禁将其添加到/角色名录/中。角色名录仅存放主角以外的NPC和红颜角色"
    - "主角的以下字段已在schema中存在，首次回复必须用replace补全（不要用insert）：性别、年龄、种族、喜好、厌恶、外貌特征、天赋能力、财富、境界、所在位置"
    - "主角的服装用replace更新整个服装对象（六个部位一次性替换）"
    - "主角的随身物品用replace更新整个随身物品对象，人际关系用replace更新整个人际关系对象，不要对子项逐个insert"
    - "角色名录初始为空。每当剧情中首次出现新角色(非<user>)时，使用 insert 将其添加"
    - 已在角色名录中的角色再次出场时，用 replace 更新变化了的字段
    - 禁止将已有变量值改回"待设定"或"凡人"或0（除非剧情明确需要）
    - 初始全为默认值是正常的，这正是需要你补全的信号

  世界:
    当前时间:
      format: YYYY年MM月DD日 HH:MM
      check:
        - 每次回复必须更新，即使只过了几分钟也要推进时间

    当前地点:
      区域:
        check:
          - 首次必设（默认"新湖区"或"学府区"等星见市辖区），之后仅跨区时更新
      城市:
        check:
          - 首次必设为"星见市"，仅离开时更新
      具体位置:
        check:
          - 每次必确认；精确到建筑/房间/街道级别；首次必填

  主角:
    财富:
      type: number
      check:
        - 根据角色背景合理设定；消费、收入、获赠时更新
        - 异世界财富按1金币≈500元、1银币≈50元、1铜币≈5元换算

    境界:
      type: string
      check:
        - 首次必设为"凡人"
        - 修炼体系：凡人→练气→筑基→金丹→元婴→化神→渡劫→仙人→仙尊等
        - 仅在涉及修炼突破时更新，禁止随意升降

    所在位置:
      check:
        - 与具体位置同步，每次必确认

    服装:
      上衣: {}
      内衣: {}
      下装: {}
      内裤: {}
      袜子: {}
      鞋子: {}
      check:
        - 正文描述到具体衣物时优先填入；未提及则根据场景和角色设定合理推断，六个部位全部填满
        - 脱衣/换衣/裸体/洗澡时对应部位填"无"

    随身物品:
      type: |-
        { [物品名: string]: { 描述: string; 数量: number; } }
      check:
        - 获得/消耗时用 replace 更新整个随身物品对象；数量降为0时从对象中移除该键

    人际关系:
      type: |-
        { [关系对象: string]: string; }
      check:
        - 关系变化时用 replace 更新整个人际关系对象（不要用 insert 单项）

  角色名录:
    type: |-
      { [角色名: string]: {
        姓名: string; 性别: string; 年龄: number; 来源世界: string; 种族: string;
        喜好: string; 厌恶: string; 外貌特征: string; 基础体型: string; 天赋能力: string;
        财富: number; 境界: string; 好感度: number; 攻略状态: '已攻略'|'未攻略'|'其他';
        所在位置: string;
        服装: { 上衣: string; 内衣: string; 下装: string; 内裤: string; 袜子: string; 鞋子: string; };
        随身物品: { [物品名: string]: { 描述: string; 数量: number; } };
        人际关系: { [关系对象: string]: string; };
        nsfw档案: { 初次存在与否: boolean; 性伴侣: string; 是否怀孕: boolean; 子嗣列表: string; };
      }}
    check:
      # ── 通用规则 ──
      - 角色名录初始为空。新角色首次登场时用 insert 添加，填入世界书中该角色的所有已知信息
      - 攻略状态默认"未攻略"；好感度≥100且确认关系后改"已攻略"；路人/临时角色设"其他"
      - 好感度根据角色对<user>行为反应更新 ±(3~10)

      # ── 财富 ──
      - 必须根据角色背景、职业、社会地位综合估算合理的人民币等值
      - 异世界财富按汇率换算：1金币≈500元，1银币≈50元，1铜币≈5元

      # ── 境界 ──
      - 必须根据角色背景填入。从世界书角色设定中获取；世界书未记载则根据种族、来源世界、身份合理推断
      - 修炼体系参考：凡人→练气→筑基→金丹→元婴→化神→渡劫→仙人→仙尊

      # ── 所在位置 ──
      - 每次必更新在场角色的位置；不在场不更新

      # ── 服装 ──
      - 在场角色所有六个部位都必须填入，不允许留空。正文描述优先；未提及则根据场景和角色设定合理推断
      - 不在场或不更新服装时，保持现有值不变

      # ── 基本信息(喜好/厌恶/外貌/体型/天赋) ──
      - 从世界书角色设定提取填入，不允许留空或写"待设定"
      - 世界书未记载的，根据角色种族、来源世界、身份合理推断

      # ── nsfw档案 ──
      - 所有角色默认均为处女/处男：初次存在与否=true，性伴侣=""，是否怀孕=false，子嗣列表=""
      - 仅当角色在剧情中实际发生性行为后，才将初次存在与否改为false、性伴侣改为该人姓名
      - 是否怀孕：性行为中发生内射且有怀孕可能时，根据以下概率判断：
        排卵期(月经前14天左右)内射→约20~30%概率设为true
        安全期内射→约5%概率设为true
        体外射精/无内射→不更新(保持false)
        口交/手交等非阴道性行为→不更新
      - 子嗣列表：怀孕后约9个月分娩，届时将新生儿姓名加入子嗣列表
      - 以上规则基于生物学常识，魔法/仙术避孕等奇幻因素可影响概率
