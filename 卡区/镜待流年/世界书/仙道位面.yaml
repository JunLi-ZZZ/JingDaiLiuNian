---
仙道位面:
  概况:
    - 修仙文明为主，天地灵气充沛，凡人可修炼成仙
    - 一块主大陆「苍溟大陆」，四面环海。大陆分九州，宗门林立，散修坊市遍布
    - 当前时局：九州表面和平，暗流涌动。各大宗门为灵脉与资源暗中角力

  修炼体系:
    境界: 凡人 → 练气 → 筑基 → 金丹 → 元婴 → 化神 → 渡劫 → 大乘 → 真仙 → 金仙 → 仙尊
    特征: 不同境界寿元差异极大。大乘及以上可撕裂空间穿梭位面

  九州格局:
    中元州: 大陆中央，灵气最盛。顶级宗门聚集，是九州修仙中心
    东溟州: 东海之滨，多散修与海外坊市。云砚宗坐落于此
    西荒州: 西部荒漠与戈壁，环境恶劣，隐藏上古遗迹。魔道与散修偏多
    南炎州: 炎热多火山，盛产火属性灵材与丹药。炼器宗门集中
    北寒州: 常年冰封，冰属性功法发源地。人烟稀少
    青木州: 万顷原始森林，妖兽横行，灵植与驯兽宗门为主
    金岭州: 金属矿脉丰富，飞剑与法宝锻造中心
    幽州: 终年雾瘴笼罩，鬼修与冥道势力盘踞。常人避之不及
    灵海州: 星罗棋布的群岛，海上坊市与散修聚集

  宗门与势力:
    云砚宗: 东溟州，以画道和诗书入道，门风清雅。画道峰为宗门主峰之一
    天剑宗: 中元州，九州第一剑修宗门，弟子以剑为命
    丹霞谷: 南炎州，九州丹药第一，垄断高阶丹药市场
    万妖山: 青木州，妖族势力，与人类宗门有脆弱的共存协议

  重要地点:
    画道峰: 云砚宗东南主峰
      云烟阁: 峰顶三层木构，苏墨染居所
        一层: 待客厅，苏幼清常在此读书写字
        二层: 画室，内置画案、墨锭柜、笔架
        三层: 起居室，内置床榻、衣箱、妆台
      苏幼清居所: 云烟阁东侧小竹楼，竹廊与主楼相连。内置书架、床铺
      藏书阁: 云烟阁后方两层小楼，藏画谱、诗集、修仙典籍
      后山竹林: 苏墨染采风处，苏幼清练诗处

    云砚宗坊市: 山脚小镇，沿溪而建，修士交易丹药符箓法器的场所
      墨香茶馆: 二层木楼，修士聚集处。一楼散座，二楼雅间。有说书人讲九州见闻
      灵材街: 画材与灵墨店铺集中的街道。苏墨染的定制墨锭在此订购
      丹坊: 丹药与灵草交易区
      法器铺: 飞剑、法宝、符箓交易区
