---
主世界:
  世界概况:
    - 科技水平与21世纪初相当。四大陆一洋：苍玄大陆、欧兰大陆、赤珊大陆、寂大陆、溟海
    - 苍玄大陆七州：东海州、西陵州、南渚州、北朔州、中州、云岭州、沧海州
    - 欧兰大陆：多国联盟，工业与金融发达
    - 赤珊大陆：热带大陆，部落与新兴国家并存
    - 寂大陆：极南冰盖，无常住人口，科考站与隐修者散落
    - 各大陆间以航班与海运连通
    - 多元位面的天然交汇点，位面来客稀少，普通人不觉超凡存在

  超凡规则:
    - 超凡存在默认不惊扰凡人
    - 普通人接触超凡现象后自然淡忘或合理化
    - 故意大规模暴露引天道反噬。过强外来力量被世界意志压制

  七州概览:
    东海州: 东临大海，多港口与贸易都市。首府星见市。南部有江南风格水乡小镇群——碧波、烟柳、画溪等镇。地势平缓，水系发达
    西陵州: 西部山地高原，矿产丰富，地广人稀。多古迹与少数民族聚落
    南渚州: 南部群岛与半岛，热带气候，渔业与旅游业发达。多雨林
    北朔州: 北部平原与丘陵，四季分明。是主要粮油产区。冬季降雪
    中州: 中央平原，经济文化中心。交通枢纽，高铁贯穿。高等学府与科研机构密集
    云岭州: 西南高海拔山区，云雾缭绕。多道观寺庙，是超凡隐修者偏爱之地
    沧海州: 东部海上大岛，以渔业和航运为生。民风淳朴，保留大量古老民俗

  星见市:
    概况: 东海州南部沿海都市，依山傍海，常住人口约三百万。位面枢纽核心锚点

    行政区划:
      - 滨海区：市政府驻地、金融中心、商业街、星见沙滩、滨海公园
      - 学府区：大学城，星见大学主校区、书店街、咖啡馆、学生公寓
      - 老城区：旧渔村演变，巷弄纵横，老字号密集。异界来客常在此落脚
      - 新湖区：新兴住宅区与商业综合体，<user>公寓所在
      - 郊野区：环山面海，含数座小镇与自然景区

    重要地点:
      星见大学: 学府区综合性大学
        研究生院: 顶层有虞姝昀独立办公室
        图书馆: 共四层，四楼为古籍区
        南门小吃街
        学生宿舍区
        操场与体育馆

      <user>公寓: 新湖区，距星见大学步行十五分钟
        房型: 一室一厅一卫一阳台
        卧室: 书桌堆有研究资料，床头柜置母镜

      虞姝昀居所: 学府区与新湖区交界，独栋两层小楼带院落
        一楼: 客厅、书房（书架上混放学术期刊与古籍）、厨房
        二楼: 卧室与私人空间
        院子: 种植多个位面的花卉

      涂山素凝与涂山曦华居所: 虞姝昀隔壁，独栋小楼，姐妹同住
        客厅: 地毯与毛绒坐垫，常备<user>爱吃的点心和茶
        卧室: 简约素白装修
        院子: 与虞姝昀的院子相邻

      伊莉雅丝居所: 学府区与新湖区交界，带小院两层洋房，与<user>公寓隔窄巷
        一楼: 心理咨询角，备安神花草茶与手工甜点
        二楼: 卧室与起居空间
        院子: 种深渊带来的银叶草

      慕容霁宁住所: 学府区私人独栋小院
        客厅: 设古琴，冰箱常备<user>喜欢的食物
        书房: 藏书满墙，窗前一张明式书案
        卧室: 独立卫浴，衣柜为黄花梨雕花老件

      镜花水月: 老城区最深窄巷内，无招牌茶馆。仅超凡存在可察觉入口
        功能: 超凡者的非正式驿站，供休息、交流、暂避

    交通:
      - 地铁连通滨海区-学府区-新湖区
      - 公交覆盖全市
      - 出租车与网约车便利
