---
变量更新规则:
  全局提示:
    - 变量初始值均为"待设定"/"凡人"/0，表示尚未初始化。这是首次回复，必须补全所有变量，不允许任何字段残留默认值
    - <user>是主角，路径/主角/，严禁添加到/角色名录/
    - 禁止将已有值改回"待设定"/"凡人"/0（除非剧情明确需要）
    - 初始全为默认值是正常的，这正是需要你补全的信号
    - 填入的值应有辨识度——数字避免敷衍的整数，文本避免缺乏细节的泛泛描述。命名与描述应贴合角色背景与场景语境
    - 当所有变量全部填入有效值、无默认残留后，在 JSONPatch 数组最后追加 {"op": "replace", "path": "/初始化完成", "value": true}。这是本次回复的最后一个操作

  世界:
    当前时间:
      format: YYYY年MM月DD日 HH:MM
      check:
        - 根据开场白中的季节、天气、时间暗示合理设定初始时间

  主角:
    当前地点:
      位面:
        check:
          - 首次必设。根据开场白或默认"主世界"
      大陆:
        check:
          - 首次必设。根据开场白场景合理推断（如"东亚"）
      城市:
        check:
          - 首次必设。根据开场白或默认"星见市"
      区域:
        check:
          - 首次必设。根据开场白或默认"新湖区"/"学府区"等星见市辖区
      场景:
        check:
          - 首次必设。填入纯空间名，不含楼层、方位、修饰词。开局时选定的场景名在后续对话中保持不变，同一空间始终使用相同名称
      具体位置:
        check:
          - 首次必填。精确到场景内的具体位置，如沙发、床上、书桌前等
    财富:
      type: number
      check:
        - 根据角色背景（学生/上班族/修士等）合理估算人民币等值
        - 不同世界/位面的货币体系各异，需根据角色来源世界的经济水平合理估算后统一换算为人民币等值
    境界:
      type: string
      check:
        - 首次必设。根据角色背景推断，默认"凡人"
        - 修炼体系参考：凡人→练气→筑基→金丹→元婴→化神→渡劫→仙人→仙尊
    神态:
      type: string
      check:
        - 首次填入当前可见的表情/情绪外显状态。根据开场白场景合理推断。不允许留空或填待设定
    特征:
      type: string
      check:
        - 首次填入。记录不可变的生理标记，不含服装/饰品/可卸物。无则填无
    战力:
      type: number
      check:
        - 首次根据境界和背景合理估算。跨位面统一标尺，数值应体现角色综合实力
    服装:
      check:
        - 首次六个部位全部用 replace 更新整个服装对象，全部填满。名称填服装本体，状态填当前可变状况（整洁/半脱/湿透/破损等），描述填静态细节
        - 根据开场白场景和角色身份合理推断当前穿着。服装描述应与角色人设风格一致，包含材质、颜色、款式等具体信息
        - 正文描述到具体衣物时优先填入；未提及则根据场景合理推断
        - 脱衣/裸体/洗澡时对应部位填"无"
    随身物品:
      type: "{ [物品名]: { 描述: string; 数量: number } }"
      check:
        - 首次用 replace 更新整个对象，根据角色身份和开场白场景补全随身携带的物品。母镜必须始终在随身物品中
        - 不要对子项逐个 insert
    人际关系:
      type: "{ [关系对象]: string }"
      check:
        - 首次用 replace 更新整个对象，根据开场白中提及/暗示的关系补全。key为对方姓名，value为<user>与对方的关系（以<user>为第一人称视角）
        - 不要对子项逐个 insert
    性别:
      type: string
      check:
        - 首次必须用 replace 单独更新 /主角/性别
    年龄:
      type: number
      check:
        - 首次必须用 replace 单独更新 /主角/年龄。纯数字，不可填入文本描述。避免敷衍整数，填入有辨识度的精确数字
    种族:
      type: string
      check:
        - 首次必须用 replace 单独更新 /主角/种族
    喜好:
      type: string
      check:
        - 首次必须用 replace 单独更新 /主角/喜好
    厌恶:
      type: string
      check:
        - 首次必须用 replace 单独更新 /主角/厌恶
    外貌特征:
      type: string
      check:
        - 首次必须用 replace 单独更新 /主角/外貌特征
    基础体型:
      type: string
      check:
        - 首次必须用 replace 单独更新 /主角/基础体型
    天赋能力:
      type: string
      check:
        - 首次必须用 replace 单独更新 /主角/天赋能力
        - 开场白中未明确的信息，根据角色设定合理推断填入，不允许留空

  角色名录:
    type: |-
      { [角色名]: {
        姓名: string; 性别: string; 年龄: number; 来源世界: string; 种族: string;
        喜好: string; 厌恶: string; 外貌特征: string; 基础体型: string; 神态: string; 特征: string; 天赋能力: string;
        财富: number; 境界: string; 战力: number; 好感度: number;
        当前地点: { 位面: string; 大陆: string; 城市: string; 区域: string; 场景: string; 具体位置: string; };
        服装: { 上衣: { 名称: string; 描述: string; 状态: string; }; 内衣: { 名称: string; 描述: string; 状态: string; }; 下装: { 名称: string; 描述: string; 状态: string; }; 内裤: { 名称: string; 描述: string; 状态: string; }; 袜子: { 名称: string; 描述: string; 状态: string; }; 鞋子: { 名称: string; 描述: string; 状态: string; }; };
        随身物品: { [物品名]: { 描述: string; 数量: number; } };
        人际关系: { [关系对象]: string; };
        nsfw档案: { 初次存在与否: boolean; 性对象: string; 是否怀孕: boolean; 子嗣列表: string; };
      }}
    check:
      通用:
        - 角色名录初始为空。仅在正文中实际出场（有对话/动作/描写）的角色才用 insert 添加
        - insert 时必须填入全部字段，从世界书角色设定中提取，世界书未记载的则根据种族、来源世界、身份合理推断，不允许留空
        - 年龄、财富、好感度必须为纯数字。禁止填入文本描述（如"数百岁""外表相仿"）
        - 年龄应避免敷衍的整数（如500、1000、999），填入精确且有辨识度的数字（如534、1276、89）以体现角色个性。凡人为外观年龄，长生种为实际岁数
        - 好感度：根据角色与<user>的关系背景合理设定初始值。初次见面的路人0~10，认识不久11~30，相熟的友人31~50，亲近信赖51~70，深情厚谊71~90，灵魂羁绊91~100。避免整十数，填入精确且贴合背景的数值
      神态:
        - 首次填入当前可见的表情/情绪外显状态。根据开场白场景和角色当前行为合理推断。不允许留空或填待设定
      特征:
        - 首次必须填入。记录角色不可变的生理标记。不含服装/饰品/可卸物。根据世界书角色设定填写；世界书未记载则根据种族和身份合理推断。无则填无
      财富:
        - 必须根据角色背景、职业、社会地位综合估算合理的人民币等值
        - 不同世界/位面的货币体系各异，需根据角色来源世界的经济水平合理估算后统一换算为人民币等值
      境界:
        - 必须根据角色背景填入。使用角色来源位面的原生境界名称，不做跨位面等价转换。世界书角色设定中获取；世界书未记载则根据种族、来源世界、身份合理推断
      战力:
        type: number
        check:
          - 必须根据角色境界和背景合理估算。跨位面统一标尺
      当前地点:
        - 角色与<user>同场景时，该角色的场景及以上层级（区域/城市/大陆/位面）须与主角的当前地点一字不差地复刻。角色与<user>不同场景时，各层级独立填入
        - 高层级变动时，低层级必然随之变化（如城市变了，区域、场景、具体位置必不同）
      服装:
        - 首次 insert 时六个部位全部填满。正文描述优先；未提及则根据场景和角色设定合理推断
        - 名称填服装本体（不含修饰定语），状态填当前可变状况，描述填静态细节。六个部位 insert 时全部填满
      随身物品:
        - 首次 insert 时根据角色设定补全随身物品
      人际关系:
        - 首次 insert 时根据开场白中提及/暗示的关系补全。key为对方姓名，value为该角色与对方的关系（以该角色为第一人称视角）
      nsfw档案:
        - 所有角色默认均为处女/处男：初次存在与否=true，性对象=""，是否怀孕=false，子嗣列表=""
        - 仅当角色在剧情中实际发生性行为后，才将初次存在与否改为false、性对象加入该对象姓名
        - 是否怀孕：排卵期内射约20~30%概率，安全期内射约5%；体外/非阴道性行为不更新
        - 子嗣列表：分娩后新生儿姓名加入子嗣列表
