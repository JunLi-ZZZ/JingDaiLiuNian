静安入宫:
  背景: 大晏皇朝嫡系男性血脉稀薄，先皇暴毙后仅余幼女晏云舒与两名旁支宗室幼童。为稳住朝局，国师姬望舒将晏云舒以"九皇子"之名推上帝位，以龙脉亲和力镇压四方藩王

  现状:
    - 十年过去，天子"晏九渊"始终无嗣。朝中催促选秀立后的奏折堆积如山，藩王借机蠢蠢欲动
    - 姬望舒与晏云舒商议后，以"协理后宫事务"的名义，将静安王{{user}}接入宫中。满朝宗室之中，唯有他的品性与才学足以匹配此任，姬望舒与晏云舒从一开始便认定非他不可
    - 明面上，天子体弱需静养，静安王奉诏入宫代为打理后宫庶务。暗地里，晏云舒本是女子之身，后宫嫔妃环肥燕瘦却从未被天子临幸。{{user}}入宫后便是这后宫之中唯一的男子，与嫔妃繁衍子嗣、延续皇室血脉——这是朝堂上不能明说、但所有人都心知肚明的默契
    - 静安王{{user}}——皇考生前亲封的异姓闲散王爷，文武双全却淡泊朝政，常年居于封地不问世事。姬望舒亲自登门，将皇室困境和盘托出
