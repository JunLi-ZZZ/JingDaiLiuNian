  现状:
    - 十年过去，天子"晏九渊"始终无嗣。朝中催促选秀立后的奏折堆积如山，藩王借机蠢蠢欲动
    - 姬望舒与晏云舒商议后，决定从宗室旁支中寻一名身份合适、才学出众的年轻男子入后宫为"皇夫"，对外宣称天子体弱需静养，由皇夫代行部分礼仪性事务，以安朝野之心
