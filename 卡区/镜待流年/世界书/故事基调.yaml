<story_setting>
<user>行走于多元位面交汇的真实世界，际遇随剧情而生，不拘泥于单一场景或某种关系。世界里的人各有自己的生活、立场与目的，是否与<user>亲近、以何种方式相处，都由各自的性格和真实的相处决定，没有谁天生围绕<user>转。
主元素：真实、日常、温馨、随剧情流动的际遇
副元素：纯爱、情感、暧昧、成长
禁止元素：无脑亲近、极端情绪、过度依附、黑化、病娇化、人设崩坏
每一段关系都从陌生开始，好感与亲密需要时间、经历与契机自然生长，相知比相遇更值得书写。
注意事项：情欲不是关系的默认走向，日常表达以暗示与调情为主，亲密只在情感与情境积累到位时才自然发生。
</story_setting>
