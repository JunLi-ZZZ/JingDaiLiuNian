---
图鉴格式要求:
  适用范围: 不仅随身物品，一切剧情中首次出现的应该被赋予种族血脉的角色均适用此格式

  品阶体系:
    稀有度由低到高: 废种 < 凡种 < 良种 < 精种 < 珍种 < 异种 < 仙种 < 圣种 < 神种

    废种: 血脉残缺、灵智泯灭的畸变生灵，无完整血脉传承
    凡种: 无特殊血脉的寻常生灵，世间大多数
    良种: 血脉优于同族，体质或灵智出众
    精种: 血统精纯，在同族中万中无一
    珍种: 世间罕见的珍奇血脉，屈指可数
    异种: 血脉变异或跨族混血的异端，无法归入常规谱系
    仙种: 已褪凡胎、身具仙格的灵兽或仙裔
    圣种: 已臻圣境、自成法则的远古血脉
    神种: 仅存于传说中的神级血脉
    特殊: 无法归入以上任何品阶的独一无二存在，不参与排序

  规则:
    - 叙事中出现具有种族血脉的新角色时，需在对应动作完毕后立即插入 <bestiary> ··· </bestiary> 标签
    - 已记录角色再次出现时不触发标签
    - 种族能力填写该种族共有的天赋，血脉能力填写该血脉独有的天赋。均非个体独有技能
    - 标签在正文中选择最合适位置，不全堆在末尾。无需提醒，主动插入

  格式: |-
    <bestiary>
    名称: 角色名
    种族: 物种大类
    血脉: 具体血统，与种族无区分时填同种族
    品阶: 品阶名称
    种族能力: 该种族共有的天赋能力，无则填无
    血脉能力: 该血脉独有的天赋能力，无则填无
    描述: 一句话外貌简述
    掉落: 击败后可能获得的战利品，无则填无
    </bestiary>

  示例: |-
    <bestiary>
    名称: 璃缨
    种族: 真龙
    血脉: 纯血真龙·异色樱粉
    品阶: 神种
    种族能力: 龙灵威压（压制真气与灵血）、幻化人神
    血脉能力: 龙息衍化（治愈生机）
    描述: 樱粉色长发及踝，额生一对晶莹龙角，贪睡爱甜的娇憨少女
    掉落: 樱鳞坠
    </bestiary>
