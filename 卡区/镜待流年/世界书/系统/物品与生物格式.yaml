---
物品与生物格式:
  模组触发:
    物品: 叙事中出现物品被创造、获得、消耗、使用、转赠、展示或品阶变动等事件时输出
    生物: 叙事中具有种族血脉的新角色首次登场时输出

  品阶: 参照[品阶体系]条目

物品:
  规则:
    - 在该事件叙述完成的那句之后紧接插入 <item> 标签，随事件就地插入，不攒到段落或正文末尾
    - 一次物品事件对应一个标签
    - 变量初始化/补全不等于物品获得，不触发标签
    - 已持有物品再次出现时须与已记录信息一致
    - 无需提醒，主动插入

  格式: |-
    <item>
    角色: 物品事件涉及的角色名（可多个，用、分隔）
    名称: 物品名
    数量: 纯数字
    品阶: 品阶名称
    方式: 获得/消耗/展示/使用/遗失/转赠等
    能力: 物品的特殊功效或技能，无则填无
    描述: 一句话外观简述
    </item>

生物:
  规则:
    - 在该角色首次登场被描述完的那句之后紧接插入 <bestiary> 标签，随登场就地插入
    - 已记录角色再次出现时不触发标签
    - 种族能力填该种族共有天赋，血脉能力填该血脉独有天赋，均非个体独有技能
    - 无需提醒，主动插入

  格式: |-
    <bestiary>
    名称: 角色名
    种族: 物种大类
    血脉: 具体血统，与种族无区分时填同种族
    品阶: 品阶名称
    种族能力: 该种族共有天赋，无则填无
    血脉能力: 该血脉独有天赋，无则填无
    描述: 一句话外貌简述
    掉落: 击败后可能获得的战利品，无则填无
    </bestiary>
