---
输出结构要求:
  正文与块的关系:
    - 正文是叙述本体，正式结构块只有 <item>、<bestiary>、<skill>、<照片>、<手机>、<手机记录>；它们记录正文中已经发生的事，紧跟在触发它的那段正文之后
    - 一段正文里发生了什么，就在其后立即给出对应的块，再继续后续正文；不得把块延迟到下一段、下一场景或回复末尾
    - 块不替代叙述。收发消息、拍照、获得物品、遇见生物的经过先在正文里写清楚，块只承载结构化记录

  顺序:
    - 全部正文与块写完之后，才是变量更新
    - 变量更新是整个回复的最后一部分，其后不再有任何正文、块或说明文字
    - 变量更新之前不出现变量更新的代码或片段，回复开头尤其不得以变量更新起笔
    - 状态栏占位符（<StatusPlaceHolderImpl/>）的渲染位置由系统控制，不受此规则约束，但变量更新必须在它之前完成

  边界:
    - 每个块自开自闭，标签成对。块与块之间不嵌套、不交叠
    - 标签名必须逐字使用正式格式，不翻译、不改写；物品不得写成 <物品>，生物不得写成 <生物>，技能不得写成 <技能>
    - 块外不写解释块的话，不说明自己正在生成什么格式
    - <item>、<bestiary>、<skill> 每块只记录一个具体对象；同段出现多个不同对象时分别开块，同一对象的同一事件不重复开块。其他格式按各自条目的聚合规则处理
    - 块内字段须与正文已经发生的事件或既有设定一致；不得为了交付格式而整块填“无”、留空或编造未发生的事件。格式明确允许“无”的单个字段，按其实际语义填写

  频率:
    - 该出现的块必须出现。不因回复已长、提示词已多而省略应有的记录
    - 具体物品发生创造、炼制、展示、发现、鉴定、食用、投喂、竞价、交易、获得、消耗、使用、遗失、转赠或品阶变化，技能获得或变化、消息收发、实际拍照、生物遇见，只要在正文中发生了，就必须给出对应的块
    - <照片> 只由实际拍照、明确打开真实相册查看照片、或明确翻看既有照片触发；仅提及照片/相机、头像、视频画面、截图、想象或描述画面时不得输出
    - <手机记录> 只记录手机屏幕上确实出现的直播弹幕、系统通知、平台推送等非私聊内容；不属于双方私聊时不得改用 <手机>
    - 变量更新在每轮回复末尾必有，不得省略
