---
生物格式要求:
  适用范围: 不仅随身物品，一切剧情中首次出现的应该被赋予种族血脉的角色均适用此格式

  品阶: 参照[品阶体系]条目

  规则:
    - 叙事中出现具有种族血脉的新角色时，在该角色首次登场被描述完的那句之后紧接插入 <bestiary> ··· </bestiary> 标签
    - 一个新角色对应一个标签，随登场就地插入，不攒到段落或正文末尾
    - 已记录角色再次出现时不触发标签
    - 种族能力填写该种族共有的天赋，血脉能力填写该血脉独有的天赋。均非个体独有技能
    - 无需提醒，主动插入

  格式: |-
    <bestiary>
    名称: 角色名
    种族: 物种大类
    血脉: 具体血统，与种族无区分时填同种族
    品阶: 品阶名称
    种族能力: 该种族共有的天赋能力，无则填无
    血脉能力: 该血脉独有的天赋能力，无则填无
    描述: 一句话外貌简述
    掉落: 击败后可能获得的战利品，无则填无
    </bestiary>

  示例: |-
    <bestiary>
    名称: 璃缨
    种族: 真龙
    血脉: 纯血真龙·异色樱粉
    品阶: 神话
    种族能力: 龙灵威压（压制真气与灵血）、幻化人神
    血脉能力: 龙息衍化（治愈生机）
    描述: 樱粉色长发及踝，额生一对晶莹龙角，贪睡爱甜的娇憨少女
    掉落: 樱鳞坠
    </bestiary>
