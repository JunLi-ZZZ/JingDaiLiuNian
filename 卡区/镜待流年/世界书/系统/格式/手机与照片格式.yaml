---
手机与照片格式:
  模组触发:
    手机消息: 收发手机等通讯设备消息时输出
    照片: 实际拍照、明确打开真实相册并查看照片、或明确翻看既有照片时输出

  贴纸:
    说明: 涂山素凝卡通贴纸，格式为[表情:名称]，可在手机消息类型"表情"里使用，也可在正文中自然出现
    名称列表: 你好呀、嘿嘿、摸摸头、好害羞、呜呜、晚安、略略、诶、哼

手机消息:
  前提:
    - 收发消息的前提是通讯双方各自随身持有手机等通讯设备，持有情况见状态栏随身物品字段，动笔前先核对
    - 凡在剧情中收发过手机消息的角色，其随身物品中都应有手机；若参与了手机往来却尚无手机，应在变量更新时补上（仅限已在场、已入名录者）

  规则:
    - 只有确实经手机等设备收发的文字或语音消息才写进 <手机> 块，当面说的话、电话口语、未发出的心理活动一律在正文里，不放进块
    - <手机> 块紧跟对应正文之后，先在正文叙述完这次收发经过，再给出块作为记录
    - 一次往来的全部消息归入同一个 <手机> 块，连发多条不拆块
    - 机主行必须写，填这部手机的持有者、即这段对话所在的手机屏幕属于谁。<user>自己的手机也照写<user>的名录全名，不省略
    - 机主为<user>本人以外的角色时（<user>借用他人手机、或两名角色互发而<user>只是旁观），机主行填那位持有者的名录全名
    - 机主与联系人都必须填角色名录全名，严禁用昵称、简称、称呼代替，同一角色始终用同一全名
    - 时间用「YYYY年MM月DD日 HH:MM」绝对格式，填这条消息实际发出的那一刻，不用"刚刚""下午"等相对词
    - 追叙从前发生过的消息往来时，时间填当时那一刻，不填当下时间。同一块内若消息跨越多个时刻，按各自实际时刻分别成块
    - 与剧情当前时间无关：时间字段记录的是这条消息本身发出时的时刻，而非查看它时的当下
    - 每条消息占一行写作「方向|类型|内容」，三段用竖线分隔
    - 方向相对机主：发出=机主这方发出的，收到=机主这方收到的
    - 类型据实取 文字/语音/图片/表情/红包 之一；非文字类型时内容写消息承载的信息（图片写画面，语音写说出的话，表情写[表情:名称]，红包写祝福语）
    - 各行按真实先后排列
    - <手机> 块须记录本次往来的完整消息：机主发出的写"发出"，对方回复的写"收到"，两个方向都要有
    - 联系人行和时间行是必填项，任何情况下都不可省略；只写消息体而缺少这两行是错误格式

  格式: |-
    <手机>
    机主: <user>的名录全名（即便是<user>自己的手机也写）
    联系人: 对方角色名
    时间: YYYY年MM月DD日 HH:MM
    发出|文字|机主发出的消息
    收到|文字|对方回复的内容
    发出|表情|[表情:哼]
    </手机>

    若机主是<user>本人以外的角色，机主行仍必须写：
    <手机>
    机主: 虞姝昀
    联系人: 涂山素凝
    时间: YYYY年MM月DD日 HH:MM
    发出|文字|虞姝昀发出的消息
    收到|文字|涂山素凝的回复
    </手机>

照片:
  规则:
    - 叙事中实际发生拍照事件，或角色明确打开真实相册查看/翻看既有照片时，紧跟在对应叙述之后插入 <照片> 块
    - 仅提及“照片”“相机”“头像”“视频画面”“截图”、描述画面或想象中的影像，不触发 <照片>
    - 拍摄者省略时默认为 {{user}}
    - 对象填被拍摄的主体（角色名或场景描述）
    - 画面依照当时情境、拍摄角度、光线、被摄者神态等具体描绘，写实而非笼统
    - 浏览真实相册中的旧照片时，画面描述应符合照片拍摄时的场景，而非当前叙事场景

  格式: |-
    <照片>
    拍摄者: 拍照的角色名（省略则默认{{user}}）
    对象: 被拍摄的主体
    时间: YYYY年MM月DD日 HH:MM
    画面: 照片内容的具体描述
    </照片>
