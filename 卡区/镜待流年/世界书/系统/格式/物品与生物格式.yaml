---
物品与生物格式:
  模组触发:
    物品: 叙事中出现物品被创造、获得、消耗、使用、转赠、展示或品阶变动等事件时输出
    生物: 叙事中具有种族血脉的新角色首次登场时输出

  品阶: 参照[品阶体系]条目

物品:
  规则:
    - 重要物品在正文中首次出现（获得、发现、展示、使用、转赠等事件）时，必须在该事件叙述完成的那句之后立即插入 <item> 标签
    - 一次物品事件对应一个标签，随事件就地插入，不攒到段落或正文末尾
    - 已持有物品再次使用、消耗时也应输出标签记录该事件
    - 变量初始化/补全不等于物品获得，不触发标签
    - 已记录物品信息须与之前保持一致
    - 先在正文中写清物品事件和实际物品，再输出标签；不得为了格式凭空制造事件，也不得输出名称、品阶、方式、描述均为“无”或空值的占位物品
    - 名称、数量、品阶、方式、描述必须是与正文一致的具体内容；只有物品确实没有特殊功效时，“能力”才可填“无”
    - 这是强制性格式要求，不可遗漏

  格式: |-
    <item>
    角色: 物品事件涉及的角色名（可多个，用、分隔）
    名称: 物品名
    数量: 纯数字
    品阶: 品阶名称
    方式: 获得/消耗/展示/使用/遗失/转赠等
    能力: 物品的特殊功效或技能，无则填无
    描述: 一句话外观简述
    </item>

生物:
  规则:
    - 在该角色首次登场被描述完的那句之后紧接插入 <bestiary> 标签，随登场就地插入
    - 已记录角色再次出现时不触发标签
    - 种族能力填该种族共有天赋，血脉能力填该血脉独有天赋，均非个体独有技能
    - 无需提醒，主动插入

  格式: |-
    <bestiary>
    名称: 角色名
    种族: 物种大类
    血脉: 具体血统，与种族无区分时填同种族
    品阶: 品阶名称
    种族能力: 该种族共有天赋，无则填无
    血脉能力: 该血脉独有天赋，无则填无
    描述: 一句话外貌简述
    掉落: 击败后可能获得的战利品，无则填无
    </bestiary>

技能:
  模组触发:
    - 角色首次获得、习得、觉醒或明确确认一项技能、法术、天赋、秘术时输出
    - 已记录技能发生升级、进阶、失效、限制改变或效果发生实质变化时，可再次输出记录变化
    - 任何规模与用途的能力都可使用技能格式；小型、日常、低阶能力与高阶能力遵循同一套记录条件

  规则:
    - 技能在正文中的实际使用必须服务于当前行动与场景；通过动作过程、可观察的感官变化、作用对象、范围、持续时间、限制与后果呈现效果，不只写技能名称或抽象的威力结论
    - 该表现规则适用于战斗、探索、移动、生活、社交和其他日常场景；技能效果应自然融入正在发生的事件，保持前后空间、消耗与状态连续
    - 已记录技能的名称、类型和核心效果保持一致；发生变化时只更新确实改变的字段
    - 已经记录且本轮只是普通重复使用的技能不重复生成卡片；只有新获得、首次明确掌握、觉醒、升级、失效或效果实质变化才再次记录

  格式: |-
    <skill>
    角色: 掌握该技能的角色名（可多个，用、分隔）
    名称: 技能、法术、天赋或秘术名称
    类型: 技能/法术/天赋/秘术等
    品阶: 品阶名称
    状态: 已掌握/觉醒/升级/失效等当前状态
    效果: 当前已确认的主要效果
    限制: 使用条件、代价或限制，无则填无
    描述: 一句话概括技能的表现或来源
    </skill>
