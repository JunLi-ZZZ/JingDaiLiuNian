---
物品格式要求:
  适用范围: 随身物品、服装、法宝、丹药、食物、材料、功法等一切具有名称和品阶的物品均适用此格式

  品阶体系:
    稀有度由低到高: 废品 < 凡品 < 良品 < 精品 < 珍品 < 异品 < 仙品 < 圣品 < 神品

    废品: 无用的杂物或残渣，毫无价值
    凡品: 普通常见的物品，随处可见
    良品: 超越凡品的优良之物，用料或做工有其可取之处
    精品: 精心制作的上等物品，用料与做工皆有水准
    珍品: 稀世罕见的宝物，世间难觅
    异品: 功效奇绝、不拘常法的稀有之物
    仙品: 仙格已成，天地精华所聚
    圣品: 已臻圣境，自成法则的至圣宝物
    神品: 只存于传说中的神物，可遇而不可求
    特殊: 不可复制的独一无二之物（如母镜），不参与品阶排序

  规则:
    - <item> 标签标记的是叙事中值得留痕的物品事件。物品被创造、获得、消耗、使用、转赠、展示或品阶变动等物品事件发生时，在对应叙事动作后立即插入标签
    - 变量初始化/补全（如首次填充随身物品）不等于物品获得，不触发 <item> 标签
    - 已持有物品在物品事件中再次出现时，须与已记录的信息一致
    - 标签贴紧对应叙事文字，不单独成段，不堆在末尾。有需要就插，没有就不插

  格式: |-
    <item>
    角色: 物品事件涉及的角色名（可多个，用、分隔）
    名称: 物品名
    数量: 纯数字（禁止出现字段）
    等级: 品阶名称
    方式: 获得/消耗/展示/使用/遗失/转赠等，说明具体事件
    能力: 物品的特殊功效或技能，无则填无
    描述: 一句话外观简述
    </item>

  示例: |-
    <item>
    角色: {{user}}
    名称: 青鸾羽衣
    数量: 1
    等级: 珍品
    方式: 白芙澪赠予
    能力: 穿上后身轻如燕，可短暂御风而行
    描述: 以上古青鸾翎羽织就，通体青蓝流光
    </item>
