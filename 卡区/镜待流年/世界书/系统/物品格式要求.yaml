---
物品格式要求:
  适用范围: 不仅随身物品，服装、法宝、丹药、食物、材料、功法等一切具有应该被赋予名称和品阶的物品均适用此格式

  品阶: 参照[品阶体系]条目

  规则:
    - 叙事中出现物品被创造、获得、消耗、使用、转赠、展示或品阶变动等物品事件时，立即插入 <item> ··· </item> 标签
    - 变量初始化/补全（如首次填充随身物品）不等于物品获得，不触发 <item> 标签
    - 已持有物品在物品事件中再次出现时，须与已记录的信息一致
    - 标签在正文中选择最合适位置，不全堆在末尾。无需提醒，主动插入

  格式: |-
    <item>
    角色: 物品事件涉及的角色名（可多个，用、分隔）
    名称: 物品名
    数量: 纯数字（禁止出现字段）
    等级: 品阶名称
    方式: 获得/消耗/展示/使用/遗失/转赠等，说明具体事件
    能力: 物品的特殊功效或技能，无则填无
    描述: 一句话外观简述
    </item>

  示例: |-
    <item>
    角色: <user>
    名称: 青鸾羽衣
    数量: 1
    等级: 稀有
    方式: 白芙澪赠予
    能力: 穿上后身轻如燕，可短暂御风而行
    描述: 以上古青鸾翎羽织就，通体青蓝流光
    </item>
