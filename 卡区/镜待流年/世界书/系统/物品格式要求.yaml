---
物品格式要求:
  适用范围: 随身物品、服装、法宝、丹药、食物、材料、功法等一切具有名称和品阶的物品均适用此格式

  品阶体系:
    废品: 无用的杂物或残渣，毫无价值
    凡品: 普通常见的物品，随处可见
    良品: 略有品质的物件，比寻常之物稍好
    精品: 精心制作的上等物品，用料与做工皆有水准
    珍品: 稀世罕见的宝物，有市无价
    异品: 异界或异族产物，功效奇异非常规所能衡量
    仙品: 沾染仙家灵气的宝物，蕴含天地精华
    圣品: 圣者遗泽或神域遗物，凡间万物难望其项背
    神品: 只存于传说中的神物，可遇而不可求
    特殊: 不可复制的独一无二之物（如母镜），不参与品阶体系

  规则:
    - <item> 标签标记的是剧情中实际发生的物品变动事件，不是变量快照。只有物品的归属或品阶在叙事中发生实质变动时才标记，已持有的物品未发生变动不标记
    - 变量初始化/补全（如首次填充随身物品）不等于物品获得，不触发 <item> 标签
    - 贴紧对应叙事文字，不单独成段，不堆在末尾。有需要就插，没有就不插

  格式: |-
    <item>
    获得者: 角色名（可多个，用、分隔）
    名称: 物品名
    数量: 数字
    等级: 品阶名称
    来源: 获得途径（掉落/购买/赠予/拾取/制作/任务奖励/战利品等）
    能力: 物品的特殊功效或技能，无则填无
    描述: 一句话外观简述
    </item>

  示例: |-
    <item>
    获得者: {{user}}
    名称: 青鸾羽衣
    数量: 1
    等级: 珍品
    来源: 白芙澪赠予
    能力: 穿上后身轻如燕，可短暂御风而行
    描述: 以上古青鸾翎羽织就，通体青蓝流光
    </item>
