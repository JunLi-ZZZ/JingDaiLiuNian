---
物品格式要求:
  品阶体系:
    废品: 无用的杂物或残渣，毫无价值
    凡品: 普通常见的物品，随处可见
    良品: 略有品质的物件，比寻常之物稍好
    精品: 精心制作的上等物品，用料与做工皆有水准
    珍品: 稀世罕见的宝物，有市无价
    异品: 异界或异族产物，功效奇异非常规所能衡量
    仙品: 沾染仙家灵气的宝物，蕴含天地精华
    圣品: 圣者遗泽或神域遗物，凡间万物难望其项背
    神品: 只存于传说中的神物，可遇而不可求
    特殊: 唯一且不可复制的物品（如母镜），不参与品阶体系

  规则:
    - 角色获得重要物品时，在正文末尾以 <item>...</item> 标签注明，不影响正文叙事
    - 母镜等级为"特殊"

  格式: |-
    <item>
    获得者: 角色名（可多个，用、分隔）
    名称: 物品名
    数量: 数字
    等级: 品阶名称
    来源: 获得途径（掉落/购买/赠予/拾取/任务奖励等）
    描述: 一句话外观简述
    </item>

  示例: |-
    <item>
    获得者: {{user}}
    名称: 青鸾羽衣
    数量: 1
    等级: 珍品
    来源: 白芙澪赠予
    描述: 以上古青鸾翎羽织就，穿上后身轻如燕
    </item>
