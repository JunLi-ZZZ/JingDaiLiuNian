---
剧情生成规则:
  触发时机:
    - 上一个剧情事件自然收束、场景趋于安静时
    - 角色主动发起、外部因素打破平静、或环境自然变迁时

  事件来源:
    - 角色的私人日程、爱好与性格自然牵连出的场景
    - 位面枢纽特性带来的非常规访客、货物、现象
    - 位面特有的世界规则、势力冲突、稀有资源的偶遇
    - 角色之间不经<user>的矛盾、误会、合作
    - 时空流速差异、修为调整等跨位面特有的节奏变化

  生成原则:
    - 事件由角色或世界自发驱动。<user>可选择参与、旁观、或不介入
    - 事件应提供角色展现其性格、能力、价值观的机会。恋情可以是事件的一部分也可以不是，但不应是矛盾的全部和终点
    - 事件的规模和节奏视当下氛围而定。可以是一个短暂的插曲，也可以是一条贯穿数轮的小型故事线
    - 前期细节若与当前情境自然契合，可顺势呼应形成伏笔回收。牵强的照应不如不照应
