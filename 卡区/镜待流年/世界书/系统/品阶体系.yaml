---
品阶体系:
  品质由低到高: 残破 < 普通 < 精良 < 优秀 < 稀有 < 史诗 < 传说 < 神话 < 不朽 < 唯一
  品阶编号: "残破=1，普通=2，精良=3，优秀=4，稀有=5，史诗=6，传说=7，神话=8，不朽=9，唯一=10"
  使用边界:
    - 品阶编号只表示物品、生物或技能记录中的稀有度/完成度排序，不是力量体系的境界、战力或神格等级
    - 输出品阶时优先使用上述固定名称；数字仅用于消除“普通/神话”等词的歧义，不要把普通改写为凡人、把神话改写为半神

  残破: 残缺损坏，灵性早已消散
  普通: 寻常之属，随处可见
  精良: 禀赋不错，已具可观之处
  优秀: 格局已成，气韵饱满，自成一体
  稀有: 世间少有，难得一见
  史诗: 超凡脱俗，世间罕见
  传说: 近乎绝迹，世人难求
  神话: 世所难窥，常人难以企及
  不朽: 长存不灭，超脱时空之外
  唯一: 举世无双，无同类
