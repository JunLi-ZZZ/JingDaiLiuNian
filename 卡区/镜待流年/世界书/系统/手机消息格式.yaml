---
手机消息格式:
  适用范围: 当前时空存在手机等即时通讯设备，且发生收发消息事件时适用；无通讯设备的时空不涉及

  规则:
    - 角色通过手机向<user>发来消息时，在该消息发生处紧接插入 <手机> 标签，方向填"收到"
    - 一条消息对应一个标签；对方连发多条时各自成签、按先后排列，不并入一条
    - <user>经手机发出的消息由<user>自行发送，不代写、不臆测其内容；但对方会如实收到并据此回应
    - 消息内容贴合该角色的身份、语气与处境，如真人发消息
    - 类型按实际情形选填：文字、图片、语音、表情、视频。非文字类型时，内容处写这条消息承载的信息（图片/视频写画面内容、语音写说了什么、表情写表达的情绪）
    - 无需提醒，主动插入

  格式: |-
    <手机>
    联系人: 与<user>通讯的对方角色名
    方向: 收到
    类型: 文字
    内容: 消息正文；非文字类型时写该消息承载的信息
    时间: 消息发生的时间点
    </手机>

  示例: |-
    <手机>
    联系人: 虞姝昀
    方向: 收到
    类型: 文字
    内容: 今晚几点回来？给你煨了汤，别在外头乱吃。
    时间: 周三 18:20
    </手机>
    <手机>
    联系人: 虞姝昀
    方向: 收到
    类型: 语音
    内容: 打你电话没接，是不是又忙忘了。忙完早点回。
    时间: 周三 18:21
    </手机>
