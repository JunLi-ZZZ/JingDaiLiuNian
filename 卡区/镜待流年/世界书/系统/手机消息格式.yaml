---
手机消息格式:
  适用范围: 当前时空存在手机等即时通讯设备，且发生收发消息事件时适用；无通讯设备的时空不涉及

  规则:
    - 只有确实经手机等设备收发的文字或语音消息才写进 <手机> 块。当面说出的话、电话通话里的口头语、尚未说出口的心理活动，都不是手机消息，一律照常写在正文里，不得放进 <手机> 块
    - <手机> 块紧跟在对应正文之后：先在正文里把这次收发消息的经过叙述完，再给出 <手机> 块作为消息记录，不把块放在正文之前
    - 双方身处同一场景、能当面交流时，一般当面说话而不发消息；只有存在特意动用手机的缘由才收发（隔着距离传图、身处不便出声的场合、需要留下文字凭据等）
    - 一次往来的全部消息归入同一个 <手机> 块，对方连发多条也不拆块
    - 块头两行固定：联系人为与<user>通讯的对方角色名；时间用「YYYY年MM月DD日 HH:MM」绝对格式，与世界当前时间一致（如 2024年03月05日 20:15），不用"刚刚""下午"等相对词
    - 其后每条消息占一行，写作「方向|类型|内容」，三段之间用竖线分隔
    - 方向取"收到"或"发出"：收到是对方发给<user>的，发出是<user>经手机发出的
    - 类型据实取文字、图片、语音、表情、视频之一；非文字类型时内容处写这条消息承载的信息（图片与视频写画面，语音写说出的话，表情写[表情:名称]或所表达的情绪）
    - 发出行照抄<user>此番经手机发出的原话，逐字誊录，不改写不润色，也不替<user>补写他没发过的消息
    - 收到行由对方依其身份、语气、与<user>的关系及当前处境写出，如真人发消息
    - 各行按真实发生的先后排列

  格式: |-
    <手机>
    联系人: 与<user>通讯的对方角色名
    时间: YYYY年MM月DD日 HH:MM
    收到|文字|对方发来的消息正文
    发出|文字|<user>经手机发出的原话，照抄
    收到|语音|这条语音说出的话
    收到|表情|[表情:表情名]
    </手机>
