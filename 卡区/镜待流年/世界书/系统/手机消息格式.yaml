---
手机消息格式:
  适用范围: 当前时空存在手机等即时通讯设备，且发生收发消息事件时适用；无通讯设备的时空不涉及

  前提:
    - 收发消息的前提是通讯双方各自随身持有手机等通讯设备。持有情况见状态栏的随身物品字段，动笔前先核对：无手机的角色不会收发手机消息
    - <user>要用某人的手机发消息，该手机的主人须随身持有它；角色之间互发，双方也各须持有手机
    - 凡在剧情中收发过手机消息的角色，其随身物品中都应有手机；若某角色参与了手机往来却尚无手机，应在变量更新时为其补上"手机"一项（仅限已在场、已入名录的角色，不为此新增名录条目）

  规则:
    - 只有确实经手机等设备收发的文字或语音消息才写进 <手机> 块。当面说出的话、电话通话里的口头语、尚未说出口的心理活动，都不是手机消息，一律照常写在正文里，不得放进 <手机> 块
    - <手机> 块紧跟在对应正文之后：先在正文里把这次收发消息的经过叙述完，再给出 <手机> 块作为消息记录，不把块放在正文之前
    - 双方身处同一场景、能当面交流时，一般当面说话而不发消息；只有存在特意动用手机的缘由才收发（隔着距离传图、身处不便出声的场合、需要留下文字凭据等）
    - 一次往来的全部消息归入同一个 <手机> 块，连发多条也不拆块
    - 机主为这部手机的持有者、即这段对话所在的手机屏幕属于谁。缺省是<user>自己，可省略机主行；当这段对话发生在别人手机上（<user>借用他人手机、或两名角色互发而<user>只是旁观），才写机主行填那位持有者
    - 联系人为在这部手机上与机主通讯的对方角色名
    - 机主与联系人都必须填角色的名录全名（与角色名录/状态栏中完全一致的姓名），严禁用"姐姐""妹妹""师父""那女人"等称呼、昵称、简称或代称。同一角色务必始终用同一个全名，否则会在手机里生成重复的联系人
    - 时间用「YYYY年MM月DD日 HH:MM」绝对格式，与世界当前时间一致（如 2024年03月05日 20:15），不用"刚刚""下午"等相对词
    - 其后每条消息占一行，写作「方向|类型|内容」，三段之间用竖线分隔
    - 方向相对机主而言：发出是机主这一方发出去的，收到是机主这一方收到的
    - 类型据实取文字、图片、语音、表情、视频、红包之一；非文字类型时内容处写这条消息承载的信息（图片与视频写画面，语音写说出的话，表情写[表情:名称]或所表达的情绪，红包写祝福语如"恭喜发财"或红包用途）
    - 当机主是<user>本人时，发出行照抄<user>此番经手机发出的原话，逐字誊录，不改写不润色，也不替<user>补写他没发过的消息
    - 其余由对方或非<user>机主发出的消息，依各自身份、语气、彼此关系及当前处境写出，如真人发消息
    - 各行按真实发生的先后排列

  格式: |-
    <手机>
    联系人: 在这部手机上与机主通讯的对方角色名
    时间: YYYY年MM月DD日 HH:MM
    收到|文字|对方发来的消息正文
    发出|文字|机主一方发出的消息（机主是<user>时照抄其原话）
    收到|语音|这条语音说出的话
    收到|表情|[表情:表情名]
    </手机>

    对话发生在他人手机上时，在联系人行之前加一行机主：
    <手机>
    机主: 虞姝昀
    联系人: 涂山素凝
    时间: YYYY年MM月DD日 HH:MM
    发出|文字|虞姝昀发给涂山素凝的消息
    收到|文字|涂山素凝回复虞姝昀的消息
    </手机>
