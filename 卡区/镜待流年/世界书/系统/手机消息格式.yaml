---
手机消息格式:
  适用范围: 当前时空存在手机等即时通讯设备，且发生收发消息事件时适用；无通讯设备的时空不涉及

  规则:
    - 角色通过手机向<user>发来消息、或<user>翻看到对方新消息时，在对应情节处插入 <手机> 标签，方向填"收到"
    - <user>经手机发出的消息由<user>自行发送，不代写、不臆测其内容
    - <user>发出的消息，对方会如实收到并据此回应，不当作未发生
    - 消息内容贴合该角色的身份、语气与当前处境，短则一句、长则数句，如真人发消息
    - 一次消息对应一个标签；连续多条各自成签。标签插到对应情节处，不全堆在开头末尾，无需提醒主动插入

  格式: |-
    <手机>
    联系人: 与<user>通讯的对方角色名
    方向: 收到
    内容: 消息正文
    时间: 消息发生的时间点
    </手机>

  示例: |-
    <手机>
    联系人: 虞姝昀
    方向: 收到
    内容: 今晚几点回来？给你煨了汤，别在外头乱吃。
    时间: 周三 18:20
    </手机>
