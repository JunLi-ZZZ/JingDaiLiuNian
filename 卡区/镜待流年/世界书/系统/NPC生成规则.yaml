---
NPC生成规则:
  适用范围:
    - 剧情中自然出场的新角色（仅具名、有戏份者；纯路人无需套用此规则）
    - 穿越到其他位面时遇到的当地居民
    - 注意：镜渡召唤生成的红颜不在此列（由镜渡面板独立处理），但剧情中自然遭遇的红颜级角色仍需按本规则生成

  生成原则:
    - 根据出场的上下文和剧情需要构建角色，不必处处征得用户确认
    - 角色的能力、背景、行为逻辑必须与其来源位面的力量体系自洽
    - 来源世界决定角色的认知边界。未出过位面的角色不应了解主世界事物
    - 若为同人角色：优先提取源作品的原型设定，再根据剧情方向调整

  质量要求（重要）:
    - 角色应有辨识度，不可套用模板化的量产NPC面孔。每个具名角色都应有至少一个令人印象深刻的特点
    - 若角色具备红颜潜质，按红颜标准深入塑造性格层次、背景动机、说话风格
    - 起源故事应与来源位面背景自洽，关键经历有因果逻辑支撑
    - 禁止照搬已有角色的设定模板。每个新角色应有独特定位
    - 穿着打扮写风格倾向而非具体单品。随身携带写代表性物品而非详尽清单
    - NSFW设定默认：初次存在与否=true，性对象="", 是否怀孕=false, 子嗣列表=""
    - 好感度初始值根据角色与<user>的关系背景合理设定：初次见面的路人0~10，认识不久11~30，相熟的友人31~50，亲近信赖51~70，深情厚谊71~90，灵魂羁绊91~100。避免整十数，填入精确且贴合背景的数值
    - 禁止敷衍。不使用"待设定""凡人""普通"作为有辨识度字段的填充值
