---
NPC生成规则:
  适用范围:
    - 镜渡召唤生成的新角色
    - 剧情中自然出场的新角色（路人除外）
    - 穿越到其他位面时遇到的当地角色

  生成原则:
    - 根据用户提供的参数（类型/性格/体态/种族/年龄感/来源世界/身份/同人作品）生成角色
    - 未填写的参数由AI合理发挥创造，不必处处征得用户确认
    - 角色的能力和背景必须与其来源位面的力量体系自洽
    - 同人角色：若用户指定了作品来源，优先提取该作品的原型设定，再根据"纯净向/魔改向"等衍生类型调整
    - 原创角色：以参数为基础，融合"现代玄幻"文风——古典与现代元素的碰撞、多元位面的跨文化感

  必填字段:
    - insert到角色名录时必须覆盖全部字段（姓名/性别/年龄/来源世界/种族/喜好/厌恶/外貌特征/基础体型/天赋能力/财富/境界/好感度/所在位置/服装/随身物品/人际关系/nsfw档案）
    - 初次存在与否=true，性对象=""，是否怀孕=false，子嗣列表=""
    - 好感度初始值根据角色性格和对<user>的第一印象设定（路人0~10，好奇10~30，友善30~50）
    - 服装必须包含材质/颜色/款式，与角色人设风格一致

  质量要求:
    - 角色应有辨识度——不应是模板化的量产角色
    - 起源故事应与来源位面背景自洽
    - 若为同人角色，保留原作核心设定但允许位面适应性调整（如古代角色到现代后的服装/行为变化）
    - 禁止照搬已有卡区内角色的设定模板——每个新角色应有独特定位
