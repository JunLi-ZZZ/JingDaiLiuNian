---
位面生成规则:
  触发:
    - user通过母镜前往非主世界的位面时
    - 剧情中首次进入未记载的位面时

  生成内容:
    当前地点全套字段:
      - /世界/当前地点/位面：新位面名称
      - /世界/当前地点/大陆：该位面的大区域名
      - /世界/当前地点/城市：落脚城市名
      - /世界/当前地点/区域：城区/地段
      - /世界/当前地点/具体位置：精确落脚地点

    位面简介（正文中自然呈现，不需写入变量）:
      - 位面名称与核心特征（一句话概括）
      - 文明形态（修仙/魔法/科技/末日/古代/混合等）
      - 力量体系与规则（与主世界有何不同）
      - 当前的时局（战争/和平/乱世/盛世/末世等）
      - 对user修为的影响（压制/增幅/不变）

    生成原则:
      - 根据用户的自定义参数或随机命中的位面类型构建
      - 同人位面：基于源作品的设定框架，允许衍生版本变化（纯净/魔改/反转/融合）
      - 原创位面：保持与多元位面体系的概念自洽（可参考体系概述中的已有位面类型）
      - 位面规模弹性——可以是一个完整世界，也可以是一个小规模的异空间/半位面
      - 落脚地点应有趣味性和探索价值，不应是空洞荒芜之地
      - 文风保持"现代玄幻"的碰撞感——古典与科技交织、秩序与混沌并存
