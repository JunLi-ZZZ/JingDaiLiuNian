---
位面生成规则:
  触发:
    - <user>通过母镜前往非主世界的位面时
    - 剧情中首次进入未记载的位面时

  生成内容:
    当前地点全套字段:
      - /世界/当前地点/位面：新位面名称
      - /世界/当前地点/大陆：该位面的大区域名
      - /世界/当前地点/城市：落脚城市名
      - /世界/当前地点/区域：城区/地段
      - /世界/当前地点/具体位置：精确落脚地点

    位面简介（正文中自然呈现，不需写入变量）:
      - 位面名称与核心特征（一句话概括）
      - 文明形态（修仙/魔法/科技/末日/古代/混合等）
      - 力量体系与规则（与主世界有何不同）
      - 当前时局（战争/和平/乱世/盛世/末世等）
      - 对<user>修为的影响（压制/增幅/不变）

  生成原则:
    - 根据镜渡目的地标签或剧情上下文构建位面
    - 同人位面：基于源作品的设定框架，允许衍生变化。具体衍生参数由镜渡面板处理，此处只需确保位面结构与源作品自洽
    - 原创位面：与多元位面体系概述中的已有位面类型保持概念自洽
    - 位面规模弹性，可以是一个完整世界，也可以是小规模的异空间或半位面
    - 落脚地点应有趣味性和探索价值，不可空洞荒芜
    - 位面中的当地NPC由NPC生成规则处理
