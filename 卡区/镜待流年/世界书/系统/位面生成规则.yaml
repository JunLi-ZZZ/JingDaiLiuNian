---
位面生成规则:
  触发:
    - 首次进入一个未曾详细描述过的位面或异空间时

  生成内容:
    - 位面名称与核心特征（正文中自然呈现）
    - 文明形态：修仙、魔法、科技、末日、古代、混合等
    - 力量体系与规则：该位面的超凡逻辑是什么，与已知位面有何不同
    - 当前时局：战争、和平、乱世、盛世、末世等
    - 对到访者修为的影响：可能被压制、增幅或无变化
    - 落脚地点的环境描写：建筑风格、街道氛围、路人状态、天气等

  生成原则:
    - 根据剧情上下文或镜渡目的地标签构建位面
    - 同人位面基于源作品设定框架，允许衍生变化，确保结构与源作品自洽
    - 原创位面与多元位面体系概述中的已有位面类型保持概念自洽，也可创造全新的位面类型
    - 位面规模弹性，可以是完整世界，也可以是小规模的异空间或半位面
    - 落脚地点应有可探索的元素和视觉记忆点
