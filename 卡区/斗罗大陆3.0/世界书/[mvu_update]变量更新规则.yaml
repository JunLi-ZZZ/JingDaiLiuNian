---
变量更新规则:
  _全局规则:
    NPC更新范围:
      - 【铁律】每次回复只更新本楼正文中实际出现、被提及、或受到剧情影响的NPC
      - 未出现的NPC保持原样，不做任何更新操作
      - 新登场的重要NPC才录入NPC列表，路人和边缘人物不计
      - 新登场的NPC必须更新所有变量内容，禁止遗漏和省略
      - 离场的NPC将"是否在场"更新为false即可，不删除条目

  世界状态:
    当前时代:
      type: "'斗一' | '斗二' | '斗三'"
      check:
        - 首次初始化时根据用户档案填入，为全局静态变量
        - 对应关系：斗一=斗罗大陆、斗二=绝世唐门、斗三=龙王传说
        - 【铁律】只允许填入"斗一"、"斗二"、"斗三"三个值中的一个，严禁使用全称或其他任何写法，否则EJS条件加载系统全部失效
    当前日期:
      format: "${纪年名称}${YYYY}年${MM}月${DD}日 ${HH}:${mm}"
      check:
        - 24小时制
        - 每次剧情推进、行动、休息或旅行后更新，保持时间流逝合理
        - 若时间跨度较大，应说明跳跃原因
    当前区域:
      check:
        - 填写大范围地名（如：史莱克学院、星斗大森林、天斗城）
        - 发生跨区域移动时更新
    当前场景:
      check:
        - 填写当前区域内的具体场所（如：演武场、宿舍、森林深处）
        - 在同一区域内移动时更新
    当前场景类型:
      type: "'日常' | '战斗' | '修炼' | '旅行' | '猎魂' | '亲密' | '社交' | '购物' | '比赛' | '考核' | '拍卖'"
      check:
        - 根据当前实际行为即时切换，特殊事件（战斗/比赛/考核）结束后恢复为"日常"
        - 【铁律】只允许填入上述11个值之一，严禁使用其他写法，否则EJS场景规则加载失效
    剧情章节:
      check:
        - 【强制】每次更新「当前日期」后，必须立即执行以下比对流程：
          1. 取出刚更新的日期
          2. 查看<剧情章节表>中所有章节的起始日期
          3. 找到当前日期所处的章节区间（当前日期 ≥ 该章节起始日期，且 < 下一章节起始日期）
          4. 如果比对结果与当前章节变量不同，必须更新章节变量
        - 即使玩家进行非原著路线，也必须根据时间线比对区间表更新
        - 章节只能前进不能倒退（除非时间倒流等特殊设定）
        - 【铁律】只允许填入例如"序章"、"第一章"、"第三十三章"这样的章节名，严禁使用任何前缀和后缀，否则EJS条件加载系统全部失效
    年表时期:
      check:
        - 【强制】每次`剧情章节`变量发生变化时，必须同步更新年表时期，二者禁止脱节
        - 斗一时期划分：序章~第十一章为前期，第十二章~第二十二章为中期，第二十三章~第三十二章为后期
        - 斗二时期划分：序章~第十一章为前期，第十二章~第二十三章为中期，第二十四章~第三十五章为后期
        - 斗三时期划分：序章~第六章为前期，第七章~第十二章为前中期，第十三章~第十八章为中期，第十九章~第二十四章为中后期，第二十五章~第三十章为后期，第三十一章~第三十六章为大后期
        - 【铁律】只允许填入"前期"、"前中期"、"中期"、"中后期"、"后期"、"大后期"六个值中的一个，严禁使用全称或其他任何写法，否则EJS条件加载系统全部失效

  玩家:
    check:
      - 强制规则：开局时根据世界书中"user档案"的角色设定，将设定填入mvu变量中，不得遗漏与省略
      - 每次回复检查相应字段，进行更新
    基础信息:
      姓名:
        check:
          - 初始化时填入，通常不变
      年龄:
        type: number
        check:
          - 跨年后自动+1
      性别:
        type: "'男' | '女' | '扶她'"
        check:
          - 根据用户档案填入
      种族:
        type: "'人类' | '魂兽'"
        check:
          - 根据用户档案填入，通常不变
          - 【铁律】EJS控制器依赖此字段判断是否加载魂兽设定，必须严格填"人类"或"魂兽"
      身份:
        check:
          - 随剧情推进、角色实际行为更新
          - 可同时拥有多个身份，用顿号分隔
          - 成神后身份增加神位相关称谓
          - 【注意】此字段与种族字段不同，种族是"人类"或"魂兽"，身份是具体的社会身份描述
      所属势力:
        check:
          - 加入或退出势力、职位升迁、贬谪或身份变更时更新
      先天魂力:
        type: number
        range: 0-10
        check:
          - 武魂觉醒时确定，通常为固定值
      魂师称号:
        check:
          - 魂力等级变化后立即对照称号表更新
          - 凡界称号表：1-10魂士|11-20魂师|21-30大魂师|31-40魂尊|41-50魂宗|51-60魂王|61-70魂帝|71-80魂圣|81-90魂斗罗|91-94封号斗罗|95-98超级斗罗|99极限斗罗
          - 99级细分（由剧情状态判定，非纯数值）：普通极限斗罗→准半神（触碰法则）→半神（自创神位或触碰位面法则）→准神（掌握部分法则，半步成神）
          - 神级称号表：100-109神官|110-119三级神(真神)|120-129二级神(超神)|130-139一级神|140-159神王|160+至高神
          - 成神后称号改为神位名称
      魂导师等级:
        check:
          - 斗一时代：默认"非魂导师"，斗一没有魂导师概念
          - 斗二时代：根据魂导器制造能力填入1级~10级
          - 斗三时代：默认"非魂导师"，斗三没有魂导师概念，斗三的对应系统是锻造师（见锻造信息模块）和四大副职业
      封号:
        check:
          - 魂力达91级后由玩家命名，91级以下固定为"无"
          - 封号通常一至两个字，代表该魂师最具标志性的特征
          - 成神后封号被神位称号取代
      外貌:
        check:
          - 20-30字的简练人形外貌描述，玩家外貌显著变化时更新

    魂兽信息:
      check:
        - 仅当玩家种族为"魂兽"时以下字段才有意义；种族为"人类"时全部保持默认值
      名字:
        check:
          - 身为魂兽的个人名字，区别于种族名
      种族信息:
        check:
          - 内容包含种族名称、天性、栖息地、种族特征等核心信息，20token左右
      年限:
        check:
          - 修炼突破或经历重大时间跨度后更新，格式为具体数字+年
      血脉等级:
        type: "'普通魂兽' | '高级魂兽' | '顶级魂兽' | '超级魂兽' | '神兽' | '不适用'"
        check:
          - 初始化时根据魂兽种族和年限判定，血脉觉醒、返祖、获得神赐等特殊事件后可提升
      兽形外貌:
        check:
          - 20-30字的简练兽形描述
      属性:
        check:
          - 首次初始化时根据魂兽种族特性填入元素属性数组
          - 参考属性池：金、木、水、火、土、风、雷、光、暗、精神、空间、时间、力、冰、毒、生命、毁灭、神圣、邪恶
          - 允许自定义属性（不限于以上列表）
          - 默认为普通属性，禁止添加"极致之"前缀，除非设定明确标注
      化形状态:
        type: "'未化形' | '幼年期' | '成熟期' | '幻化人形' | '完全幻化人形' | '不适用'"
        check:
          - 化形状态变更时，必须同步检查武魂信息/常规魂骨模块的权限
      天赋魂技:
        type: |-
          {
            [魂技名称: string]: {
              描述: string;
            }
          }
        check:
          - 区别于魂环获取的魂技，为魂兽与生俱来的种族能力
          - 年限增长、血脉觉醒后可领悟新的天赋魂技并添加

    武魂信息:
      type: |-
        {
          [武魂名称: string]: {
            品质: '废' | '低级' | '中级' | '高级' | '顶级' | '超级' | '神级' | '待初始化';
            体系: '强攻系' | '敏攻系' | '防御系' | '控制系' | '辅助系' | '食物系' | '召唤系' | '无战斗属性' | '待初始化';
            类别: '兽武魂' | '器武魂' | '植物武魂' | '本体武魂' | '元素武魂' | '食物武魂' | '神赐武魂' | '待初始化';
            元素属性: string[];
            先天领域: {
              名称: string;
              效果: string;
            };
            自创魂技: {
              [魂技名称: string]: {
                描述: string;
              };
            };
            魂环: {
              [魂环序号: string]: {
                颜色: '白' | '黄' | '紫' | '黑' | '红' | '橙金' | '金' | '';
                年限: string;
                来源魂兽: string;
                魂技: {
                  [魂技名称: string]: {
                    描述: string;
                  };
                };
              };
            };
          }
        }
      check:
        - 初始化时根据用户档案填入变量，禁止遗漏或省略
        - 觉醒武魂时添加新条目，并填充所有基础字段
        - 武魂发生变异或进化时更新对应字段
      品质:
        type: "'废' | '低级' | '中级' | '高级' | '顶级' | '超级' | '神级' | '待初始化'"
        check:
          - 武魂觉醒时根据先天魂力或设定决定，后天奇遇、变异、进化时可能提升
      体系:
        type: "'强攻系' | '敏攻系' | '防御系' | '控制系' | '辅助系' | '食物系' | '召唤系' | '无战斗属性' | '待初始化'"
      类别:
        type: "'兽武魂' | '器武魂' | '植物武魂' | '本体武魂' | '元素武魂' | '食物武魂' | '神赐武魂' | '待初始化'"
      元素属性:
        check:
          - 数组，记录武魂具备的所有元素属性
          - 参考属性池：金、木、水、火、土、风、雷、光、暗、精神、空间、时间、力、冰、毒、生命、毁灭、神圣、邪恶
          - 允许自定义属性，默认为普通属性，禁止添加"极致之"前缀
      先天领域:
        check:
          - 武魂品质为超级或神级时必须填写名称和效果；其他品质名称固定为"无"
      自创魂技:
        check:
          - 玩家主动领悟、觉醒时获得等明确事件后添加
          - 描述需详尽说明效果和使用条件（20字以上）
      魂环:
        check:
          - 开局时一次性填入已设定魂环信息，禁止遗漏或省略
          - 吸收魂环时，新增一个魂环序号条目，并一次性填入所有字段
          - 魂环序号为"第X魂环"（X为一到十的中文，禁止数字1~10）
          - 颜色严格按年限对应：白-十年级/黄-百年级/紫-千年级/黑-万年级/红-十万年级/橙金-二十万年级(斗三专属)/金-百万年级
          - 魂技数量：十万年以下每环1个魂技；十万年(红)/橙金每环2个魂技；百万年(金)每环最多4个魂技
          - 魂技描述需详尽（20字以上），包含物理现象、范围或数值倾向，禁止"威力巨大"等模糊词
          - 斗一时代：来源魂兽填猎杀的魂兽种族名
          - 斗二/斗三时代：来源魂兽填魂灵名称（与魂灵信息中的key对应）
          - 同一个魂灵为多个魂环供能时，多个魂环的来源填同一个魂灵名称
          - 斗二/斗三时代：当魂灵信息中某个魂灵的年限发生变化时，必须同步更新由该魂灵提供的所有魂环的颜色与年限

    魂灵信息:
      type: |-
        {
          [魂灵名称: string]: {
            类型: '人造魂灵' | '魂灵';
            当前年限: string;
            对应武魂: string;
            来源种族: string;
            外观: string;
            能力: string;
            描述: string;
          }
        }
      check:
        - 斗一时代保持空对象（斗一没有魂灵概念）
        - 斗二时代：缔结魂灵契约时新增条目；魂灵成长时更新年限
        - 斗三时代：融合人造魂灵时新增条目；通过升灵台升级时更新年限与描述
        - 魂灵年限变化时，必须同步检查并更新武魂信息中由该魂灵提供的所有魂环的颜色与年限
        - 类型说明：人造魂灵为传灵塔人工培养；魂灵为实体魂兽自愿或将死时转化的自然魂灵
        - 对应武魂：填该魂灵绑定的武魂名称
        - 来源种族：填该魂灵来源的魂兽种族名
        - 外观：20-30字描述魂灵外形，白描手法，包含体型、颜色、特征部位
        - 能力：20-40字描述魂灵自带的战斗能力
        - 当前年限：格式为具体数字+年（如"一千年"、"十万年"），升灵台升级或魂灵自行成长后更新

    功法:
      type: |-
        {
          [功法名称: string]: {
            描述: string;
          }
        }
      check:
        - 获得新功法或功法境界突破时添加/更新
        - 描述需包含具体效果、修炼方式、特殊增益

    修炼状态:
      魂力等级:
        type: number
        range: 0-200
        check:
          - 深度冥想、服用天材地宝后提升。整十级瓶颈在未吸收对应魂环前锁定
          - 提升后，检查并更新`玩家.基础信息.魂师称号`
          - 99级为凡界极限，100级及以上为神级，需通过成神考核或特殊机缘突破
          - 100级以上每10级为一个神级大阶层，提升极其困难
          - 达到100级时，必须同步更新`玩家.神位信息.神级等级`
      当前魂力百分比:
        type: number
        range: 0-100
        check:
          - 使用魂技时必须消耗魂力，根据魂技强度消耗后更新
          - 消耗参考：第一~三魂技消耗2%~5%，第四~六消耗5%~12%，第七~九消耗10%~25%，武魂真身/领域15%~30%
          - 战斗结束后若未冥想恢复，保持战斗结束时的数值

    神位信息:
      check:
        - 仅当玩家突破100级成神后才填写；未成神时所有字段保持默认值
        - 成神后必须同步更新`基础信息.魂师称号`为神级称号
      神级等级:
        type: "'无' | '神官' | '三级神(真神)' | '二级神(超神)' | '一级神' | '神王' | '至高神'"
        check:
          - 未成神时固定为"无"
          - 根据魂力等级判定：100-109为神官|110-119为三级神(真神)|120-129为二级神(超神)|130-139为一级神|140-159为神王|160+为至高神
      法则掌控:
        check:
          - 数组，记录角色掌控的所有法则类型
          - 参考法则：力量、速度、空间、时间、生命、毁灭、光明、黑暗、创造、裁决、情绪、自然、元素、命运、因果
          - 允许自定义法则，成神后根据神位属性填入
      神位:
        type: |-
          {
            [神位名称: string]: {
              类型: '传承' | '自创' | '夺取';
              描述: string;
              神装: string;
            }
          }
        check:
          - 成神时获得神位名称，可拥有多个神位
          - 神装：30-50字描述该神位对应的神装外观
      神技:
        type: |-
          {
            [神技名称: string]: {
              描述: string;
              所属神位: string;
            }
          }
        check:
          - 成神后获得的专属神级技能，描述需包含具体效果（30-60字）
      神器:
        type: |-
          {
            [神器名称: string]: {
              等级: '神器' | '超神器' | '创世神器' | '本命神器';
              描述: string;
              所属神位: string;
            }
          }
        check:
          - 神器分级：神器（普通）→超神器（一级神以上）→创世神器（至高神级）→本命神器（器武魂成神后武魂变为）
          - 描述需包含外观和能力（30-60字）

    精神力:
      精神力数值:
        type: number
        check:
          - 仅斗三时代有意义；斗一斗二时代保持0
          - 冥想、突破、服用天材地宝、经历精神冲击后更新
      精神力境界:
        type: "'不适用' | '灵元境' | '灵通境' | '灵海境' | '灵渊境' | '灵域境' | '神元境' | '神王境'"
        check:
          - 仅斗三时代有意义；斗一斗二时代固定为"不适用"
          - 根据精神力数值自动判定：0-100灵元境|101-500灵通境|501-5000灵海境|5001-20000灵渊境|20001-50000灵域境|50001+神元境
          - 精神力数值变化后必须立即比对并更新境界

    锻造信息:
      check:
        - 仅斗三时代有意义；斗一斗二时代保持默认值
      锻造师等级:
        type: number
        range: 0-9
        check:
          - 通过锻造师协会考核后晋升
          - 等级称号对应：1-2级锻造师|3-4级高级锻造师|5级宗匠|6级大师|7级宗师|8级圣匠|9级神匠
          - 0表示非锻造师
      锻造境界:
        type: "'不适用' | '百锻' | '千锻' | '灵锻' | '魂锻' | '天锻'"
        check:
          - 仅斗三时代有意义；斗一斗二时代固定为"不适用"
          - 反映当前能稳定完成的最高锻造层级

    副职业:
      type: |-
        {
          [职业名: '锻造师' | '机甲设计师' | '机甲制造师' | '机甲修理师']: {
            等级: number;
          }
        }
      check:
        - 仅斗三时代有意义；斗一斗二时代保持空对象
        - 等级范围0-9，0表示无此副职业
        - 锻造师等级称号：1-2级锻造师|3-4级高级锻造师|5级宗匠|6级大师|7级宗师|8级圣匠|9级神匠
        - 机甲设计师等级称号：1-2级初级|3-4级中级|5-6级高级|7-8级大师|9级宗师
        - 机甲制造师等级称号：1-2级初级|3-4级中级|5-6级高级|7-8级大师|9级宗师
        - 机甲修理师等级称号：1-2级初级|3-4级中级|5-6级高级|7-8级大师|9级宗师
        - 通过对应协会考核后晋升
        - 【注意】锻造师同时存在于"锻造信息"模块和副职业中：锻造信息模块记录详细的锻造境界，副职业中记录等级数字。两者的等级数值必须保持一致

    斗铠信息:
      check:
        - 仅斗三时代有意义；斗一斗二时代所有字段保持默认值
      斗铠名称:
        check:
          - 完成斗铠制作后由玩家命名
          - 升级时名称字数增加（一字→二字→三字→四字）
          - 未制作时固定为"无"
      斗铠等级:
        type: "'无' | '一字斗铠' | '二字斗铠' | '三字斗铠' | '四字斗铠'"
        check:
          - 等级门槛：一字需五环+灵海境|二字需六环+灵渊境|三字需七环+灵域境|四字需九环+神元境
      斗铠外观:
        check:
          - 30-50字描述斗铠外观、颜色、纹路等特征
          - 未制作时固定为"无"
      斗铠部件:
        type: |-
          {
            [部位: '头盔' | '胸铠' | '背铠' | '左肩铠' | '右肩铠' | '左臂铠' | '右臂铠' | '左手甲' | '右手甲' | '腿铠' | '战靴' | '翅膀' | '武器']: {
              状态: '未制作' | '已制作' | '已融合';
              金属材质: string;
            }
          }
        check:
          - 制作或融合部件时更新对应条目

    机甲信息:
      type: |-
        {
          [机甲名称: string]: {
            等级: '无' | '白级' | '黄级' | '紫级' | '黑级' | '红级' | '神级';
            描述: string;
          }
        }
      check:
        - 仅斗三时代有意义；斗一斗二时代保持空对象
        - 获取或升级机甲时更新
        - 描述包含外观和特点（30-60字）

    魂核:
      type: |-
        {
          [位置: '上丹田' | '中丹田' | '下丹田']: {
            属性: string;
            凝聚方式: '阴阳互补' | '同位共振';
          }
        }
      check:
        - 魂力达到70级、90级以及99级可凝聚；普通魂师最多两个魂核，绝世天才为三个
        - 魂核属性必须与玩家武魂属性一致

    常规魂骨:
      type: |-
        {
          [部位名称: '头骨' | '躯干骨' | '左臂骨' | '右臂骨' | '左腿骨' | '右腿骨']: {
            来源: string;
            年限: string;
            技能: { [技能名称: string]: { 描述: string; } };
          }
        }
      check:
        - 玩家为魂兽且化形状态为"未化形"或"幻化人形"时，禁止更新此模块
        - 十万年以下最多2个技能，十万年及以上魂骨可拥有2-4个技能
        - 同部位仅能存在一个魂骨，融合新魂骨时替换旧魂骨

    外附魂骨:
      type: |-
        {
          [魂骨名称: string]: {
            来源: string;
            年限: string;
            技能: { [技能名称: string]: { 描述: string; } };
          }
        }
      check:
        - 外附魂骨通常伴随进化能力，年限和技能会随玩家成长而提升，无数量限制

    武魂融合技:
      type: |-
        {
          [融合对象NPC名: string]: {
            [融合技名称: string]: {
              玩家武魂: string;
              NPC武魂: string;
              描述: string;
            }
          }
        }
      check:
        - 玩家与特定NPC在剧情中明确觉醒武魂融合技或初始化时添加
        - 描述需包含具体效果、融合条件、特殊增益

    金钱:
      check:
        - 斗一/斗二时代使用金魂币/银魂币/铜魂币体系（1金=10银=100铜），联邦币和贡献点保持0
        - 斗三时代使用联邦币（FC）体系，金魂币/银魂币/铜魂币保持0
        - 斗三学院内使用贡献点（CP），CP不可与联邦币兑换
        - 交易、获得奖励、消费时精确更新
      ${金魂币|银魂币|铜魂币}:
        type: number
        check:
          - 斗一/斗二时代交易时精确更新
          - 换算关系：1金魂币 = 10银魂币 = 100铜魂币
          - 斗三时代保持0
      联邦币:
        type: number
        check:
          - 仅斗三时代有意义；斗一斗二时代保持0
      贡献点:
        type: number
        check:
          - 仅斗三时代且在史莱克学院体系内有意义；其他情况保持0

    物品栏:
      type: |-
        {
          [物品名: string]: {
            类型: '装备' | '消耗品' | '材料' | '魂骨' | '魂导器' | '特殊' | '其他';
            描述: string;
            数量: number;
          }
        }
      check:
        - 获得物品时新增条目，类型、描述、数量三个字段同时填写
        - 消耗或丢弃后减少数量；数量归零时条目自动清理

  NPC列表:
    type: |-
      {
        [NPC名称: string]: {
          基础信息: {
            性别: '男' | '女' | '扶她' | '未知';
            年龄: number;
            种族: '人类' | '魂兽';
            身份: string;
            所属势力: string;
            当前动作: string;
            魂力等级: number;
            魂导师等级: string;
            魂师称号: string;
            封号: string;
            当前位置: string;
            外貌: string;
            是否在场: boolean;
          };
          魂兽信息: {
            种族信息: string;
            年限: string;
            血脉等级: string;
            兽形外貌: string;
            化形状态: string;
          };
          武魂信息: {
            [武魂名称: string]: {
              品质: string;
              系别: string;
              魂环: {
                [魂环序号: string]: {
                  颜色: string;
                  年限: string;
                  来源魂兽: string;
                  魂技: { [魂技名称: string]: { 描述: string; } };
                };
              };
            };
          };
          魂灵信息: {
            [魂灵名称: string]: {
              类型: '人造魂灵' | '魂灵';
              当前年限: string;
              外观: string;
            };
          };
          神位信息: {
            神位: string[];
            神级等级: string;
            法则掌控: string[];
            神技: string[];
          };
          关系列表: {
            与玩家关系状态: string;
            对玩家好感度: number;
            与其他NPC关系: string;
          };
          私密档案: {
            内心: { 性幻想: string; };
            服饰: { 上身: string; 下身: string; 内衣: string; 内裤: string; 袜子: string; 鞋子: string; };
            身体: { 乳房: string; 乳头: string; 小穴: string; 菊穴: string; 阴道: string; 子宫: string; 玉腿: string; 玉足: string; };
            生理状态: { 生理体质: string; 贞操状态: string; 怀孕状态: string; 生理记录: string; };
          };
        }
      }
    check:
      - 仅记录有名字、对剧情有影响的重要角色
      - 初次录入时，必须填写基础信息、武魂信息、关系列表完整，不得遗漏
      - 【铁律】每次回复只更新本楼正文中实际出现、被提及、或受到剧情影响的NPC，未出现的NPC不做任何更新
      - 【铁律】新的NPC出场必须更新所有变量，禁止遗漏和省略
    基础信息:
      年龄:
        type: number
        check:
          - 跨年后自动+1
          - 仅在时间跨度涉及跨年时更新
      当前动作:
        check:
          - NPC在场时，每次NPC行为发生变化后更新
          - 10-20字描述NPC正在做什么，白描手法
          - NPC不在场时固定清空为""
      魂力等级:
        type: number
        range: 0-200
        check:
          - 根据原著设定或NPC背景填入
          - 100级以上为神级
      魂导师等级:
        check:
          - 斗一时代：默认"非魂导师"
          - 斗二时代：根据NPC魂导器制造能力填入1级~10级
          - 斗三时代：默认"非魂导师"
      魂师称号:
        check:
          - 凡界称号表与玩家相同
          - 神级称号表与玩家相同
          - 成神后NPC的魂师称号改为神位名称
      封号:
        check:
          - 魂力达91级后设定，91级以下固定为"无"
          - 封号通常一至两个字
          - 成神后封号被神位称号取代
      当前位置:
        check:
          - NPC移动到新地点时更新
          - 填写具体场所名称
          - NPC离场后保持最后已知位置
      外貌:
        check:
          - 20-30字的简练外貌描述，白描手法
          - 必须涵盖外观年龄、身高体型、发色瞳色、面部特征中的至少三项
          - NPC外貌显著变化时更新（受伤、变装、化形等）
      身份:
        check:
          - 随剧情推进、NPC实际行为更新
          - 可同时拥有多个身份，用顿号分隔
      所属势力:
        check:
          - 加入或退出势力、职位升迁时更新
      是否在场:
        type: boolean
        check:
          - NPC在场时更新为true，离场时更新为false
    魂兽信息:
      check:
        - 非魂兽NPC不录入此模块
    武魂信息:
      check:
        - 必须完整填写武魂信息
        - 每10级魂力获得1个魂环，严格控制魂环数量
        - 魂环颜色包含橙金（斗三专属，20万年级，产生双魂技）
        - 魂技数量：十万年以下每环1个魂技；十万年(红)/橙金及以上每环2个魂技；百万年(金)每环最多4个魂技
        - 魂技描述需详尽（20字以上），包含物理现象、范围或数值倾向，禁止"威力巨大"等模糊词
    魂灵信息:
      type: |-
        {
          [魂灵名称: string]: {
            类型: '人造魂灵' | '魂灵';
            当前年限: string;
            外观: string;
          }
        }
      check:
        - 斗一时代NPC不录入此模块
        - 斗二/斗三时代NPC获得魂灵时新增条目
        - 当前年限：格式为具体数字+年，升级后更新
        - 外观：20-30字描述魂灵外形
        - NPC魂灵的年限变化时，同步更新该NPC武魂信息中对应魂环的颜色与年限
    神位信息:
      check:
        - 仅当NPC魂力等级达到100级以上时填写
        - 未成神的NPC不录入此模块
      神位:
        type: string[]
        check:
          - 数组，记录NPC拥有的所有神位名称
      神级等级:
        type: "'无' | '神官' | '三级神(真神)' | '二级神(超神)' | '一级神' | '神王' | '至高神'"
        check:
          - 规则同玩家
      法则掌控:
        type: string[]
        check:
          - 数组，记录该NPC掌控的法则类型
          - 参考法则池同玩家
      神技:
        type: string[]
        check:
          - 数组，仅记录神技名称（详细描述放在世界书NPC条目中）
    关系列表:
      与玩家关系状态:
        check:
          - 根据剧情发展更新
          - 参考选项：陌生人、路人、同学、同门、伙伴、盟友、挚友、对手、仇人、恋人、伴侣、师徒、主仆、雇佣
          - 允许自由填写不在列表中的关系
      对玩家好感度:
        type: number
        range: -100~200
        check:
          - 根据<好感度调准指南>进行调准
          - 更新时数值变化通常限制在-10~10的范围内
          - 发生重大事件可在-20~20范围内调整
      与其他NPC关系:
        check:
          - 记录该NPC与其他NPC之间的重要关系
    私密档案:
      check:
        - 仅当NPC为女性或扶她角色时进行更新
        - 初次填入时必须全部补全
      服饰:
        check:
          - 换装、衣物破损、脱下衣物时实时更新
          - 每个字段（上身/下身/内衣/内裤/袜子/鞋子）描述20-30字
          - 必须包含材质、颜色、款式等具体信息，白描手法
      身体:
        check:
          - 经历性行为后，应更新阴道、子宫等部位的NSFW状态
          - 每个字段描述20-30字，白描手法直接描述具体形态
          - 禁止使用模糊词（"好看的""诱人的"），必须写具体形态和尺寸特征
      生理状态:
        贞操状态:
          check:
            - 发生首次性行为后更新为"非处女·被[夺贞者]夺去"
        怀孕状态:
          type: "'未怀孕'|'受孕中(精液着床)'|'已怀孕(X月)'"
          check:
            - 内射后根据时间线和生理条件判断是否受孕

  魂兽NPC:
    type: |-
      {
        [NPC名称: string]: {
          基础信息: {
            种族信息: string;
            年限: string;
            血脉等级: '普通魂兽' | '高级魂兽' | '顶级魂兽' | '超级魂兽' | '神兽';
            元素属性: string[];
            当前动作: string;
            当前位置: string;
          };
          兽形外貌: string;
          对玩家态度: string;
        }
      }
    check:
      - 记录未化形的重要魂兽NPC
      - 死亡、离场或化形后不再需要记录的魂兽NPC进行删除
      - 【铁律】每次回复只更新本楼正文中实际出现的魂兽NPC
