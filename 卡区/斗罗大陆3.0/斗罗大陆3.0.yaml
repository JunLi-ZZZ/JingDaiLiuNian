极大程度免疫物理伤害。雷霆与狂风形成精神屏障削弱敌人，使用者在空间闪烁时，下一次攻击附带致命雷殛。","soul1CustomSkills":[{"name":"麟影瞬闪","desc":"破碎周身空间实现超短距离瞬移，并在路径留下雷电残影。残影爆裂时会对周围敌人造成短暂眩晕与空间撕裂伤害，兼具位移与控场。"},{"name":"震霄天罚","desc":"引动九霄惊雷灌注全身鳞片，向前方释放密集的雷刃波。攻击附带破甲效果，且能麻痹敌方魂力运行，使其在短时间内无法释放魂技。"},{"name":"虚空噬魂","desc":"结合空间与精神双重力量制造虚空力场。身处其中的敌人将遭受剧烈精神震慑，感知被大幅削弱，且受空间扭曲挤压导致移动速度下降。"}],"soul2Name":"混沌神宴","soul2Cat":"食物武魂","soul2Qual":"超级","soul2Sys":"召唤系","soul2Attrs":["金","木","水","火","土","风","雷","光","暗","精神","空间","时间","力","冰","毒","生命","毁灭","神圣","邪恶"],"soul2Desc":"此武魂乃混沌本源所化。通过消耗魂力产出蕴含世间一切法则气息的食肴，食用者可临时开启时空裂隙，召唤来自各维度的强大生物。每种食材皆代表一种极致属性，是统御诸界意志的至高载体。","soul2DomainName":"万象归虚","soul2DomainDesc":"在领域内，持有者召唤出的生物全属性提升百分之五十。领域笼罩范围内，强行剥夺敌方的元素掌控权，并利用混乱的法则制造时空泥潭与精神风暴，大幅削弱敌方攻防能力。","soul2CustomSkills":[],"soul3Name":"","soul3Cat":"","soul3Qual":"","soul3Sys":"","soul3Attrs":[],"soul3Desc":"","soul3DomainName":"","soul3DomainDesc":"","soul3CustomSkills":[],"ringData":{"soul1":["黄","紫","紫"],"soul2":["无","无","无"],"soul3":[]},"ringDetailData":{"soul1":{"0":{"beast":"奔雷影豹","year":"420","skillName":"雷影瞬闪","skillDesc":"周身雷光环绕，魂师瞬间爆发极致速度并在原地留下残影。碰撞瞬间引发雷暴，对周遭敌人造成雷电麻痹效果并短时干扰其视觉感知。"},"1":{"beast":"虚空幻蝶","year":"1800","skillName":"震虚压制","skillDesc":"鳞片剧烈颤动释放空间共振频率，对前方区域施加精神震慑。使敌方因感知错乱陷入眩晕，其周身空间被高度压缩，致使行动力大幅下降。"},"2":{"beast":"九天雷鹏","year":"6500","skillName":"霄云雷翼","skillDesc":"风翼实体化为雷霆之羽，大幅提升魂师机动性并获得持续飞行能力。俯冲时雷光化作刃芒切割空间，对目标造成无视部分物理防御的打击。"}},"soul2":{"0":{},"1":{},"2":{}},"soul3":{}},"bones":{"head":"","torso":"","larm":"","rarm":"","lleg":"","rleg":"","ext1":"霆空霄影翼","ext2":""},"boneSrc":{"head":"","torso":"","larm":"","rarm":"","lleg":"","rleg":"","ext1":"裂空震天鹏","ext2":""},"boneYear":{"head":"","torso":"","larm":"","rarm":"","lleg":"","rleg":"","ext1":"120000","ext2":""},"boneSkillName":{"head":"","torso":"","larm":"","rarm":"","lleg":"","rleg":"","ext1":"霄影瞬闪","ext2":""},"boneSkillDesc":{"head":"","torso":"","larm":"","rarm":"","lleg":"","rleg":"","ext1":"振动羽翼干预空间结构，在百米内实现无视障碍的瞬间移动，并在落点产生大范围雷电冲击波施加精神震慑。","ext2":""},"boneSkill2Name":{"head":"","torso":"","larm":"","rarm":"","lleg":"","rleg":"","ext1":"风雷结界","ext2":""},"boneSkill2Desc":{"head":"","torso":"","larm":"","rarm":"","lleg":"","rleg":"","ext1":"双翼张开化作风雷交织的绝对防御，能够吞噬空间能量并转化为自身魂力，同时对靠近的敌人造成剧烈麻痹。","ext2":""},"boneSkill3Name":{"head":"","torso":"","larm":"","rarm":"","lleg":"","rleg":"","ext1":"","ext2":""},"boneSkill3Desc":{"head":"","torso":"","larm":"","rarm":"","lleg":"","rleg":"","ext1":"","ext2":""},"boneSkill4Name":{"head":"","torso":"","larm":"","rarm":"","lleg":"","rleg":"","ext1":"","ext2":""},"boneSkill4Desc":{"head":"","torso":"","larm":"","rarm":"","lleg":"","rleg":"","ext1":"","ext2":""},"sgLevel":0,"gongfa":[{"type":"功法","grade":"绝世","name":"虚极震寰诀","detail":"传闻由麟影半神感悟位面崩裂与天雷交织之景所创。此法讲究以身化影，引九霄神雷淬经脉，识海构筑虚空涡旋，是契合多属性共振的高深法门。","effect":"大幅提升魂力运转速度，使魂力附带空间撕裂与雷震麻痹属性。修炼者可实现短距离瞬移，并在攻击中融入精神压制，令敌方陷入感知紊乱。"}],"soulCores":{"count":0,"method":"","cores":[]},"inventory":{"gold":0,"silver":0,"copper":0,"outfits":[],"soulDevices":[],"spareBones":[],"herbs":[],"food":[],"others":[]},"chapter":"序章","event":"【霍氏纪8年12月】
      铁血宗攻入唐门驻地灭门，唐雅孤身逃亡至史莱克学院。","arrivalType":"穿越者","knowsPlot":false,"location":"","locCustom":"","identity":"青鸟出身于星罗帝国北疆的隐世家族，体内流淌着上古雷麟与影兽交织的奇诡血脉。六岁觉醒武魂震霄影麟时，伴生的狂雷曾击穿家族祠堂，令其被族中长老视为招致灾厄的孤星。为了躲避家族内斗的倾轧，她孤身流浪至天斗帝国边境，在杀戮与铁血中自我磨砺，年仅十二岁便跨入三十六级魂尊之列。她常年游走于落日森林边缘，以猎杀魂兽换取生存资源，冷冽的外表下潜藏着对力量的极致渴望。她如同一道撕裂黑夜的紫电，正等待着重回星罗复仇的契机。","npcRelation":"","extraBg":"","nsfwPersonality":{"tags":["傲娇","闷骚","暴露癖","性欲旺盛","痴女","容易高潮体质","骑乘偏好","口交癖","喜欢被观看","喜欢被束缚","NTR幻想","触手幻想","催眠易感","玩具爱好","体液执着","制服诱惑","反差魅力"],"hobbies":["引诱异性","被窥视的刺激","制作媚药","舞蹈（挑逗性）","沐浴（暴露性）","收集情趣内衣","自慰研究","写淫秽日记","公共场合无内衣","试穿暴露服装","研究春药","在高处暴露","挑逗后假装无辜"],"extra":""},"beastNsfwPersonality":{"tags":[],"hobbies":[],"extra":""},"speechData":{"tone":["傲娇毒舌","口是心非","故作成熟","冷嘲热讽","调皮捉弄"],"habit":["自称\"姐姐\"","经常反问","爱用感叹词","喜欢命令语气","爱翻白眼表达不满","用哼声代替回答","喜欢给人贴标签","语速忽快忽慢","时常自我吐槽","爱重复对方的话加以嘲讽","紧张时语速加快"],"catchphrase":"","addressHabit":"","samples":[{"scene":"看人掉入自己设计的圈套","line":"哎呀，这就掉进去了？看来姐姐计算的一点都没错！怎么不反抗呢？你就乖乖待在坑里当个活标本，等姐姐研究完这卷丹方再说吧！"},{"scene":"旅行途中发现队友想要偷懒","line":"走不动了？才走几步就喊累，你这体质也敢说变强？去，把行李背上！敢拖姐姐后腿，我就在你水壶里加点让你精神百倍的“好料”！"},{"scene":"在森林中将亲手炼制的“毒药”递给贪婪的对手","line":"哎呀，你该不会真以为这颗废丹能救命吧？姐姐辛辛苦苦炼出来的东西，凭你也配吃？哼，真是个没脑子的倒霉蛋！"},{"scene":"发现同伴试图窥视自己正在研读的古老药谱","line":"站住！别以为姐姐不知道你在想什么，想偷看我的冥想法？这种低级错误也犯，你脑子里装的难道全都是废弃药渣吗？"},{"scene":"面对强大魂兽追击时冷静地指挥受惊的同伴","line":"闭嘴！与其在这里像个没头苍蝇一样乱撞，不如听姐姐的指令往左跑！怎么，你居然在怀疑这本旅行手册的准确性？"},{"scene":"被同伴救下后虽然心慌但依然故作镇定","line":"谁要你多管闲事了？姐姐刚才只是在尝试一种新型的修炼姿态，你这莽夫冲出来干嘛？哼，既然这么闲就去洗药草！"},{"scene":"在迷路的边缘因紧张而语速飞快地掩饰尴尬","line":"谁说姐姐带错路了？我只是在重新规划最佳旅行路线，这种事你懂什么？快闭嘴跟着，再多嘴就把你丢给曼陀罗蛇！"}]},"beastSpeechData":{"tone":[],"catchphrase":"","samples":[]},"fusionSkills":[],"selfFusionSkills":[{"comboKey":"震霄影麟×混沌神宴","name":"寰宇寂灭宴","effect":"影麟化作虚空遁影，在混沌神宴构建的全属性领域内极速穿梭。麟影所过之处，空间崩裂并召唤出携带全属性力量的混沌巨兽。领域内一切法则瓦解，敌人将被剥夺感知并承受混元真实伤害。"}],"npcRelations":[],"_savedAt":1776235332783,"_isNpc":true,"_npcToUserRelType":"","_npcToUserAttitude":"","_npcToUserDesc":"","_npcMotivation":""}'

