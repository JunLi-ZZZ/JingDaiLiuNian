---
# 过渡层·寂静城（贯穿地幔的垂直长塔）
# 卢克领地，魔力驱动升降平台，越深温度越高

# ─── 区域：寂静城·倒悬巨塔 ───
# 旧称：寂静城（Lv.58~75）
# 原作：制造者卢克建造的贯穿地幔的巨型机械塔

寂静城_倒悬巨塔:
  区域总述:
    层级: 过渡层（约2000~3000km深度，贯穿地幔）
    物理后果:
      地形: |
        寂静城是制造者卢克建造的垂直长塔，
        从中层界底部贯穿地幔直抵深层界入口。
        塔身直径数公里，内部是层层叠叠的机械结构——
        巨大的齿轮、机械臂、升降平台和能源管道
        构成了一座自给自足的垂直机械城市。
        折叠后塔身被进一步拉伸，
        原本紧凑的楼层间距被扩大为数百米的垂直空间，
        但卢克的造物仍在沉默运转，维持着塔的结构完整。
      光照: 塔内无人造太阳覆盖，完全依赖卢克的光之构装体提供冷白色照明
      重力: 从倒置渐变为正常（穿越地幔过程中重力再次反转）
      温度气压: 随深度急剧攀升，从金属冷感到灼热硫磺
      水文: 无天然水源，冷却系统循环液体

  子区域:
    倒悬王座外廊（Lv.58~70）:
      旧称: 寂静城上层（倒悬的瞭望台~卢克的聚光镜）
      描述: |
        寂静城上层区域，巨大的齿轮和机械臂构成钢铁丛林。
        卢克的造物在此沉默运转了不知多少年。
        温度开始攀升，空气从金属味渐变为硫磺气息。
        从外廊向下望去，能隐约看到星核的暗红光芒。
        天翼种占据了外廊的一处开阔平台，
        将其改造为临时图书馆。
        收集整理关于"制造者卢克"的所有图纸和技术文献——
        卢克留下的每一张图纸都可能隐藏着弑神级别的秘密。
        天翼种坐在巨大的齿轮上读书，脚下是运转的星球机械。
        个体实力足以碾压此处一切威胁，真正的危险来自知识本身。
        十八翼议会对此处的情报优先级极高。
      魔物: 光之以旦（幻影）、钢铁龙蜥

    能源熔炉:
      旧称: 寂静城中层（能源熔炉）
      描述: |
        寂静城中段，塔身最宽阔的区域。
        巨大的熔炉占据了整个楼层，
        地热能量从地幔裂隙中涌入，被卢克的装置
        转化为驱动整座塔运转的动力。
        熔炉周围温度极高，空气扭曲变形，
        只有穿戴隔热装备才能在此停留。
        熔炉核心的火焰从未熄灭——
        那是卢克留下的永恒之火。
      魔物: 火焰构装体、熔岩守卫
      环境危险: 极端高温、蒸汽喷射

    王之书库:
      旧称: 寂静城深层（王之书库）
      描述: |
        寂静城最深处，卢克储存古代知识的禁地。
        书架从地面延伸至数百米高的穹顶，
        每一本书都被光之构装体的力场保护。
        空气中弥漫着古老纸张和金属油墨的气味，
        温度在此反而降低——卢克的冷却系统
        在书库区域仍在完美运转。
        据说书库最深处的密室中，
        藏有卢克关于"星核"的终极研究笔记。
      魔物: 光之舞者、知识守卫
      环境特征: 恒温保护、光之力场
