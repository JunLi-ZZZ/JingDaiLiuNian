狄瑞吉领_博隆克斯荒境:
  层级: 第三层·深层界北部边缘
  性质: 使徒领地·荒凉边境
  描述: |
    深层界北部边缘，地壳板块逐渐稀疏，
    岩浆海洋的温度也随着远离星核而降低。
    博隆克斯是深层界最荒凉的区域——
    冷却的岩浆形成了灰黑色的荒原，
    德拉里昂的光芒在此几乎不可见，
    只有地热裂隙中偶尔喷出的蒸汽证明这里并非完全死寂。
    使徒狄瑞吉选择了这片荒境作为领地，
    痛苦的气息从他的领地向外渗透，
    靠近边境的魔界原住民常无故感到刺痛和不安。
  控制范围: 深层界北部边缘的冷却荒原
  态度: 敌意——狄瑞吉以众生的痛苦为食
