---
寂静城_克洛诺斯岛:
  层级: 过渡层（寂静城顶端入口）
  性质: 联合调查团驻地·深层界入口管控站
  描述: |
    寂静城顶端的一座人工平台，
    是进入这座贯穿地幔的垂直长塔的唯一入口。
    贝尔玛尔公国、天界守备队和冒险家公会
    在此设立了联合调查团，管控所有进出深层界的人员。
    平台上设有补给仓库、医疗站和临时营房，
    空气中已能闻到从塔内深处涌上来的硫磺气息。
    卢克复活后仍居住在寂静城内部，
    联合调查团与这位使徒维持着微妙的共存关系——
    卢克不阻止通行，但也不保证安全。
  常驻势力:
    - 联合调查团（公国+天界+冒险家公会三方联合）
    - 卢克（使徒，寂静城主人，不干涉通行）
  人口构成: 调查团成员和过路冒险家，无平民定居
  功能: 深层界通行许可审批、补给、伤员后送
