---
# ─── 区域：时空裂隙·琥珀回廊 ───
# 旧称：时空之门（Lv.70~80）
# 原作：回溯阿拉德历史关键节点的时空异常

时空裂隙_琥珀回廊:
  区域总述:
    层级: 非固定——时空裂隙散布于深渊各层，连接过去的历史节点
    物理后果:
      地形: |
        折叠不仅压缩了空间，也在时间维度上造成了裂痕。
        三个世界被强行叠合时，某些历史事件的巨大能量
        在时空中留下了永久的"烙印"——
        这些烙印在深渊各层形成了琥珀色的时空凝结点。
        凝结点内部的时空是"凝固"的，
        历史事件在其中永恒重演，如同被封入琥珀的昆虫。
        冒险家穿过凝结点后会被投射到事件发生的那一刻，
        以参与者的身份经历那些改变世界的瞬间。
      光照: 取决于历史节点的原始环境
      重力: 正常（还原历史节点的原始物理环境）
      温度气压: 还原历史节点的原始环境
      水文: 还原历史节点的原始环境

  子区域:
    格兰之火（Lv.70~73）:
      描述: |
        表层界日心岛崖壁梯田带中段的一处琥珀色光球，
        靠近时空气温度骤升，能闻到焦木气味。
        穿过凝结点后，冒险家被投射到格兰之森大火
        发生的那个夜晚——折叠前的平坦森林在烈焰中崩塌，
        浓烟遮蔽星空。火焰吞噬了整片森林，
        这场灾难改变了贝尔玛尔公国的命运。
        凝结点中的火焰永远不会熄灭，
        每一次穿越都是对那个夜晚的重新经历。
      环境特征: 时空凝固、火焰环境、高温

    瘟疫之源（Lv.71~74）:
      描述: |
        暗礁沉陆裂隙隧道深处的一处琥珀色裂纹，
        裂纹周围的岩壁上生长着不属于深渊的黑色菌丝。
        穿过凝结点后，冒险家被投射到诺伊佩拉
        瘟疫爆发的瞬间——繁华的暗精灵城市
        在数小时内沦为死城，黑色菌丝从地下
        蔓延至每一栋建筑。冒险家在瘟疫扩散的
        混乱中追溯病源，见证一个文明的崩溃。
      环境特征: 时空凝固、瘟疫环境、菌丝蔓延

    卡勒特之初（Lv.72~75）:
      描述: |
        中层界根特战区外围某段废弃防线上的琥珀色光柱，
        靠近时能闻到火药和硝烟的气味。
        穿过凝结点后，冒险家被投射到
        卡勒特叛乱的起源之刻——
        年轻的沙影贝利特与兰蒂卢斯在天界底层的
        废铁峡谷中秘密集结，一场改变天界命运的
        叛乱正在酝酿。冒险家在混乱的地下集会中
        见证理想主义如何一步步滑向暴力革命。
      环境特征: 时空凝固、地下集会、战前氛围

    绝密区域（Lv.74~77）:
      描述: |
        表层界某座偏远浮空岛岩层中的琥珀色光斑，
        光斑表面偶尔闪过扭曲的人形轮廓。
        穿过凝结点后，冒险家被投射到
        比尔马克帝国试验场运转的巅峰时期——
        帝国科学家在密室中进行魔界生物转移实验，
        铁笼中关押着半人半魔的失败品，
        惨叫声被隔音符文封锁在墙壁之内。
        冒险家在这座残酷的实验设施中揭开
        帝国覆灭前最黑暗的秘密。
      环境特征: 时空凝固、实验设施、伦理禁区

    暗黑圣战（Lv.73~76）:
      描述: |
        中层界废弃工业区某段岩壁上的一处巨大琥珀色光幕，
        光幕中隐约可见刀光剑影的轮廓。
        穿过凝结点后，冒险家被投射到第一次圣战战场——
        五圣者以血肉之躯对抗使徒的军团，
        光与暗的力量在战场上激烈碰撞，
        大地在神级力量的冲击下龟裂。
        这是阿拉德历史上规模最大的正邪决战，
        冒险家在这场史诗级战役中扮演关键角色。
      环境特征: 时空凝固、大规模战场、神级能量残留

    昔日悲鸣（Lv.74~77）:
      描述: |
        表层界下部某座沉陆的断崖上，
        一处散发着剑意的琥珀色光柱直贯崖壁。
        穿过凝结点后，冒险家被投射到
        四剑圣与使徒希洛克的决战现场——
        四位剑术巅峰的武者联手对抗使徒，
        剑气撕裂了大地，悲鸣回荡在战场上空。
        这场战斗的结局改变了阿拉德的剑术传承，
        凝结点周围的岩壁至今仍残留着剑痕。
      环境特征: 时空凝固、剑意残留、决战场

    凛冬（Lv.76~79）:
      描述: |
        外环海岸靠近深渊边缘的一处琥珀色冰晶，
        凝结点周围温度骤降至零下，海水在附近结成薄冰。
        穿过凝结点后，冒险家被投射到
        冰龙斯卡萨苏醒的那一刻——
        极寒从大地深处涌出，冰晶在空气中凝结，
        一头沉睡万年的冰龙缓缓睁开了眼睛。
        冒险家在冰封的世界中追溯灾难的源头，
        凝结点中的寒气是外环海岸局部冰冻现象的成因。
      环境特征: 时空凝固、极寒环境、龙息残留

    谜之觉醒（Lv.77~80）:
      描述: |
        深渊各层不定期出现的游移凝结点，
        外观是一团不断变换形状的琥珀色薄纱。
        穿过凝结点后，冒险家被投射到
        使徒赫尔德操控艾丽丝的真相揭露之刻——
        看似平静的日常背后隐藏着使徒的操控，
        冒险家在层层幻象中剥离真实与虚假，
        最终直面赫尔德布下的棋局。
        此凝结点因赫尔德的幻术本质而无固定位置，
        是所有琥珀回廊中最难捕捉的一个。
      环境特征: 时空凝固、幻象环境、位置不定
