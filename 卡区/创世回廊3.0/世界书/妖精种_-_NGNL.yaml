---
第10位_妖精种:
  分类: 中位·自由探索团
  动机: |
    天性好奇且缺乏长期规划，涌入深渊的理由简单到令人发笑——
    "听说那里有好看的发光石头"、"想尝尝魔物肉的味道"、
    "隔壁部落去了我们也要去"。
    可能在格兰之森的花丛中睡了三天，也可能突然钻进悲鸣洞穴最深处只因为里面的回声很好听。
    但在混乱的表象下，妖精女王对深渊战略价值有清醒认知：
    泰拉石是妖精种魔法工艺的完美原料。
    蜂群式编队靠本能和情绪共振维持松散协作，
    经常不请自来地"跟着"某支冒险队，
    在战斗中提供意想不到的辅助——或者添乱。
  与阿拉德人: |
    两极分化。炼金术士视其为珍贵魔法催化剂来源，
    前线士兵把它们当偷吃军粮的害虫。
