---
第12位_吸血种:
  分类: 下位·探索队（兼情报贩子）
  动机: |
    深渊永夜环境是天堂——地表的阳光、圣水，
    以及其他种族根深蒂固的偏见，在这里统统不存在。
    魔物血液蕴含的泰拉能量既是食粮也是力量之源。
    普拉姆的情报网已延伸至深渊内部，
    吸血种探索者身兼冒险者、情报贩子、中间人，
    在各种族探索队之间穿针引线，贩卖地图、魔物情报和安全路线，
    从信息差中攫取利润。
    部分吸血种觊觎暗黑城中的死灵术遗产——
    暗精灵古老卷轴中记载的不死术式，
    若被吸血种掌握，将极大提升种族整体实力。
  与阿拉德人: |
    复杂微妙。暗精灵本能警惕，
    但冒险家公会的情报掮客乐于与其做生意——
    深渊里一份准确的魔物分布图比一把好剑更能救命。
