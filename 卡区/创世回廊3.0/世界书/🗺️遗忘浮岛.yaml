---
遗忘浮岛·结晶矿脉:
  层级: 第一层·表层界中部（游移浮岛）
  性质: 神秘浮岛·转移结晶产地
  旧称: 遗忘之地
  描述: |
    表层界中段一座不定期出现的神秘浮空岛，
    岛屿表面覆盖着转移结晶矿脉。
    折叠时某种空间异常导致这座岛屿
    沿某种规律在表层界漂移，
    出现位置不固定，每次出现持续数周后又消失。
    岛屿表面的转移结晶是珍贵的魔法材料，
    能用于空间传送和次元魔法。
    乔安·费雷诺在岛上设立了临时商站，
    每次岛屿出现时就开张营业，
    收购冒险家采集的结晶。
    岛屿中央有一片湖泊——拉古斯晶湖，
    湖水因高浓度转移能量而呈现七彩光泽。
  常驻势力:
    - 乔安·费雷诺商站（临时）
    - 兽人族采矿队
    - 面霸村村民
  魔物: 结晶守卫、空间异变体
  环境特征: 转移能量浓郁、位置不定、七彩光泽

  子区域:
    拉古斯晶湖:
      描述: |
        遗忘浮岛中央的一片湖泊，
        湖水因高浓度转移能量而呈现七彩光泽。
        湖底沉积着大量金属矿物和转移结晶，
        是岛上最珍贵的资源区。
        兽人族与面霸村村民为争夺矿权而冲突不断，
        但盟约禁止他们互相杀害，
        冲突被转化为"游戏"——
        双方以采矿竞赛决定当日的开采权。
      魔物: 晶湖守卫、水晶元素
      环境特征: 七彩湖水、高浓度转移能量
