---
普雷领_斯塔滕岛:
  层级: 第三层·深层界（岩浆海洋中的大型稳定板块）
  性质: 使徒领地·深层界唯一的友善区域
  描述: |
    岩浆海洋中一块异常稳定的大型地壳板块，
    使徒普雷在此建立了自己的领地。
    与其他使徒领地不同，斯塔滕岛对外界人最为友善——
    普雷允许魔界原住民和少数冒险家进入岛屿，
    甚至偶尔派遣使者前往翠结界与外界交流。
    岛上的环境经过普雷的力量调节，
    温度和空气质量远优于深层界平均水平，
    是翠结界之外唯一适合非魔界生物短暂停留的区域。
    普雷对赫尔德的态度不明，
    但他对"游戏"这一概念表现出了浓厚的兴趣。
  控制范围: 斯塔滕岛及周边小型板块
  态度: 友善开放，深层界的异数
  NPC: 普雷（使徒）
