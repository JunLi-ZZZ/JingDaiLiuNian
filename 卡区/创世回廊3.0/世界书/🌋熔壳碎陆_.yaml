# ─── 区域：深层界·熔壳碎陆 ───
# 旧称：魔界（地轨中心、中央公园等）（Lv.84~90+）
# 原作：使徒各据领地，魔界协会广场为罕见中立安全区

深层界_熔壳碎陆:
  区域总述:
    层级: 第三层·深层界（约2000km以下，星核层）
    物理后果:
      地形: |
        魔界原为独立的异世界，折叠后被压入迪司博德星球的
        最核心层——星核周围的岩浆海洋和残余地壳上。
        原魔界的大陆在折叠挤压下碎裂为无数地壳板块，
        漂浮在岩浆海洋表面，板块间以岩桥和地下隧道连接。
        "天穹"是星核上方数百公里高的岩石穹顶，
        穹顶上悬挂着德拉里昂——
        一颗散发银蓝色光芒的神秘光体，是深层界唯一的"月亮"。
        使徒各据一方板块为领地，普通生物在此生存极为艰难。
      光照: 无太阳，德拉里昂提供银蓝色微光，岩浆和地热提供暗红色光
      重力: 正常（穿过寂静城后重力再次反转回正常方向）
      温度气压: 极高温，空气中弥漫硫磺和金属气味，气压远高于地表
      水文: 岩浆河流和地热温泉遍布，偶有毒水潭

  子区域:
    灼岩前哨（Lv.84~86）:
      旧称: 魔界营地
      描述: |
        穿过寂静城抵达深层界后的第一块稳定地壳板块。
        板块从岩浆海洋中突出约三十米，
        表面被地热烤成焦黑色，边缘不断有岩浆溅落。
        冒险家在板块中央地热温度相对较低的凹地
        建立了简陋的前哨营地——帐篷以耐热金属支撑，
        饮用水靠冷凝地热蒸汽获取。
        德拉里昂的银蓝色微光从穹顶洒下，
        与脚下岩浆的暗红色光芒交织成诡异的紫红色调。
        这是冒险家踏入深层界的第一站，也是最后的安全补给点。
      聚落功能: 深层界前哨站、补给点
      环境危险: 极端高温、有毒气体、岩浆溅射

    锈钟旧城（Lv.85~87）:
      旧称: 时间广场
      描述: |
        灼岩前哨东北方向的一块大型地壳板块，
        折叠时魔界旧城区的一部分被压在这块板块上。
        极端高温和硫磺气体将建筑外墙腐蚀成铁锈色，
        广场中央的巨型时钟塔在地热扭曲中倾斜，
        指针以不规律的速度转动——
        并非时间魔法，而是星核层极端温差
        导致金属部件热胀冷缩不均匀的结果。
        佧修派在此维持着一定程度的秩序，
        是深层界少数有"文明"气息的区域。
      魔物: 佧修派战士、热变异体

    裂谷兽场（Lv.85~88）:
      旧称: 兽人峡谷
      描述: |
        两块地壳板块之间的一道深邃裂谷，
        底部流淌着缓慢移动的岩浆河。
        裂谷两壁被地热烤成暗红色，
        岩壁上的矿物结晶在德拉里昂的微光下闪烁。
        变异兽人族群占据了裂谷两侧的岩架，
        以投掷熔岩石块为武器互相攻击，
        嚎叫声在狭窄的裂谷中反复回荡。
        这里没有秩序，只有弱肉强食。
      魔物: 变异兽人、裂谷掠食者、熔岩蜥蜴

    穹顶蝠窟（Lv.86~88）:
      旧称: 恐怖的栖息地
      描述: |
        深层界岩石穹顶上的一处巨大裂隙洞穴，
        洞穴向穹顶内部延伸数公里。
        穹顶岩层中残留的地热使洞穴内部温暖潮湿，
        数以万计的变异吸血蝙蝠倒挂在穹顶岩壁上，
        它们的排泄物在洞穴底部积累了数百年，
        形成了深达数米的腐蚀性酸池。
        酸池散发的气体与穹顶裂隙中渗出的硫磺混合，
        使这片区域成为深层界空气最恶劣的地带。
      魔物: 变异吸血蝙蝠群、蝠王
      环境危险: 酸池、蝙蝠群袭、有毒气体

    热风甬道（Lv.87~89）:
      旧称: 疾风地带
      描述: |
        连接多块地壳板块的一条狭长峡谷通道，
        两侧板块间距仅数十米，底部是流速极快的岩浆河。
        星核的热量从岩浆河面蒸腾而上，
        在狭窄的峡谷中形成持续的高速热风——
        风速足以将普通人吹飞，
        热风裹挟的火山灰和熔岩碎屑形成移动的风刃墙。
        穿越热风甬道是连接深层界各板块的捷径，
        但代价是随时可能被热风撕碎或被火山灰灼伤。
      魔物: 风元素、火山灰巨人
      环境危险: 极端风速、高温风刃、火山灰

    赤树荫地（Lv.87~90）:
      旧称: 红色魔女之森
      描述: |
        深层界一块罕见的含水地壳板块，
        板块下方的地下水脉被地热加温后渗出地表，
        形成了遍布板块的热泉网络。
        热泉的矿物质和德拉里昂的银蓝光
        滋养出一片不可思议的红色森林——
        树木以地热和光辐射为能量源，
        树叶因富含铁质矿物而呈深红色，
        树干中流淌着类似血液的高温树液。
        魔女的魔法笼罩着整片森林，
        进入者会被热蒸汽和红色雾气中的幻象迷惑。
      魔物: 红色魔女、血树精、幻象猎手
      环境危险: 幻象迷惑、高温树液灼伤、热蒸汽

    翠结界（Lv.88~90+）:
      旧称: 中央公园
      描述: |
        深层界最大的地壳板块中央，
        一片翠绿的草地和花园不可思议地存在于
        岩浆和硫磺的包围之中。
        凯蒂大婶的力量在此创造了一个
        与深层界环境完全隔绝的结界——
        结界内空气清新，温度宜人，甚至有蝴蝶飞舞，
        结界外一步之遥便是灼热的焦黑荒原。
        这里是魔界协会的所在地，
        深层界唯一的主城和中立安全区。
        各方势力在此暂时放下敌意，进行交易和情报交换。
        对于穿过寂静城抵达深层界的冒险家而言，
        翠结界是岩浆地狱中唯一的绿洲。
      聚落功能: 深层界唯一主城、中立安全区、魔界协会驻地
      NPC: 凯蒂大婶

    血晶隧网（Lv.86~90+）:
      旧称: 血色防线
      描述: |
        连接深层界各地壳板块的地下隧道网络，
        由古代魔界文明在板块底部的岩层中开凿。
        隧道内壁覆盖着一种发出暗红色光芒的血色矿石——
        这种矿石是星核层特有的高温结晶矿物，
        在地热作用下持续发出暗红色荧光。
        隧道穿行于岩浆海洋下方的稳定岩层中，
        但部分路段因地壳运动而断裂或偏移，
        行走其中的旅人可能在岔路中迷失数日。
        血晶隧网是深层界的交通命脉，
        也是板块之间除岩桥外唯一的安全通道。
      环境危险: 隧道坍塌、方向迷失、高温
