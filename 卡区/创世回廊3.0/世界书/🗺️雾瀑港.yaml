---
雾瀑港·西海岸城镇:
  层级: 第一层·表层界中下部（约250~300km深度，悬空航道岩架上缘）
  性质: 港口城镇·魔法师公会驻地·天界航运枢纽
  副本区域参照: → 悬空航道·西海岸岩架·雾瀑港（含环境描述）
  旧称: 西海岸
  描述: |
    表层界中下部，面朝天空之海的最后一段宽阔岩架上，
    一座依瀑布而建的港口城镇。残余海水从上方岩层裂隙涌出，
    数条垂直瀑布从城镇两侧倾泻而下，坠入天空之海后
    化为永恒的蓝白色水雾——城镇因此终年笼罩在薄雾之中，
    空气湿润，建筑表面凝结着细密的水珠。
    这里是表层界通往天界的唯一航运枢纽。
    飞空艇码头沿岩架边缘一字排开，
    摩伽陀和各式飞空艇在此装卸货物、补充燃料，
    然后沿锚塔遗迹群的重力锚点航路穿越天空之海。
    魔法师公会的尖塔是城镇最高的建筑，
    塔顶的导航灯在天空之海的幽蓝光晕中日夜闪烁，
    为归航的飞空艇指引方向。
    城镇的街道以码头为中心向内陆延伸，
    海鲜酒馆、航海用品店、炼金材料铺和旅店鳞次栉比。
    因为是天界航路的必经之地，
    各方势力在此都设有办事处或情报站——
    公国的航务署管理航线调度，
    德洛斯帝国的商行经营天界货运，
    虚祖的武者在此搭乘飞空艇前往天界执行任务。
    城镇氛围比白垩王城更加自由散漫，
    水手、魔法师、冒险家和商人混杂其中，
    酒馆里永远飘着海鲜的香气和飞空艇燃料的焦味。
  常驻势力:
    - 魔法师公会西海岸分部（魔法研究、航路维护、导航灯管理）
    - 贝尔玛尔公国航务署（航线调度、飞空艇注册、港口治安）
    - 德洛斯帝国商行西海岸支部（天界货运、军需转运）
    - 虚祖联络处（武者中转、情报交换）
    - 飞空艇工匠行会（船只维修、改装、燃料补给）
    - 吸血种情报屋（隐蔽经营，贩卖天界与深渊情报）
  关键NPC: 魔法师公会西海岸分部长、港务长、飞空艇船长公会会长
  人口构成: 阿拉德人为主，水手和魔法师比例远高于其他城镇，十六种族探索者偶有过境
  治安: 公国航务署维持基本秩序，但码头区和酒馆街较为混乱，斗殴时有发生
  经济: 天界航运贸易、飞空艇维修补给、炼金材料交易、海鲜餐饮
  环境特征: 永恒水雾、瀑布轰鸣、幽蓝光晕（天空之海反光）、湿润空气

  子区域:
    飞空艇码头:
      描述: |
        城镇面朝天空之海的一侧，岩架边缘向外延伸的
        数十座石质栈桥构成的码头群。
        栈桥末端锚定着大小不一的飞空艇和摩伽陀，
        起重吊臂在雾气中忙碌地装卸货物。
        码头最外侧是深渊——脚下就是天空之海的
        幽蓝色反重力水体，水雾从下方持续上涌。
        出发前往天界的旅客在此登船，
        归来的冒险家在此踏上坚实的岩架，
        长舒一口气。
      功能: 飞空艇停泊、货物装卸、旅客登船

    魔法师公会尖塔:
      旧称: 西海岸魔法师公会
      描述: |
        城镇最高处的一座白色石塔，
        塔身被藤蔓和水汽凝结的冰晶装饰。
        塔顶的导航灯以魔法驱动，
        在天空之海的幽蓝光晕中发出温暖的金色光芒。
        公会内部设有魔法研究室、图书馆和学徒宿舍，
        魔法师们在此研究天空之海的反重力原理
        和锚塔遗迹群的古代魔法。
        公会地下层连接着一条通往锚塔遗迹群的秘密通道，
        是紧急撤离或秘密行动的备用路线。
      NPC: 公会分部长、高阶魔法师、学徒
      功能: 魔法研究、导航维护、魔法师培训

    水雾街:
      描述: |
        码头区向内陆延伸的主街道，
        因终年笼罩在瀑布水雾中而得名。
        街道两侧是海鲜酒馆、航海用品店、
        炼金材料铺和廉价旅店。
        石板路面永远是湿的，
        水雾中混杂着烤鱼的香气、炼金药剂的刺鼻味
        和飞空艇燃料的焦味。
        水手和冒险家在酒馆里大声喧哗，
        魔法师学徒在材料铺前讨价还价，
        情报贩子在角落里低声交谈。
        这里是西海岸最热闹也最混乱的地方。
      功能: 商业街、餐饮、住宿、社交

    航务署大楼:
      描述: |
        水雾街尽头的一座坚固石质建筑，
        公国航务署在此管理所有进出港的飞空艇。
        大楼内设有航线调度室、气象观测站和港口治安队。
        所有前往天界的飞空艇必须在此登记航线、
        接受安全检查并获取最新的气流预报。
        大楼顶层的气象观测站能监测天空之海的
        反重力水流变化，为飞空艇提供安全窗口预报。
      NPC: 港务长、航线调度员、气象观测员
      功能: 航线管理、安全检查、气象预报
