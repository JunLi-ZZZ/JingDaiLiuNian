---
班图营地·冰壁要塞:
  层级: 第一层·表层界上部（冻裂高岛）
  性质: 班图族军事要塞·边境贸易站
  描述: |
    冻裂高岛最高处的冰壁悬崖上，
    班图族在永冻岩层中凿出了一座半地下要塞。
    要塞既是抵御冰原魔物的军事据点，
    也是表层界上部通往隔离层的重要中转站。
    班图族战士以严酷的冰原试炼闻名，
    偶有兽人种探索者慕名前来切磋，
    双方以游戏代替格斗，但激烈程度不亚于真正的战斗。
    布万加的修炼场就在要塞外围的冰崖上，
    对所有愿意接受试炼的武者开放。
  常驻势力:
    - 班图族（军事驻防、冰原巡逻）
    - 冒险家公会中转站（补给、向导）
  人口构成: 班图族为主，少量公国派驻人员和过路冒险家

冰原圣城·库喃喋:
  层级: 第一层·表层界上部（冻裂高岛内陆）
  性质: 班图族圣地·最大聚居地
  旧称: 库喃喋（阿姆罗斯）
  描述: |
    冻裂高岛内陆一片相对平坦的冰原台地，
    班图族在此建立了最大的聚居地。
    冰穴建筑群围绕中央的祭祀广场排列，
    广场中央矗立着班图族的图腾柱，
    刻满了祖先的功绩和冰龙的传说。
    这里是班图族的政治和精神中心，
    族长议会在祭祀广场召开，决定族群大事。
    冰原台地下方的冰层厚达数百米，
    冰层下方的土壤层仍保留着草原痕迹——
    这是折叠前斯特里高原的遗迹。
    班图族在冰龙沉睡期间在此游牧，
    饲养耐寒的雪地兽群。
  常驻势力:
    - 班图族族长议会（政治中心）
    - 班图族祭司团（精神领袖）
    - 班图族战士团（守卫圣地）
  人口构成: 班图族为绝对主体，极少数外来者获准进入
  环境特征: 极寒、永冻、冰龙寒流影响
  特殊: 斯特里高原遗迹，冰层下保留草原土壤

龙巢冰峰·坎纳克:
  层级: 第一层·表层界上部（冻裂高岛最高峰）
  性质: 冰龙巢穴·极端禁区
  旧称: 坎纳克山（万年雪山）
  描述: |
    冻裂高岛最高的山峰，山顶终年被暴风雪笼罩。
    这是折叠前阿拉德最高的山峰，
    折叠后成为冻裂高岛的最高点。
    冰龙斯卡萨的巢穴位于山顶的冰窟中，
    龙息形成的寒流是整座岛屿永冻的根源。
    山体侧面有多条攀登路线，
    但只有最强的勇士才能抵达山顶——
    越往上温度越低，暴风雪越猛烈，
    空气中弥漫着冰龙的威压。
    班图族将此山视为禁地，
    只有在冰龙苏醒威胁族群时，
    最勇敢的战士才会组队攀登，试图安抚或击退巨龙。
  魔物: 冰龙斯卡萨（使徒级）、冰元素、雪地魔兽
  环境危险: 极寒、暴风雪、龙息寒流、空气稀薄
  危险等级: 极高——非顶级冒险家禁入

  子区域:
    流放者冰崖:
      旧称: 流放者山脉
      描述: |
        坎纳克山最险峻的边缘崖壁，
        是冻裂高岛与表层界其他区域的分界线。
        地形极端恶劣，冰崖几乎垂直，
        寒风如刀，冰层随时可能崩塌。
        传说卡赞被流放至此后在冰崖中死去，
        崖壁上至今残留着他的怨念——
        偶有冒险家声称在暴风雪中看到红色的鬼影。
        偶有黑衣人在此出没，身份不明，
        似乎在寻找什么。
      魔物: 怨念幽灵、冰崖魔兽
      环境危险: 极端恶劣、冰崖崩塌、怨念侵蚀

    永冻荒原·极北禁地:
      旧称: 永恒冻土
      描述: |
        坎纳克山北侧，冻裂高岛最北端的一片永冻荒原。
        冰层厚达数百米，是阿拉德极北之地。
        终年积雪，温度低到连空气都仿佛凝固。
        偶尔能在冰层中发现冻结的远古植物化石，
        暗示这里曾是温暖的草原——
        那是折叠前的遗迹。
        没有任何生物能在此长期生存，
        即使是班图族也不敢深入荒原腹地。
      环境危险: 极寒、永冻、迷失方向
      危险等级: 极高
