---
# ─── 区域：安图恩·熔山使徒（投影） ───
# 旧称：安图恩攻坚战（Lv.70~80）
# 原作：使徒安图恩的投影，非本体，但也造成了巨大灾害，切断天界能源的活火山型巨兽，苍穹贵族号上发起攻坚

安图恩_熔山使徒(投影):
  区域总述:
    层级: 第二层·中层界最深处（约1800~2000km深度），比能源中心更接近地心，紧邻过渡层寂静城入口
    物理后果:
      地形: |
        使徒安图恩是一头体型堪比大陆的活火山型巨兽，这里仅是他的投影，但也造成了灾难
        盘踞在中层界最深处——比伊顿工业区更接近星核的区域。
        折叠后，安图恩的身躯横亘在天界通往深层的能源管线上，
        切断了天界的主能源供应。
        巨兽背部如同一座活火山群，黑色火山口持续喷发岩浆，
        黑雾从巨兽体内涌出，笼罩了周围数百公里的深渊空间。
        巨兽的关节、腿部、体腔构成了多层次的战斗地形，
        天界联合舰队以苍穹贵族号为旗舰发起攻坚。
      光照: 黑雾遮蔽人造太阳，仅有巨兽背部火山口的岩浆光和体内的暗红色热辐射
      重力: 倒置但体感正常（中层界规则），巨兽体表重力受其生物场影响局部紊乱
      温度气压: 极高温，巨兽体表被火山灰覆盖，体内灼热如熔炉，背部火山口区域温度最高
      水文: 无水，巨兽体内流淌的是岩浆般的高温体液

  子区域:
    黑雾屏障（Lv.70~73）:
      旧称: 黑雾之源
      描述: |
        安图恩周围数百公里的黑雾区域。
        巨兽呼吸喷出的剧毒黑烟与火山灰混合，
        形成遮天蔽日的天然屏障，
        能见度几乎为零，舰船仪器受到严重干扰。
        苍穹贵族号必须在黑雾中盲航推进，
        依靠热源探测和魔力感应定位巨兽方位。
      魔物: 黑雾寄生体、火山灰元素
      环境危险: 剧毒黑雾、零能见度、高温灰尘

    震颤关节（Lv.73~75）:
      旧称: 震颤的大地
      描述: |
        安图恩身躯上脆弱的关节部位。
        巨兽每一次微小的动作都引发地震级别的震颤，
        关节表面覆盖着龟裂的岩化甲壳，缝隙中渗出高温体液。
        攻坚部队必须在持续的剧烈晃动中作战，
        关节处的甲壳相对薄弱，是突破巨兽防御的关键点。
      魔物: 关节守卫、甲壳寄生虫
      环境危险: 持续地震、甲壳崩裂、高温体液

    擎天之柱（Lv.74~76）:
      旧称: 擎天之柱
      描述: |
        安图恩的腿部——从大地延伸至巨兽躯干的巨大支柱。
        攻坚部队沿腿部攀登，突破层层守门将的阻击。
        腿部表面覆满了火山灰结壳和岩石化的寄生生物，
        越往上温度越高，越接近巨兽的核心区域。
      魔物: 守门将、腿部寄生体

    能量核心（Lv.76~78）:
      旧称: 能量阻截战
      描述: |
        深入安图恩体内，切断核心能量传输的关键战场。
        巨兽体腔内部灼热如熔炉，
        暗红色的热辐射从器官壁面渗出，
        能量管线如同巨大的血管在体腔中蜿蜒，
        管线中流淌着岩浆般的高温体液。
        切断它们是瘫痪巨兽的唯一方法。
      魔物: 能量守卫、体腔寄生虫
      环境危险: 极端高温、岩浆体液

    黑色火山（Lv.78~80）:
      旧称: 黑色火山
      描述: |
        安图恩背部的火山口，最终决战地。
        巨兽背脊上隆起的巨大火山口持续喷发黑色岩浆，
        攻坚部队在火山口边缘与安图恩的核心防御力量交锋。
        从火山口向下望去，能看到巨兽心脏的脉动光芒。
      魔物: 火山守卫、岩浆元素
      环境危险: 岩浆喷发、有毒气体

    使徒之心（Lv.80）:
      旧称: 安图恩的心脏
      描述: |
        安图恩体内最深处，巨兽的心脏所在。
        一颗散发着暗红色光芒的巨大器官在体腔中央搏动，
        每一次心跳都引发整个巨兽的共振，
        心脏周围的温度足以熔化普通金属。
        对垂死巨兽进行最后一击——
        击破心脏意味着天界能源管线的恢复，
        也意味着一位使徒投影的陨落。
      魔物: 安图恩核心（投影）
      通关意义: 恢复天界能源供应
