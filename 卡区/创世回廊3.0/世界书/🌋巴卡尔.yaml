巴卡尔领_特洛波特·龙之国度:
  层级: 不明（推测位于深渊外围或隐秘空间）
  性质: 前使徒领地·独立龙族国家
  描述: |
    巴卡尔早已被从使徒中除名，
    复活后他没有返回魔界，
    而是在某处重新建立了龙之国度——特洛波特。
    特洛波特的确切位置是深渊中最大的谜团之一。
    有人推测它隐藏在异次元裂隙的某个稳定空间中，
    有人认为它建在深渊外围迪司博德地表的某个偏远角落，
    也有人怀疑巴卡尔利用折叠产生的空间褶皱
    创造了一个半独立的口袋领域。
    唯一确定的是：巴卡尔是最为提防和憎恨赫尔德的存在，
    特洛波特的建立本身就是对赫尔德的防御姿态。
    曾受巴卡尔支配压迫的天界人意外得知他复活的消息后
    极为警惕，正在全力搜索特洛波特的位置。
    龙精种对巴卡尔冷淡警惕——不怕他，但也懒得搭理他。
  控制范围: 特洛波特及其周边（位置不明）
  态度: 对赫尔德极度敌意，对外界保持隐秘
  NPC: 巴卡尔（前使徒，龙之国度之主）
