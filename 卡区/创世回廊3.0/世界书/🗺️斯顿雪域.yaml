---
# ─── 区域：冻裂高岛·雪域 ───
# 旧称：斯顿雪域（Lv.40~50）

冻裂高岛·雪域:
  区域总述:
    原作对应: 斯顿雪域全部副本
    层级: 第一层·表层界上部（约80~160km深度）
    物理后果:
      地形: |
        斯顿雪域原为阿拉德大陆北部的冻土高原。
        折叠后，该区域的岩盘被抬升至表层界上部，
        恰好位于深渊气流的上升冷凝带——
        从深处涌上的湿热气流在此遭遇高空冷气团，
        水汽急剧凝结为冰雪，使这片浮空岛群终年被冰雪覆盖。
      光照: 表层界上部，有折射阳光但被冰晶散射为惨白色
      重力: 正常
      温度气压: 极寒，深渊冷凝带效应使温度远低于同深度其他区域
      水文: 冰川融水从岛屿边缘形成瀑布，坠入下方云层

  子区域:
    冰壁部落:
      旧称: 斯顿雪域
      描述: |
        表层界上部，一座被冰雪完全覆盖的大型浮空岛。
        岛屿表面是数十米厚的永冻冰层，冰层下方的岩体
        因深渊气流的冷凝效应而持续积雪，永不消融。
        班图族在冰层中开凿了洞穴聚落，以冰壁为墙，
        以兽皮为门，篝火的烟雾从冰面上的通气孔中升起。
        岛屿边缘的冰崖不断崩裂，冰块坠入深渊，
        在下方的云层中激起白色的冰雾。
      魔物: 冰狼、雪人、冰元素精灵
      聚落: 班图族冰穴聚落

    试炼崖脊:
      旧称: 山脊
      描述: |
        冰壁部落岛屿侧面，一道从冰层中突出的裸露岩脊。
        岩脊表面被冰风打磨得光滑如镜，
        班图族勇士将攀登这道冰脊作为成年试炼——
        从岛屿底部沿岩脊攀至顶部，途中不得使用任何工具。
        岩脊两侧是万丈深渊，寒风如刀，
        失足者将坠入永恒的云海。
      魔物: 冰风精灵、岩脊蜥蜴
      环境危险: 极寒、冰面滑坠、强风

    碎心冰窟:
      旧称: 冰心少年（查理的梦境世界）
      描述: |
        冰壁部落岛屿深处，一个被冰层封存的异常空腔。
        空腔内部的冰壁上映射着查理破碎记忆的幻影——
        深渊魔力将少年的悲伤凝固为实体冰晶，
        每一块冰晶都封存着一段痛苦的回忆。
        进入此地的冒险家会被幻影影响，
        看到并非属于自己的悲伤画面。
      魔物: 记忆幻影、悲伤冰晶、冰心守卫
      环境危险: 精神影响（幻觉）、冰晶碎裂

    寒巨渊窖:
      旧称: 利库天井
      描述: |
        冰壁部落岛屿最底部，冰层与岩体交界处的一个
        垂直冰井。冰井直径数百米，深入岩体内部，
        井壁覆满了千年寒冰，越往下温度越低。
        寒冰巨人利库蜷缩在冰井最底部，
        它的呼吸形成持续的上升冷气流，
        正是这股冷气维持着整座岛屿的永冻状态。
        击败利库可能导致岛屿冰层开始融化——
        班图族对此深感忧虑。
      魔物: 寒冰巨人利库、冰晶卫兵、霜冻元素

    雪埋遗构:
      旧称: 白色废墟
      描述: |
        冰壁部落岛屿边缘，一片被积雪掩埋的古代建筑遗迹。
        折叠前这里就已是废墟，折叠后被冰雪进一步封存。
        偶有暴风雪刮去表层积雪，露出下方的石柱和拱门，
        建筑风格与现存的任何阿拉德文明都不匹配——
        可能是比尔马克帝国甚至更古老时代的遗物。
        遗迹内部被冰封的房间中，偶有古代机关被地热激活。
      魔物: 冰封傀儡、古代守卫残骸、冰晶蜘蛛

    武圣岩台:
      旧称: 布万加的修炼场
      描述: |
        冰壁部落岛屿顶部，一处被布万加亲手凿平的岩台。
        钝器剑圣在此修炼，岩台表面布满了他练功留下的
        深深凹痕和裂纹。寒风在岩台上呼啸，
        但布万加的气场在岩台周围形成了一个温暖的结界。
        偶有慕名而来的武者在此挑战布万加，
        但至今无人能在这片冰风岩台上胜过他。
      NPC: 钝器剑圣布万加
      功能: 武道修炼场、特殊挑战

    冰心矿脉:
      旧称: 查理的挖掘场
      描述: |
        冰壁部落岛屿深处，深渊冷却效应形成的永冻层区域。
        巨大冰川裂隙中裸露着深蓝色的冰龙石矿脉，
        冰层下埋藏着高纯度泰拉石。
        地精种架设了巨大的蒸汽钻机，日夜不停开采。
        矿场兼具仓库、工坊和堡垒功能，
        大量雇佣阿拉德冒险者担任矿区警卫。
      魔物: 冰霜哥布林、雪山狼群

    万年雪山主峰:
      旧称: 泰坦冰窟（斯特鲁山脉主峰）
      描述: |
        冻裂高岛最宏伟的垂直冰壁，常年暴雪，普通种族难以攀登。
        冰壁内部被凿穿形成巨大的洞窟系统，
        规模足以容纳巨人种自由活动。
        巨人种凿穿山体住在巨大的冰洞里，
        冰壁上刻着古老的巨人符文，
        地热从深处涌上来在冰窟中央形成温泉。
        与当地班图族保持微妙的互不侵犯关系。
      魔物: 塞斯奇（大脚怪）、寒冰泰坦
