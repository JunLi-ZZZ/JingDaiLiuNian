---
# ─── 区域：无法地带·天界暗面 ───
# 旧称：无法地带（哈林、赫伊斯、阿登高地）（Lv.48~68）

无法地带_天界暗面:
  区域总述:
    层级: 第二层·中层界中下段（约1400~1800km深度）
    物理后果:
      地形: |
        天界城市群的边缘地带——远离皇都军管辖的荒郊区域。
        这里的基础设施年久失修，建筑破败倾斜，
        街区杂乱无章地蔓延在起伏不平的地面上。
        皇都的电力网络延伸不到此处，
        居民自行从地热裂隙中汲取能源，
        霓虹灯管和非法电缆构成了混乱的照明系统。
        天空之海蒸发的水汽在此凝结为持续的浓雾，
        能见度极低，是犯罪和走私的天然掩护。
      光照: 人造太阳的光被浓雾和烟尘严重遮蔽，终日昏暗，霓虹灯和地热发光体补充照明
      重力: 倒置但体感正常，部分区域因地基塌陷出现局部倾斜
      温度气压: 闷热潮湿，雾气弥漫，空气中混杂致幻剂和机油味
      水文: 天空之海渗水凝结为持续浓雾，废水沿街道流淌

  子区域:
    哈林全蚀市场（Lv.48~54）:
      旧称: 哈林
      描述: |
        无法地带最大的黑市，霓虹灯与垃圾山交错的堕落街区。
        空气中弥漫着致幻剂和机油的味道。
        妖魔种中的魅魔、梦魔等亚种在此编织关系网，
        以魅惑和交际手腕获取情报与资源——
        不是猎杀魔物，而是社交型狩猎。
        市场虽然混乱但有其独特秩序，
        德洛斯佣兵团维持着最低限度的治安。
        妖魔种是这里消息最灵通的种族。
      魔物: 狂乱奴隶兽、无头骑士

    雾都赫伊斯（Lv.56~65）:
      旧称: 雾都赫伊斯
      描述: |
        无法地带深处，终年被迷雾笼罩的低洼城市。
        坐落在一片地势低洼的盆地中，
        地形复杂但空间开阔，足以容纳巨人种的体型。
        雾气来自天空之海蒸发的水汽在此凝结。
        城市中央的雇佣兵广场上，
        卡勒特残党和各种流亡者聚集于此。
        巨人种极少进入深渊——体型使大部分通道如同"钻兔子洞"。
        仅受神灵种密令驱使的极少数精锐才会出现在此，
        广场是深渊中罕见的不会让巨人种感到拥挤的空间。
        所有种族都会远远避开其行进路线。
      魔物: 机甲、生化犬

    阿登高地（Lv.60~68）:
      旧称: 阿登高地
      描述: |
        无法地带边缘，高地上的孤城。
        城市虽然破败但骨架犹存。
        地热发光体将地面映成血红色，如同永恒的夕阳。
        曾经是传说枪手们决战的地方。
        龙精种以高阶冒险者的人形态混迹于此，
        利用无法地带的混乱掩护渗透行动。
        破败孤城中人员流动频繁、身份审查松散，
        是上位种族隐秘活动的理想据点。
      魔物: 生化改造人、沙虫
