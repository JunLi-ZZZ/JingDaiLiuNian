---
银马城:
  总述: 埃鲁因北境戈兰·埃尔森高原核心城市，高原政治、经济与军事中心，王国北部战马培育与矿业贸易枢纽
  地理:
    位置: 戈兰·埃尔森高原中部核心谷地，南接敏泰平原北缘，北连高原北部冻土带，西临黑森林北麓，东抵克鲁兹帝国边境
    环境: 高原温带气候，地势开阔，周边环山，境内有高原河流穿城而过，气候寒冷干燥，昼夜温差大，周边分布高山草甸、林地与矿场
  兴趣点: 埃鲁因皇家高原马场、高原矿业与冶金行会总部、高原骑兵战技学院与功勋馆、战争圣殿高原主殿、高原游牧部落交易中心、高原边境贸易口岸，涵盖纯种战马培育、矿脉勘探、骑战战术培训、骑兵祭典、畜牧产品交易、跨境商队护送等服务与活动
  社会结构:
    治理: 高原大领主直辖，辅以贵族议会、矿业行会、马场与圣殿代表联合议事
    族群: 以人类牧民、矿民、骑兵为主，混居矮人矿工、半兽人游牧部落、商旅与佣兵群体
  军事:
    兵力: 高原核心军事要塞，常驻高原骑兵主力军团、矿场护卫队，下辖步兵、斥候联队，战时可征召全高原部落骑兵与民团
    装备: 骑兵配制式战马、重型骑枪、铠甲与长剑，步兵配山地作战装备，城防配重型守城弩、抛石机与附魔防御器械
    工事: 砖石城墙与护城河，四面设瓮城、箭楼，核心区设领主堡垒，城外设骑兵营地与训练场，周边隘口设卫星要塞
    职能: 镇守高原核心区域、护卫矿场与马场、管控北部边境、抵御外敌与魔兽入侵、清剿流寇
  民生与经济:
    人口: 常住5-7万，流动峰值可达10万
    住宅: 内城为贵族宅邸、行政机构、矿业行会、马场总部、圣殿与大型集市，外城为平民住宅、手工作坊、矿场配套设施、兵营、驿站与贸易区
    产业: 以战马培育、游牧、矿业、冶金、皮毛加工、武器锻造为核心，是埃鲁因最核心的优质战马供给地与高原矿产集散地
    贸易: 高原核心贸易节点，主营战马、矿石、冶金制品、皮毛、肉制品、武器，商路连接埃鲁因内陆、克鲁兹帝国与北方部族
    主食: 牛羊肉、奶制品、黑麦面包、土豆、高原野味
    医疗: 圣殿医疗所、军医院、民间医馆与游牧流动医疗点
    教育: 圣殿学堂、贵族私学、骑兵战技学院、矿业与冶金专科学校
  历史文化:
    起源: 第二纪元矮人矿场与游牧部落聚居点，后扩建为高原要塞城市
    信仰: 以战争圣殿、大地圣殿为核心信仰
    节日: 战马祭、开矿节、草原祭、骑兵凯旋祭、冬祭
    文化特征: 游牧、骑兵与矿业文明融合，民风彪悍尚武，骑兵文化底蕴深厚
    历史事件: 多次北方边境防御战的核心指挥中心，埃鲁因十一月战争的关键战场，王国内战中北境势力的核心据点
