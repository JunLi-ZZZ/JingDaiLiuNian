---
鲁夫特_悬空港:
  层级: 第二层·中层界（约1000~1200km深度）
  性质: 海上交通枢纽·贸易港
  描述: |
    中层界的港口城市，
    坐落在天空之海渗水形成的内陆湖畔。
    这里是连接表层界与中层界的海运枢纽——
    飞空艇和海上列车在此中转，货物在码头装卸。
    港口区鱼龙混杂，海贼团的残余势力仍在暗中活动，
    但天界海军的巡逻舰维持着航路的基本安全。
    贝尔玛尔公国在此设有租界，
    是阿拉德商品进入天界市场的主要通道。
  常驻势力:
    - 天界海军（航路巡逻）
    - 贝尔玛尔公国租界（贸易、外交）
    - 海贼团残余（地下经济）
  人口构成: 天界人和阿拉德人混居，是中层界外来者最多的城市
