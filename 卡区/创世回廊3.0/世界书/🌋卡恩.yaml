---
卡恩领_魔界协会:
  层级: 第三层·深层界（翠结界及周边板块）
  性质: 使徒领地·魔界中立政权
  描述: |
    魔界之王卡恩的领地以翠结界为中心，
    辐射周边数块地壳板块。
    卡恩对统治其他领域毫无野心，
    他维持魔界协会的运转更像是出于惯性而非权力欲。
    协会广场是深层界唯一的中立仲裁机构，
    使徒之间的领地纠纷、魔界原住民的贸易争端
    都在此通过卡恩的裁决解决。
    对赫尔德的阴谋，卡恩表现出罕见的冷漠——
    "那个女人的把戏与我无关。"
    但没有人敢在翠结界内挑衅魔界之王的权威。
  控制范围: 翠结界及周边3~4块地壳板块
  态度: 中立，不参与任何阵营争斗
  NPC: 卡恩（魔界之王）、凯蒂大婶
