---
# ─── 区域：伊顿工业区·能源深渊 ───
# 旧称：伊顿工业区 & 能源中心（Lv.56~65）

伊顿工业区_能源深渊:
  区域总述:
    层级: 第二层·中层界中段（约1300~1600km深度）
    物理后果:
      地形: |
        天界的工业心脏地带。折叠后，发电站群和工厂区
        坐落在地热活跃带上——地面裂隙中
        持续渗出高温蒸汽和岩浆细流，为工业设施
        提供了天然的地热能源替代方案。
        安图恩切断主能源管线后，大部分工厂停工，
        但地热驱动的核心设施仍在运转。
        巨大的烟囱、冷却塔和管道网络在工业平原上铺展，
        构成了一片钢铁与岩浆交织的工业废土。
      光照: 人造太阳照耀，但工业区浓烟遮蔽天空，地面呈暗橙色调
      重力: 倒置但体感正常
      温度气压: 极高温，地热蒸汽使空气灼热潮湿
      水文: 地热温泉和冷却水循环系统，岩浆细流穿过工厂地基

  子区域:
    七神之鞘翅研究所（Lv.56~64）:
      旧称: 伊顿工业区核心研究区
      描述: |
        伊顿工业区核心，巨大的工厂群中仍在运转的研究中心。
        烟囱林立，因安图恩切断能源处于半停工状态，
        但核心研究区仍由备用能源维持运转。
        天翼种以"技术顾问"身份混入其中，
        对不依赖精灵回廊的"科学"力量体系近乎病态地着迷。
        天界人对这位知识渊博的顾问极为警惕，
        但又舍不得切断这条珍贵的异界技术交流渠道。
      魔物: 大史莱姆、机甲

    克雷发电站外围（Lv.58~65）:
      旧称: 克雷发电站
      描述: |
        伊顿工业区外围，充满燃烧熔渣和废弃冷却塔的工业废土。
        地面滚烫，空间开阔。
        原克雷发电站因能源危机而半废弃。
        皇都军为夺回发电站建立了前线基地。
        巨人种的体型在开阔的工业废土上不再是累赘，
        反而是搬运重型火炮的最佳劳力——
        这是极少数让巨人种觉得"空间刚好够用"的深渊据点。
        基地有军用补给和简易医疗设施。
      魔物: 花岗岩巨人、大史莱姆
