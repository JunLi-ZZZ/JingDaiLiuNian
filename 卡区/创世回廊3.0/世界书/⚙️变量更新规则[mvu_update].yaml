---
变量更新规则:

  _复用:
    只读:
      readonly: true
      check: [由外部脚本处理，禁止修改]
    年历格式: &FMT "{YYYY}年{MM}月{DD}日"
    品质: &E_quality 普通|精良|稀有|神器|传说|史诗|神话
    六维: &E_attr6 [力量, 敏捷, 体质, 智力, 感知, 魅力]
    传闻话题: &rumor_topics 悬赏线索/商路动向/势力情报/遗迹坐标/人物行踪/黑市消息/宝物传闻/怪物异动/深渊异变/种族摩擦/物价波动
    传闻通用: &rumor_base [总量≤3条, 为空补2条, 约60字/条, 不围绕<user>除非影响重大]

  全局:
    基准: [结构/字段类型/默认值以"结构定义"为准]
    只读字段: [/人物/等级, /人物/升级阈值]
    add硬约束: [add=创建完整对象，不是patch；凡add某节点，value必须覆盖该节点type定义的全部字段；缺任一字段视为无效add并拒绝执行]
    add非空约束: ["add时对象字段不得写{}；map/record类型至少给1个有效key；若节点有最小数量约束按该约束执行"]
    通用约束: [新增必须全量写入结构定义，更新字段能增量就不全量, 数值超range按上下限截断, 可穿戴装备或工具必须进装备列表，严禁写入道具]

  结构定义:
    任务列表: &S_task "{[任务名]:{委托方;标题;简介;目标;奖励;交付}}"
    特质: &S_trait "{[特质名]:{标签:str[];描述}}"
    召唤物: &S_summon "{[召唤物名|集群]:{名称;HP;HP上限;AC:num;技能倍率:str;持续时间:str}}"
    技能槽: &S_skill_slot "{[技能名]:{冷却中:bool}}"
    资源技能: &S_resource_skill "{[技能名]:{品质:*E_quality;类型;消耗:str;剩余次数:num;次数上限:num;恢复条件:str;标签:str[];效果:{[效果名]:str};描述}}"
    道途层级项: &S_path_layer_item "{[名称]:{溯源:str[];效果:str}}"
    道途: &S_path "{道途名称:str;阶段:num;当前源力:num;源力上限:num;要素:*S_path_layer_item;奇迹:*S_path_layer_item;权能:*S_path_layer_item;世界影响:{概念标签:str[];特殊效果:str};道途能力:str[]}"
    状态效果: &S_status "{[状态名]:{类型:BUFF|DEBUFF;持续时间;描述;属性影响:{[属性]:num};特殊影响}}"
    装备列表: &S_equip "{[装备标识]:{类型:武器|防具|首饰;部位:主手|护肩|上衣|腰带|下装|鞋子|戒指|手镯|项链;装备箱:bool;名称:str;品质:*E_quality;标签:str[];等级:num;属性加成?:{[k]:num};效果:str;描述:str}}"
    道具列表: &S_item "{[道具名]:{品质:*E_quality;数量:num;类型:消耗品|材料|杂物|任务物品|唯一物品;标签:str[];效果;描述}}"
    声望: &S_reputation "{[阵营]:{阵营名称;声望值:num;声望等级;描述}}"
    种族棋子: &S_race_piece "{[种族名]?:bool}"
    附近的人: &S_nearby "{[名称]:{性别:str;种族:str;等级:num;外貌:str;着装:str;属性:{力量:num;敏捷:num;体质:num;智力:num;感知:num;魅力:num};装备列表:*S_equip}}"
    羁绊列表: &S_bond "{[名称]:{性别:str;附近:bool;种族:str;等级:num;当前总经验:num;升级阈值:num;生命值上限:num;当前生命值:num;属性:{力量:num;敏捷:num;体质:num;智力:num;感知:num;魅力:num};装备列表:*S_equip;技能:{[名]:{品质:str;类型:str;效果:str;描述:str}};外貌:str;着装:str;好感度:num;同行誓约:bool;连携奥义:{[名]:{品质:str;类型:str;效果:str;描述:str}};当前想法:str}}"
    街头巷议: &S_street_rumor "{[标题]:{说书人;内容;可信度:酒话|可疑|或许可信}}"
    情报交易: &S_intel "{[情报名]:{卖家;摘要;要价:num}}"
    布告与檄文: &S_notice "{[标题]:{发布者;内容;张贴位置}}"
    核心资产: &S_asset "{[资产名]:{类型:领地|庄园|房产|店铺|工坊|据点;主体规模:num;所在地:str;状态:str;建设序列:{[方向]:{建设阶段:基础|进阶|专业|顶尖|禁忌;核心设施:str[];功能:str;产出:str;下次产出日期:str}};驻扎人员:{[角色]:str};待办事件:str[]}}"

  世界信息:
    年历:
      format: *FMT
      check: 
        - 事件推进/休息/旅行后更新
    时间:
      category: [清晨, 上午, 中午, 下午, 傍晚, 入夜, 深夜, 凌晨, 黎明]
      check: 
        - 随剧情流转
    位置:
      大陆:
        category: [迪斯博德, 世界之痕, 表层界, 中层界, 深层界]
        alias:
          表层界: 阿拉德大陆/第一层
          中层界: 天界/第二层
          深层界: 魔界/第三层
          世界之痕: 深渊外围
        check: 
          - 跨层时更新
      区域:
        format: "{大区域名}·{子区域名}"
        check:
          - 进入新地区更新
          - 首段=<map_info>大区域名
          - 不确定子区域只写大区域
          - 子区域名尽量规范，只用完整地名，不加修饰词
      场所:
        check: 
          - 进入新房间时更新

  任务列表:
    type: *S_task
    check:
      - 接取add
      - 完成领奖或失败remove
      - 仅在任务提交完成remove时同步发放一次奖励，避免重复

  人物:
    特质:
      type: *S_trait
      check: 
        - 标签含正面/负面/混合/生活技能之一, 仅重大叙事转折时更新
    等级:
      readonly: true
      check: 
        - 由外部脚本处理，禁止修改
    当前总经验:
      type: num
      check:
        - 累加式经验，升级不清空，升级也只增不减
        - 严格按<经验值规则>。**绝对不可清零！升级不归你管，你只负责增加经验，绝对不能清零！**
    升级阈值:
      readonly: true
      check: 
        - 外部脚本处理，禁止修改
    生命值上限:
      check: 只读
    当前生命值:
      type: num
      range: 0~生命值上限
      check: 
        - 受伤减/治疗休息恢复, ≤上限
    临时生命值:
      type: num
      check:
        - 护盾写入，先扣临时再扣当前，不叠加
        - 战斗结束清零
    AC:
      check: 只读
    CP:
      type: num
      range: 0~100
      check: 
        - 仅战斗中+队友在场可增, 连携技使用、战斗结束清零
    属性.{六维}:
      range: 1~30
      check: 
        - 只读，升级不增加
    召唤物:
      type: *S_summon
      check:
        - 只计入玩家召唤物
        - 召唤add/到期解除HP零remove。add时type所有字段必填
        - 单体key=名/多体合并集群(HP求和名称"|"拼接技能倍率求。例如技能倍率:'集群总计300%(召唤物A[130%]+召唤物B[170%])'，召唤物>3只写集群总计)
        - 减员重算减至1退回单体
        - 同名/同技能倍率不叠加，新替旧重算
    主动技能槽:
      type: *S_skill_slot
      check: 
        - 使用后冷却中更新为true
    觉醒技能槽:
      type: *S_skill_slot
      check: 
        - 同主动技能槽
    资源技能:
      type: *S_resource_skill
      check:
        - 任何主动学习技能add至此
        - 消耗用于记录施法材料或其他资源；无消耗填无
        - 默认不写MP等游戏资源
        - 道途来源技能，标签必须包含'道途'
        - 使用时剩余次数-1且不得<0
        - 剩余次数不得>次数上限
        - 次数上限不得<1，不得大于10，因为限制次数的技能通常长休就全部回复
    道途:
      type: *S_path
      check:
        - 10级以上解锁
        - 解锁需明确契机或试炼；解锁即阶段1
        - 解锁时按初始化add，必须全字段写入，add名称、阶段、源力、要素、世界影响、道途能力等
        - 人物等级每10级进阶一阶段，触发契机或试炼
        - 要素多随阶段进阶或史诗剧情add，不允许超过3个，大于3个时安排契机完成试炼后合成进阶为奇迹，然后remove
        - 奇迹由3个要素合成；权能由3个奇迹合成，奇迹和权能不可直接获得，只能合成进阶
        - 合成后remove下级；溯源写3个材料名
        - 道途能力只存主动能力名；详情写入/人物/资源技能
        - 道途能力与同名资源技能同步增删
    战斗属性:
      暴击率:
        check: 
          - 只读
      暴击伤害:
        check: 
          - 0.1代表10%，只读
      物理减伤:
        check: 
          - 百分比数字, 1代表1%, 只读
      魔法减伤:
        check: 
          - 同物理减伤
    状态效果:
      type: *S_status
      format:
        持续时间: 永久/Xd/Xh/Xmin/X轮
      check:
        - 获得add/过期remove
        - 永久需特殊条件remove
        - 属性影响记数值/特殊记文本
        - 每轮必须考虑更新持续时间
    装备列表: &equip
      path: /人物/装备列表
      type: *S_equip
      槽位映射: "武器→主手; 防具→护肩/上衣/腰带/下装/鞋子; 首饰→戒指/手镯/项链; 不在武器、防具或首饰槽位，且不提供攻击或防御力的物品放特殊"
      check: 
        - 可穿戴装备必须进装备列表，严禁写入道具
        - 获得add/出售丢弃remove
        - add时装备对象不得为{}且必填字段=类型/部位/装备箱/名称/品质/标签/等级/效果/描述(属性加成可选)
        - 穿脱只改装备箱true↔false, 同槽同时仅1件穿戴(箱中不限)
        - 追踪装备一致性，给予队友或交易需从自己装备列表remove
    背包:
      金币:
        path: /人物/背包/金币
        type: num
        check: 
          - 随剧情增加和消费扣减，**交易、任务提交等与道具增减保持一致性**
      道具:
        path: /人物/背包/道具
        type: *S_item
        check: 
          - 获得add或+数量/使用丢弃-数量, =0时remove
          - 可穿戴装备严禁放入, 道具不包括可穿戴装备

    声望:
      type: *S_reputation
      check: 
        - 与某势力建立关系add, 等级按值描述(冷淡/中立/友善等), 低声望透明人/高声望尊敬/负声望敌意受阻, 超过尊敬后极难提升

  种族棋子收藏:
    type: *S_race_piece
    check: 
      - 收集到时add=true

  核心资产:
    type: *S_asset
    check:
      - 遵照<经营与资产规则>
      - 新增用/核心资产/{名}禁止覆盖根
      - 不得纯负资产
      - 经营型至少1序列有产出(最小收益闭环)
    "{资产名称}":
      path: /核心资产/${资产名称}
      类型:
        type: str
        check: 
          - 命中结构定义枚举
      主体规模:
        type: num
        range: 1~10
        check: 
          - 获取时按剧情初始化, 仅扩建/收缩/被毁时更新
      所在地:
        check: 
          - 获取时初始化至子区域级
      状态:
        check: 
          - 一句话描述近况
      建设序列:
        path: /核心资产/${资产名称}/建设序列
        check:
          - 获取时add基础≥2条(越大的资产初始越多，领地≥5)
          - 投资扩展add新序列
          - key鼓励广维度避免同义反复
        "{建设方向}":
          建设阶段:
            check: 
              - 命中枚举, 参照<经营与资产规则>
          核心设施:
            type: "str[]"
            check: 
              - 可多项描述代表设施
          功能:
            check:
              - 匹配方向+阶段
              - 描述收益/便利/风险缓解
              - 高阶段覆盖低阶段
          产出:
            check:
              - 序列变化后更新
              - 经营资产至少一项(亏本也有)
              - 产出只写本字段不写功能
              - 标注周期(默认周产)/无产出写无
              - 不得直接写入背包，先进待办事件结算
          下次产出日期:
            format: *FMT
            check:
              - 无产出写无
              - 初始化必填
              - 结算后刷新
              - 提前结算按比例后也刷新
      驻扎人员:
        type: "{[角色]:str}"
        check: 
          - 记录角色与职能
      待办事件:
        type: "str[]"
        check:
          - 需玩家处理事件计入(备料/突发/周产)，正负面均计入
          - 剧情推进/时间流逝add 1~2条
          - 产出按单资产单周期汇总1条"周产收益包裹"(含来源明细)；空产出不计入
          - 结算发放金币/道具/装备/材料+功能修正后remove
          - 回城/回家/远程指令后remove已处理+完成结算

  战斗:
    是否战斗中:
      type: bool
      check: 
        - 进战更新true，结束更新false
    当前轮次:
      path: /战斗/当前轮次
      type: num
      check: 
        - 战斗中每轮+1, 结束=0

  附近的人:
    type: *S_nearby
    check:
      - 仅焦点交互角色add
      - add时必须一次性给全字段(性别/种族/等级/外貌/着装/属性六维/装备列表)，外貌着装一句话
      - 装备固定2件(最能体现实力身份/等级品质匹配)
      - 无交流意愿+离开即remove
      - 同时≤4超出移除无交互的
      - 已在羁绊不得出现
      - 怪物不计入附近的人
    装备列表: *equip

  羁绊列表:
    type: *S_bond
    装备列表: *equip
    check:
      - 稳定关系或建立组队关系时add
      - add时同步从附近的人remove
      - 不可同时在附近的人
    "{角色名}":
      附近:
        type: bool
        check: 
          - 实时更新是否在<user>身边
      等级:
        readonly: true
        check: 
          - 由外部脚本处理，禁止修改
      装备列表:
        path: /羁绊列表/${角色名}/装备列表
        <<: *equip
        check: 
          - 获得add, 出售丢弃remove
      技能:
        check:
          - 随学习/成长更新
          - 初始化≥2个
          - add时技能列表不得为{}且每个技能对象必须给品质/类型/效果/描述
      外貌:
        check: 
          - 保持辨识度
      着装:
        check: 
          - 随场景行为变化
      好感度:
        type: num
        range: -100~100
        check: 
          - 单次-5~5
          - 每轮考虑更新
      同行誓约:
        type: bool
        check: 
          - 仅重大好感事件或<user>主动提出时=true
      连携奥义:
        type: "{[技能名]:{品质:str;类型:str;效果:str;描述:str}}"
        check:
          - 誓约true时生成，比普通技能更强大
          - add时不得为{}且每个技能对象必须给品质/类型/效果/描述
      当前想法:
        path: /羁绊列表/${角色名}/当前想法
        check: 
          - 附近=true时每次回复随剧情更新

  传闻:
    _topics: *rumor_topics
    街头巷议:
      type: *S_street_rumor
      topics: *rumor_topics
      check:
        - *rumor_base
        - 有说书人时更新1~2条替换旧
        - 远离后remove
    情报交易:
      type: *S_intel
      topics: *rumor_topics
      check:
        - *rumor_base
        - 有卖家时更新1~2条
        - 要价参考<物价标尺>
        - 购买后remove/允许虚假
    布告与檄文:
      type: *S_notice
      value: "通缉令/征召令/贸易禁令/公会公告/谕令/檄文等"
      check:
        - *rumor_base
        - 须有发布势力+措辞匹配立场
        - 到新区域替换本地公告
