伊顿工业区_工人城:
  层级: 第二层·中层界下部（约1500~1700km深度）
  性质: 工业城镇·能源设施群
  描述: |
    天界的工业心脏，数座发电站和工厂群坐落在
    地热活跃带上。安图恩切断主能源管线后，
    外围工厂大面积停工，工人大量失业，
    但核心区仍由地热备用能源维持运转。
    工人城是围绕工厂群自然形成的居住区——
    金属板房、蒸汽管道和晾衣绳构成的密集街区，
    工人家庭、退役军人和失业者在此艰难度日。
    地精种的技术调查团在此最为活跃，
    以"技术交换"为名获取天界工业机密，
    天界工程师对此心知肚明但缺乏拒绝的底气——
    地精种带来的零件和工具是维持生产的救命稻草。
  常驻势力:
    - 天界工业管理局（半瘫痪状态）
    - 地精种技术调查团（小规模常驻）
    - 工人自治会（维持基本秩序）
  人口构成: 天界工人阶层为主，地精种技术人员少量常驻
  经济: 地热能源开采、机械零件制造、与地精种的技术交换
