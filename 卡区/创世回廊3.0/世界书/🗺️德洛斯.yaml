---
黄金浮岛·帝都台地:
  层级: 第一层·表层界中部（约200~350km深度）
  性质: 德洛斯帝国首都·政治军事中枢
  旧称: 帷塔伦
  描述: |
    表层界中段一座被黄金装饰覆盖的巨型浮空岛。
    折叠时帝国首都所在的大陆板块形成了这座浮空岛，
    位于表层界中段，折射阳光充足但不如日心岛明亮。
    帝国皇宫占据岛屿中央最高处，黄金装饰的宫殿
    在折射阳光下熠熠生辉，远看如同悬浮的黄金王冠。
    军事要塞和贵族区沿岛屿边缘层叠而建，
    岛屿四周锚定着数十座卫星小岛，
    通过钢铁吊桥和飞空艇航线连接，
    构成帝国的政治军事中枢。
    这里是阿拉德大陆最强军事实力和财力的象征，
    帝国常备军的主力部队驻扎于此。
  常驻势力:
    - 德洛斯帝国皇室（皇帝驻地）
    - 帝国近卫军（精锐部队）
    - 帝国军部（军事指挥中心）
    - 帝国财政署（大陆最雄厚的财力）
  人口构成: 帝国贵族、军官、官僚为主，严格管控外来者
  环境特征: 折射阳光充足、温和宜人、正常重力
  治安: 帝国近卫军严密巡逻，是阿拉德防卫最森严的城市

  子区域:
    扭曲废都·鬼神遗痕:
      旧称: 坎特温（末日之都）
      描述: |
        帝都台地外围的一座卫星浮岛，
        折叠时鬼神之乱的残余能量在此形成空间扭曲。
        佩鲁斯帝国最后的象征——坎特温城的废墟
        悬浮在一片重力紊乱的异常区域。
        城市建筑以不可能的角度倾斜悬浮，
        重力在此局部失效。
        空气中弥漫着鬼神残留的气息，
        使这片区域成为冒险家避之不及的禁地。
        德洛斯帝国在废都外围设立了封锁线，
        禁止任何人进入。
      魔物: 鬼神残影、空间异变体
      环境危险: 重力紊乱、鬼神污染、空间扭曲

    边境冰台·夏特利前哨:
      旧称: 夏特利
      描述: |
        帝都台地北侧边缘的一座小型浮空岩台，
        是帝国与班图族的缓冲地带。
        岩台一侧是温和的表层界气候，
        另一侧则受冰原寒流影响终年积雪。
        第二次雪色战役的战场遗迹仍清晰可见——
        冰封的武器、破碎的盾牌、倒塌的营帐。
        帝国在此设立了边境前哨，
        监视班图族的动向，
        同时也是与班图族进行有限贸易的场所。
      常驻势力:
        - 帝国边境守备队
        - 班图族临时居住区（历史遗迹）
      环境特征: 温带与寒带交界、战场遗迹

德洛斯帝国领:
  层级: 第一层·表层界中部~下部（多座浮空岛群）
  性质: 军事帝国·常备军驻地·混乱派核心
  描述: |
    表层界中部偏下的一片浮空岛群，
    德洛斯帝国在折叠后迅速重建了军事体制，
    是阿拉德诸势力中军事化程度最高的国家。
    帝国领横跨数十座中型浮空岛，
    以铁索桥和军用飞空艇航线连接，
    形成了一个易守难攻的岛链防御体系。
    帝国常备军是深渊防线的主力之一，
    每天与从深层涌上来的无知性魔物进行真实战斗——
    这支百战之师让安逸了六千年的十六种族感到战栗。
    帝国内部分裂为两派：
    温和派主张与公国合作争取种族棋子，
    激进派则享受"只有我们能杀人"的特权，
    暗中破坏夺棋计划，是混乱派的军事支柱。
  常驻势力:
    - 德洛斯帝国军（常备军，深渊防线主力）
    - 帝国激进派（混乱派核心，暗中与佧修派勾连）
    - 帝国商行（军火贸易、佣兵招募，在崖市和无法地带设有分部）
  军事力量: 阿拉德最强常备军，装备以重甲和攻城器械见长
  与十六种族: 激进派暗中接受地精种军工订单，温和派与人类种探索者有限合作
  政治立场: 帝国整体倾向混乱派，但温和派势力不可忽视

  子区域:
    灰尘浮带·沙漠气流区:
      旧称: 灰地沙漠
      描述: |
        帝都浮岛北侧的一片气流紊乱区，
        深渊气流卷起的沙尘在此形成持续的沙暴带。
        折叠时帝国北部沙漠被压入表层界，
        沙尘在气流作用下悬浮于空中，
        形成了一片移动的沙暴云。
        帝国舰队难以穿越，
        成为天然的北方屏障。
        偶有沙漠魔物从沙暴中冲出，
        袭击帝国边境岛屿。
      魔物: 沙暴元素、沙漠掠食者
      环境危险: 持续沙暴、能见度极低、气流紊乱
