---
岩浆海洋生态圈:
  层级: 第三层·深层界
  性质: 极端环境生态圈
  描述: |
    深层界的岩浆海洋并非死寂——
    星核层极端的地热和德拉里昂的辐射
    催生了一套完全不依赖阳光的生态系统。
    岩浆表面的冷却薄壳上生长着耐热菌毯，
    以地热化学能为食的岩浆蠕虫在薄壳下蠕动，
    火山口附近的热泉区域聚集着以矿物质为食的结晶生物。
    魔界原住民中的采集者冒着生命危险
    在岩浆海洋边缘收获耐热菌毯和矿物结晶——
    这些是深层界为数不多的食物和材料来源。
    使徒安图恩和希洛克栖息在岩浆海洋最深处，
    它们的存在本身就是这套生态系统的顶级变量。
  生态链: 地热化学能→耐热菌毯→岩浆蠕虫→结晶生物→使徒（顶级）
  资源: 耐热菌毯（食物）、矿物结晶（材料）、血色矿石（能源）
