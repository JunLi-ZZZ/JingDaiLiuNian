---
卡西利亚斯_无固定领地:
  层级: 跨层级（游荡于深渊各层）
  性质: 使徒·游荡者
  描述: |
    使徒中唯一没有固定领地的存在。
    卡西利亚斯活跃在深渊各层乃至迪司博德地表，
    到处寻找值得一战的强者。
    他与冒险家签订"召唤契约"——
    当契约者遭遇足够强大的敌人时，
    可以召唤卡西利亚斯前来对战。
    这种行为在使徒中独一无二，
    也让他成为冒险家中知名度最高的使徒。
    没有人知道他的真实目的，
    也许纯粹的战斗欲望就是他存在的全部意义。
  活动范围: 深渊全域及迪司博德地表
  态度: 对强者友善（以战斗为社交方式），对弱者无兴趣
