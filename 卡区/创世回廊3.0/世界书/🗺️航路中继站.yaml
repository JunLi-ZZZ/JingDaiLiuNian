---
天空之海·航路中继站:
  层级: 隔离层（约500~800km深度）
  性质: 航路补给点·临时停靠站
  描述: |
    天空之海中散布着数座由天空之城遗址改建的中继平台。
    这些平台锚定在反重力水体中的稳定节点上，
    是穿越隔离层的飞空艇和摩伽陀的必经停靠点。
    平台上设有简易补给站、重力校准设施和紧急避难所，
    由公国和天界联合维护。
    海栖种偶尔在平台附近出没，
    以鲜鱼和珊瑚换取阿拉德产的防水炼金涂料，
    但从不在平台上久留。
    穿越天空之海通常需要三到五天，
    中继站是旅途中唯一能喘口气的地方。
  运营: 贝尔玛尔公国+天界守备队联合维护
  人口构成: 无常住人口，仅有轮值维护人员和过路旅客
