---
根特皇都_悬挂之城:
  层级: 第二层·中层界（约900~1100km深度）
  性质: 天界首都·中层界最大城市
  描述: |
    中层界最大的城市，天界首都。
    重力倒置但体感完全正常——头顶的人造太阳缓缓移动，
    云层飘过，偶有降雨，若非知晓真相无人能分辨与地表的区别。
    天界人在此建造了一座工业与军事并重的钢铁皇都，
    空气中弥漫着火药味和机油味。
    卡勒特战争的创伤仍未完全愈合——
    北门和南门的防线遗址至今保留着战争痕迹，
    但城市核心区已恢复了繁忙的工业生产。
    皇女庭院是天界的政治中心，
    七神之鞘翅研究所则是最高科技机构。
    地精种的技术调查团对根特的机械文明垂涎三尺，
    但天界人对外来者的技术窥探极为警惕。
  常驻势力:
    - 天界皇室（皇女）
    - 天界守备队（城防、巡逻）
    - 七神之鞘翅研究所（军工研发）
    - 冒险家公会天界分部
    - 德洛斯帝国商行天界办事处（军火贸易）
  人口构成: 天界人为绝对主体，阿拉德商人和冒险家有一定数量，十六种族极少
  治安: 天界守备队严格管控，外来者需通行证
