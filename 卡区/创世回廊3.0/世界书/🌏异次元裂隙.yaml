---
# ─── 区域：异次元裂隙带·折隙异域 ───
# 旧称：异次元裂缝 & 远古地下城（Lv.70~80）

异次元裂隙带_折隙异域:
  区域总述:
    层级: 非固定——裂隙散布于深渊各层，入口随机出现又消失
    物理后果:
      地形: |
        折叠将三个世界压入同一垂直空间，
        空间应力在深渊各层撕开了无数裂隙——
        这些裂隙不连接深渊的其他层级，
        而是通向完全独立的异界空间或被封印的历史节点。
        裂隙入口不稳定，有的持续存在数百年，
        有的仅闪现数秒便消失。裂隙内部的物理法则
        由该异界自身的规则决定，与深渊环境无关。
      光照: 因异界而异，无统一规律
      重力: 因异界而异，部分空间重力混乱或缺失
      温度气压: 因异界而异
      水文: 因异界而异

  子区域:
    哥布林王国（Lv.70~75）:
      描述: |
        表层界中段某座浮空岛断面上的一道稳定裂隙，
        入口处不断喷出蒸汽和齿轮碎片。
        裂隙内部是一个被折叠夹在世界褶皱中的封闭空间——
        哥布林在这片与深渊隔绝的口袋领域中
        建立了完全自给自足的机械文明。
        爆炸声和锤击声从未停歇。
      魔物: 机械哥布林、蒸汽炮台、疯狂发明家

    蠕动之城（Lv.70~75）:
      描述: |
        隔离层天空之海边缘的一道裂隙，
        入口处的岩壁表面覆盖着缓慢蠕动的肉质薄膜。
        裂隙内部是一个由活体组织构成的封闭空间——
        折叠时某种巨型生物体被夹在世界褶皱中，
        其躯体膨胀填满了整个口袋空间，
        墙壁是肌肉，地面是皮肤，走廊是消化道。
        龙族战士卡姆拉率部驻扎于此，
        将这头活体空间当作天然堡垒。
      魔物: 龙族战士卡姆拉、活体城壁、肉芽守卫

    虚无之境（Lv.72~77）:
      描述: |
        深渊各层偶尔出现的不稳定裂隙，
        入口处空气呈现棱镜般的多面折射。
        裂隙内部是一个物理法则崩溃的抽象空间——
        折叠时空间应力将此处的三维结构碾碎重组，
        形成不断变换拓扑关系的几何迷宫。
        没有固定的上下左右，重力方向随脚下平面旋转，
        每一步都可能将行走者投射到空间的另一端。
        迷失在此的冒险家可能永远找不到出口。
      魔物: 空间异变体、几何守卫
      环境危险: 空间迷失、拓扑变换、重力紊乱

    黑色大地（Lv.73~78）:
      描述: |
        中层界深处某段废弃工业区岩壁上的一道裂隙，
        入口处光线弯曲，周围金属锈蚀速度异常加快。
        裂隙内部是混沌之神奥兹玛被封印的隔离空间——
        折叠时封印连同其中的空间一起被压入深渊壁层，
        形成一片被混沌之力彻底扭曲的荒原。
        光线在此弯曲成螺旋，声音延迟数秒才抵达耳膜，
        时间流速忽快忽慢。封印的力量正在缓慢衰减，
        混沌气息从裂隙边缘向深渊渗透。
      魔物: 混沌之神奥兹玛（封印体）、黑暗骑士、混沌元素
      环境危险: 混沌污染、时间扭曲、感知失调

    王的遗迹（Lv.74~80）:
      描述: |
        表层界下部暗礁沉陆区域的一道古老裂隙，
        入口处的岩壁被黑色金属覆盖，刻满了防御符文。
        裂隙内部是锤王波罗丁的不灭王国——
        折叠时这座地下王国被完整封入空间褶皱中，
        与外界隔绝了不知多少个世纪。
        王国以坚不可摧的黑铁筑成，
        波罗丁和他的五骑士仍在其中巡逻守卫，
        仿佛外面的世界从未改变。
      魔物: 锤王波罗丁、五骑士、不灭卫兵

    悲鸣洞穴（Lv.74~80）:
      描述: |
        暗礁沉陆裂隙隧道深处的一道裂隙，
        入口处传出持续不断的高频哀鸣。
        裂隙内部是魔剑阿波菲斯宿主努格尔虫的巢穴——
        折叠时虫巢被封入空间褶皱，
        深渊气流从裂隙缝隙灌入，穿过虫巢密布的孔洞
        发出不绝的悲鸣，这也是暗礁沉陆"悲鸣"传说的
        源头之一。魔剑的力量渗透了虫巢的每一寸，
        使整个空间弥漫着令人不安的剑意。
      魔物: 努格尔虫、魔剑眷属、虫巢守卫

    幽灵列车（Lv.75~80）:
      描述: |
        天空之海航路中偶尔出现的移动裂隙——
        一道沿固定轨迹在深渊中层缓慢漂移的空间裂缝。
        裂隙内部是一列永远行驶在浓雾中的列车，
        折叠时列车连同其行驶的空间一起被封入褶皱，
        形成了一个自我循环的封闭轨道。
        车厢中坐满了不知自己已死的亡灵乘客，
        列车长是唯一清醒的存在，但他也无法停下列车。
        裂隙入口每隔数月在深渊中层的不同位置出现一次。
      魔物: 亡灵乘客、列车长、车厢怪物

    痛苦之村列瑟芬（Lv.75~80）:
      描述: |
        过渡层寂静城外壁上的一道裂隙，
        靠近时皮肤表面会产生无来由的刺痛感。
        裂隙内部是第六使徒狄瑞吉的封印空间——
        折叠时使徒连同其领地被压入寂静城的壁层褶皱中，
        形成一座被永恒痛苦笼罩的封闭村落。
        村落中的一切生物都在承受无尽的苦痛却无法死去，
        狄瑞吉的投影隐藏在村落最深处，以众生的痛苦为食。
        裂隙边缘渗出的痛觉波动是寂静城中
        "无故疼痛区"的成因。
      魔物: 第六使徒狄瑞吉、痛苦傀儡、不死村民

    兰蒂卢斯的鹰犬（Lv.72~78）:
      描述: |
        中层界无法地带某段废弃轨道隧道尽头的一道裂隙，
        入口处残留着火药灼烧的焦痕和弹壳碎片。
        裂隙内部是卡勒特精锐部队的特训基地——
        折叠时这座秘密设施被封入空间褶皱，
        内部的训练场、武器库和改造手术室仍在运转。
        兰蒂卢斯的忠诚部下在此无限循环着战术演练，
        不知外面的战争早已结束。
        闯入者将面对卡勒特最精锐的战斗编制。
      魔物: 卡勒特精锐兵、改造人突击队、机甲小队

    比尔马克帝国试验场（Lv.74~80）:
      描述: |
        表层界某座偏远浮空岛的岩层深处，
        一道被多重封印覆盖的古老裂隙。
        裂隙内部是比尔马克帝国时代的绝密基地——
        帝国曾在此进行魔界生物转移实验，
        试图将魔界生物的力量移植到人类士兵体内。
        折叠时实验场被封入空间褶皱，
        失败的实验体在密闭空间中继续变异了数百年，
        如今已面目全非。基地的自动防御系统仍在运转，
        将一切活物视为"未授权入侵者"。
      魔物: 变异实验体、帝国自动防御机关、失控嵌合兽

    卡勒特指挥部（Lv.75~80）:
      描述: |
        中层界根特战区外围的一道隐蔽裂隙，
        入口伪装成普通的岩壁裂缝，极难发现。
        裂隙内部是突击队长兰蒂卢斯的作战指挥部——
        折叠时指挥部连同其中的通讯设备和作战沙盘
        一起被封入空间褶皱。
        兰蒂卢斯的投影仍在沙盘前推演战术，
        通讯设备发出的电波偶尔从裂隙缝隙泄出，
        干扰根特战区的无线电频段——
        天界通讯兵称之为"幽灵电台"。
      魔物: 兰蒂卢斯投影、卡勒特参谋团、通讯兵亡灵
