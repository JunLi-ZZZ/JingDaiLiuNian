---
第14位_兽人种:
  分类: 下位·探索队
  优势: 与人类种并列为深渊中数量最庞大的探索者
  动机: |
    东部联合的兽人种是十六种族中最尚武的下位种族。
    六千年的和平让战斗本能无处释放，深渊中合法的魔物狩猎正中下怀。
    巫女率领的探索队名义上"资源采集"，
    实际更接近一场盛大的狩猎祭典。
    年轻战士将深渊战绩视为荣耀的证明——
    "曾在泰拉深渊第二层狩猎过龙人军团长"
    比任何游戏胜绩都更有说服力。
  与阿拉德人: |
    "尊重强者"。虚祖武僧与兽人战士惺惺相惜，
    以切磋游戏代替寒暄。极少雇佣阿拉德人，
    更倾向以竞争猎物的方式并肩作战。
