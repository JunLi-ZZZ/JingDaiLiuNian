---
罗特斯领_魔界暗海:
  层级: 第三层·深层界（岩浆海洋中的液态区域）
  性质: 使徒领地·深海禁区
  描述: |
    深层界的岩浆海洋并非全部是炽热岩浆——
    在某些区域，地壳运动形成的深坑中积蓄着
    温度相对较低的液态金属和重水混合物，
    构成了魔界的"海洋"。
    使徒罗特斯栖息于此，
    这片暗海是深层界最不可测的区域之一。
    罗特斯的投影出现在表层界的天帷巨兽上，
    但本体从未离开过魔界暗海。
    偶有魔界渔民声称在暗海边缘看到过巨大的阴影，
    但没有人敢深入验证。
  控制范围: 深层界岩浆海洋中的液态深坑区域
  危险等级: 极高——高温海洋区域，非水栖生物无法进入
  态度: 不明
