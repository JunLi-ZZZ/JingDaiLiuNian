---
# ─── 区域：鲁夫特·悬空海运带 ───
# 旧称：鲁夫特悬空海港 & 海上列车（Lv.52~63）海上交通枢纽，海贼团出没的列车航线

鲁夫特_悬空海运带:
  区域总述:
    层级: 第二层·中层界中段（约1200~1500km深度）
    物理后果:
      地形: |
        鲁夫特原为天界的海上交通枢纽。折叠后，
        天空之海的残余水体渗入中层界地下水脉，
        在地表形成了河流和湖泊网络。
        鲁夫特海港利用这些水道建立了轨道交通系统，
        海上列车沿钢铁轨道在平原和丘陵间穿梭，
        连接中层界各主要城市节点。
      光照: 人造太阳照耀，有正常昼夜循环，轨道沿线另有电力信号灯辅助
      重力: 倒置但体感正常
      温度气压: 高湿度，水道和河流使空气潮湿
      水文: 天空之海渗水形成的河流湖泊网络，有正常降雨补充

  子区域:
    贵宾候车室（Lv.52~62）:
      旧称: 海上列车候车区
      描述: |
        鲁夫特海港最高层，建设在高空轨道上的悬空候车区。
        巨大的海上列车以此为起点通向深层海域，
        轨道在云海中穿梭，钢铁与魔法结合的工程奇迹。
        候车室落地窗外是无尽的云海。
        只有持特别通行证才能进入的高级区域。
        森精种在此以体面旅客身份等待列车，
        候车室内装潢精致，有独立的魔法通讯室和情报交换台。
        优雅、体面、信息流通量大——
        没有人会怀疑一个在候车室看书喝茶的精灵有什么企图。
        佧修派的联络暗号就藏在候车室的留言板上。
      魔物: 铁鳞海灿（人鱼）、变异鳄鱼

    贝尔玛尔租界（Lv.55~63）:
      旧称: 鲁夫特悬空海港·公国租界
      描述: |
        鲁夫特海港下层，公国租借的仓库区。
        钢铁与魔法结合的港口设施中，
        存放着大量从海洋深处打捞的古代遗物。
        天翼种以"考古顾问"身份获得合法通行权，
        翻找沾满藤壶的旧书和石板——
        每一件遗物都可能隐藏着关于赫尔德或古代文明的线索。
        租界有公国军队驻守，安全有保障，
        适合需要长期驻留分析文献的单独行动者。
      魔物: 龙龟、鱼人
