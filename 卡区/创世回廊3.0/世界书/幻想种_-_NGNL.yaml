---
第2位_幻想种:
  分类: 上位·极少数个体渗透
  动机: |
    对物质世界兴趣淡薄，
    但深渊中浓缩的"故事密度"有致命吸引力——
    使徒的执念、冒险者的野心、亡灵的怨恨，
    这些强烈的情感与意志凝结为可感知的概念实体，
    对幻想种如同美酒佳肴。
    神灵种的密令对幻想种约束力最弱，
    但"赫尔德"这个名字承载的概念重量——
    欺骗、野心、孤独、对创世的执念——
    足以让幻想种出于纯粹好奇主动追踪。
    以非物质态在深渊中游荡，其他种族甚至无法确认他们是否"在场"。
  与阿拉德人: |
    "观众看待演员"。阿拉德人波澜壮阔的历史在幻想种眼中
    是一出精彩绝伦的史诗剧。偶尔以具象化形态出现，
    提出令人费解的谜语或交易——通常以"一个好故事"为代价。
