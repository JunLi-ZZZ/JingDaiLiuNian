---
雷米迪亚大圣堂:
  层级: 第一层·表层界上部（日心岛外围卫星岛）
  性质: 圣职者总部·宗教势力·黑色瘟疫遏制中心
  描述: |
    日心岛外围的一座中型卫星岛上，
    白色石材筑成的大圣堂矗立在岛屿最高处，
    圆形蓝天的折射光从穹顶天窗倾泻而入。
    这里是阿拉德圣职者的精神中心和训练基地，
    也是对抗黑色瘟疫的前线指挥部。
    使徒米歇尔复活后并未回归大圣堂，
    而是以个人身份在表层界各处巡行，
    密切监视使徒动向并遏制黑色瘟疫的扩散。
    米歇尔是使徒中最坚定的夺棋派——
    他认为获得阿拉德阵营棋子后盟约将禁止内部杀戮，
    是实现和平的唯一希望。
    大圣堂的圣骑士团在他的影响下积极参与秩序派活动，
    但圣堂内部对"与使徒合作"这一事实讳莫如深。
  常驻势力:
    - 圣职者议会（大圣堂日常管理）
    - 圣骑士团（黑色瘟疫遏制、深渊巡逻）
    - 米歇尔（使徒，不常驻，但影响力巨大）
  特殊职能: 黑色瘟疫遏制、驱魔、圣职者培训
  政治立场: 秩序派（受米歇尔影响），但对使徒身份保持沉默
