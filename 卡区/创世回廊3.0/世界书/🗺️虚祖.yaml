---
虚祖领·素喃浮空古都:
  层级: 第一层·表层界下部（约350~450km深度，东方文明区）
  性质: 武道国家·抗魔团驻地·秩序派盟友
  旧称: 素喃
  描述: |
    表层界下部一座独立的大型浮空岩盘，
    虚祖国都素喃在折叠后保留了大部分建筑格局。
    岩盘边缘的断崖被改造为天然城墙，
    城内的武道馆、寺院和演武场沿山势层叠而建。
    表层界下部的折射阳光呈金橙色暮光，
    为这座东方古都增添了独特的氛围。
    念气在此格外浓郁，空气中可见金色微光。
    虚祖抗魔团是深渊防线的另一支主力，
    以精锐的念气武者和格斗家闻名。
    青龙大会和黄龙大会仍在此举办，
    但参赛者中开始出现兽人种挑战者——
    盟约将格斗转化为"游戏"，双方都乐在其中。
    虚祖在政治上坚定支持秩序派，
    与贝尔玛尔公国构成夺棋战略的双核心。
  常驻势力:
    - 虚祖王室与武道议会
    - 虚祖抗魔团（深渊防线精锐）
    - 秩序派外交使团（常驻崖市）
  军事力量: 精锐念气武者、格斗家，数量不及德洛斯但个体战力极强
  与十六种族: 兽人种探索者是最受欢迎的外来者，双方以切磋游戏建立了稳定合作
  政治立场: 秩序派核心

  子区域:
    碎石武馆:
      旧称: 岩壁道场（素喃外围）
      描述: |
        主岛外围，浮空岛侧面裸露的岩脊上。
        深渊上升气流长期冲刷形成风蚀地貌，
        终年刮着如刀割般的罡风，只有抓住岩缝铁链才能行走。
        虚祖格斗家在悬崖上开凿的修炼场，
        没有舒适的床铺，只有烈酒和跌打药。
        兽人种与虚祖武僧在此日夜切磋，岩壁上刻满拳印。
        沿铁链栈道步行半日可抵达素喃外城。
      魔物: 毒蝎、翼龙

    素喃工坊区:
      描述: |
        主岛东侧的工匠聚集区，红墙黄瓦的工坊沿岛屿边缘排列。
        锻造炉的火光昼夜不息，铁锤敲击声此起彼伏。
        虚祖最优秀的武器工匠和铠甲师在此工作，
        为抗魔团和武道家们打造念气武器和防具。
        工坊区的街道上弥漫着炭火和淬火油的气味，
        偶有兽人种探索者慕名前来订制装备。
      NPC: 素喃工坊大师、念气武器锻造师

    七金山决斗场:
      描述: |
        主岛北侧突出的岩峰，是虚祖武者比武切磋的圣地。
        岩峰顶部被削平为决斗场，四周环绕着观战台。
        强者在此以念气和武技一决高下，
        青龙大会和黄龙大会的决赛就在此举行。
        兽人种挑战者在此与虚祖武者切磋，
        盟约将格斗转化为"游戏"，双方都乐在其中。
      环境特征: 念气浓郁、金色微光、开阔视野

    王宫区:
      描述: |
        主岛中央，素喃国王的宫殿所在。
        宫殿建筑群采用东方传统风格，飞檐斗拱，雕梁画栋。
        念气浓郁到空气中可见金色微光，
        这里是虚祖念气修炼的核心区域。
        武道议会在王宫内召开，决定虚祖的重大事务。
        王宫外围是抗魔团总部，精锐武者在此驻守。
      NPC: 虚祖国王、武道议会长老、抗魔团团长

龙魂峰·念气圣地:
  层级: 第一层·表层界下部（素喃浮空岛群外围）
  性质: 念气修炼圣地·龙之魂封印地
  旧称: 月轮山
  描述: |
    素喃主岛外围的一座独立浮空山峰，
    山体被巨龙纳特拉的龙气笼罩。
    折叠时这座名山与素喃一起被压入表层界下部，
    成为虚祖领外围的一座卫星岛。
    山腰有月溪镇，山顶是龙之魂封印地。
    念气修炼者在山间洞穴中修行，
    但需警惕被龙气侵蚀——
    纳特拉的龙气与念气共鸣，
    能加速修炼但也可能让修炼者失控。
    山峰表面覆盖着东方风格的寺庙和修炼洞穴，
    金橙色暮光照耀下，整座山峰散发着神秘的气息。
  常驻势力:
    - 虚祖气功师（修炼指导）
    - 月溪镇居民（山腰聚落）
  魔物: 龙气侵蚀的野兽、失控的修炼者
  环境特征: 龙气浓郁、念气共鸣、金橙色暮光

  子区域:
    月溪镇:
      描述: |
        龙魂峰山腰的一座小镇，建筑依山势而建。
        镇中有多座气功道场，
        年轻修炼者在此接受基础训练后才能进山深造。
        镇上的茶馆和客栈是修炼者交流心得的场所，
        偶有兽人种探索者慕名前来学习念气。
        镇民以服务修炼者为生，
        提供食宿、装备维修和草药补给。
      NPC: 气功道场师父、镇长、草药商人

    龙之魂封印地:

      描述: |
        山顶的一座古老寺庙，
        巨龙纳特拉的龙魂被封印于此。
        寺庙周围的龙气浓度极高，
        空气中可见金色和银色的能量波动——
        那是念气与龙气的共鸣。
        只有最强的念气武者才能抵达此地，
        在龙气的压迫下完成最终的修炼试炼。
      环境危险: 极高浓度龙气、念气失控风险
