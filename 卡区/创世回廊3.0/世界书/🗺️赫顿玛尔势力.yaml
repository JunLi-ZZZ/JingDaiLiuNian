---
白垩王城·赫顿玛尔:
  层级: 第一层·表层界上部（日心岛中央）
  性质: 阿拉德最大城市·贝尔玛尔公国首都
  描述: |
    深渊开口正下方，表层界最大浮空岩盘的中央，
    圆形蓝天的光柱直射城市中心。
    白色石材筑成的城市在折射阳光下熠熠生辉，
    这里是贝尔玛尔公国的政治、经济和文化中心。
    斯卡迪女王的市政厅位于中心广场，
    月光酒馆是冒险家和决斗者的社交圣地，
    后街则是诺顿与热血八番街混混出没的灰色地带。
    折叠后城市的外围街区沿岩盘断崖层叠而建，
    铁索吊桥连接着周围的碎片卫星岛。
    十六种族的探索者在此补给、组队，
    但他们在城中的存在感远不如本地居民。
  常驻势力:
    - 贝尔玛尔公国王室（斯卡迪女王）
    - 冒险家公会本部
    - 暗街势力（诺顿、热血八番街）
    - 秩序派外交机构（负责与十六种族接触）
  关键NPC: 斯卡迪女王、索西雅（月光酒馆）、诺顿（后街）
  人口构成: 几乎全部为阿拉德人，十六种族探索者仅占极少数过客

  子区域:
    雷米迪亚大殿堂:
      描述: |
        城市中央广场北侧的大型宗教建筑，
        白色石材筑成的殿堂高耸入云，
        圆形蓝天的光柱从穹顶天窗倾泻而入。
        这里是圣职者教团的总部，
        也是阿拉德对抗黑色瘟疫的前线指挥部。
        殿堂内部供奉着光之力量的圣像，
        圣骑士团在此驻守，圣职者在此修行。
        使徒米歇尔复活后虽不常驻此地，
        但他的影响力笼罩着整座殿堂——
        圣职者们在他的指引下积极参与秩序派活动，
        遏制黑色瘟疫的扩散。
      NPC: 圣职者议会长老、圣骑士团长
      功能: 圣职者培训、黑色瘟疫遏制、驱魔

    魔法师公会:
      描述: |
        城市魔法区的核心建筑，一座高耸的法师塔。
        塔尖触及折射光柱的焦点，吸收光之能量。
        莎兰主持着公会的日常事务，
        这里是阿拉德魔法师的学术中心和社交场所。
        公会图书馆收藏着大量魔法典籍，
        实验室中魔法师们研究着深渊的奥秘。
        折叠后，魔法师公会对深渊的空间结构
        和泰拉能量进行了大量研究，
        为冒险家提供魔法支援和情报。
      NPC: 莎兰（公会主持）、魔法师导师
      功能: 魔法研究、魔法师培训、深渊研究

    冒险家公会总部:
      描述: |
        城市最高的建筑，塔尖触及折射光柱焦点。
        这里是所有冒险家的注册中心和任务发放地，
        公会大厅中挤满了准备下探深渊的冒险者。
        任务公告板上贴满了各种委托——
        从采集材料到讨伐魔物，从护送商队到探索未知区域。
        公会在深渊各层设有分部，
        但总部始终是冒险家的精神家园。
      NPC: 公会会长、任务接待员
      功能: 冒险家注册、任务发放、情报交换
