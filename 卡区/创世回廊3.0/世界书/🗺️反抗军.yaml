---
反抗军据点群:
  层级: 第一层·表层界各处（分散）
  性质: 游击组织·秩序派武装力量
  描述: |
    散布于表层界各浮空岛的隐蔽据点网络，
    反抗军是秩序派中最具行动力的武装组织。
    他们没有固定的大型基地，
    而是以小型据点、安全屋和秘密仓库构成的网络运作，
    在公国和虚祖的暗中支持下执行敏感任务——
    护送外交使团、拦截混乱派的破坏行动、
    搜集德洛斯激进派和佧修派的情报。
    反抗军成员多为退役冒险家和前公国军人，
    个体战力远超普通士兵。
  常驻势力:
    - 反抗军指挥部（位置保密，定期转移）
    - 各据点联络员
  与十六种族: 与人类种探索者中的秩序派同情者有秘密合作
  政治立场: 秩序派武装翼
