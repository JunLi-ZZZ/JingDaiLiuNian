---
希洛克领_星核深渊:
  层级: 第三层·深层界最深处（星核边缘）
  性质: 使徒领地·禁区
  描述: |
    深层界最深处，离星核最近的区域。
    岩浆海洋在此变为半凝固的炽热岩浆湖，
    温度高到连耐热金属都会软化。
    德拉里昂的银蓝光在此被星核的暗红热辐射完全压制，
    视野中只剩下无尽的暗红色。
    使徒希洛克栖息于此——这头曾与四剑圣决战的使徒
    选择了深层界最温暖、能量最充沛的区域作为巢穴。
    没有任何冒险家能在这种极端环境下存活，
    希洛克领是深层界公认的绝对禁区。
  控制范围: 星核边缘的岩浆湖区域
  危险等级: 致命——环境本身即可杀死一切非使徒级存在
  态度: 不明，希洛克不与外界交流
