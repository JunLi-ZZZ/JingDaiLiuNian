---
# ─── 外围·世界之痕 ───

环渊港·崖市:
  层级: 外围·世界之痕（迪司博德地表）
  性质: 大型贸易港·两世界交汇前哨
  描述: |
    外环海岸最宽阔的岩架台地上，一座依崖而建的港口城镇。
    停泊的不是海船而是飞空艇——崖市面朝深渊的一侧是笔直悬崖，
    外侧则是挤压隆起的浅海台地，潮汐落差数十米。
    这里是阿拉德人与迪司博德原住民接触的第一线。
    贝尔玛尔公国在此设立了外事署，虚祖派驻了常设使团，
    德洛斯帝国的商行沿崖壁阶梯排列，与地精种商铺比邻而居。
    冒险家公会总部的深渊分部设在崖顶最高处，
    所有下探深渊的队伍都须在此登记备案。
  常驻势力:
    - 贝尔玛尔公国外事署（秩序派核心据点）
    - 冒险家公会深渊分部（任务发放、队伍登记）
    - 德洛斯帝国商行（军火、补给、佣兵招募）
    - 地精种商铺（装备交易、矿石收购，数量不多但资金雄厚）
    - 吸血种情报屋（地图、魔物情报贩卖，隐蔽经营）
  人口构成: 阿拉德人占九成以上，人类种和兽人种探索者是最常见的外来面孔
  治安: 盟约在此生效，阿拉德人与十六种族之间不可互相杀害；阿拉德人内部由公国宪兵维持秩序

外环海岸·渔猎带:
  层级: 外围·世界之痕
  性质: 生态圈·资源采集区
  描述: |
    环渊港外围数百公里的海岸线，海床隆起形成的浅海台地上
    分布着丰富的渔场和潮间带生态。
    折叠时从深渊中涌出的泰拉能量渗入海水，
    催生了体型异常的甲壳类和发光水母群落。
    阿拉德渔民在此捕捞，所获海产既是崖市的食物来源，
    也是与海栖种贸易的主要商品。
    海岸散布着深海化石和矿脉露头，地精种的小型采矿队偶尔出没。
  生态: 巨型甲壳类、发光水母、泰拉能量渗透的变异鱼群
  危险: 潮汐不规律（深渊气流影响），偶有深渊边缘爬上来的低级魔物

法罗环湾·珍珠海岸:
  层级: 外围·世界之痕（迪司博德地表西侧）
  性质: 海湾贸易区·珍珠养殖场
  旧称: 法罗湾
  描述: |
    外环海岸西侧的一片弧形海湾，
    海床隆起形成的浅海台地上分布着大量珍珠贝养殖场。
    折叠时这片海湾被挤压隆起，
    形成了相对平静的内湾水域。
    海湾内侧是相对平静的水域，
    外侧则直面深渊开口的潮汐冲击。
    西海岸港口就位于海湾最内侧，
    是阿拉德西部沿海地区的主要港口。
    珍珠贝养殖是海湾的主要产业，
    阿拉德商人在此收购珍珠，
    运往赫顿玛尔和帷塔伦的贵族市场。
    海栖种偶尔在海湾外围出没，
    以珍珠和海产换取阿拉德的金属工具。
  常驻势力:
    - 西海岸港口管理局
    - 珍珠商人公会
    - 渔民协会
  人口构成: 阿拉德渔民和商人为主，海栖种偶尔出现
  经济: 珍珠养殖、海产捕捞、海上贸易

  子区域:
    瓦拉浮城:
      旧称: 瓦拉岛
      描述: |
        法罗湾内一座建在海床隆起岩礁上的人工城市。
        城市以木栈道和浮桥连接多个岩礁，
        形成水上街区。
        折叠前这里是自由港，
        折叠后被德洛斯帝国占领，
        帝国在此驻军控制西海岸贸易。
        但市民组织的无畏者仍在暗中抵抗，
        在水下通道和隐蔽仓库中策划反抗行动。
        瓦拉浮城是法罗湾的贸易中心，
        也是帝国与反抗军暗中角力的战场。
      常驻势力:
        - 德洛斯帝国驻军（占领军）
        - 无畏者（抵抗组织）
        - 海上商人
      环境特征: 水上城市、木栈道、浮桥网络
