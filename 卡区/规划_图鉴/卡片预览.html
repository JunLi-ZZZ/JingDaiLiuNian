<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><title>图鉴卡片预览</title>
<style>
/* === 复用物品的品阶配色（实际使用时会加载线上字体，预览里用系统字体替代）=== */
.tier-废种{background:linear-gradient(90deg,#444,#666,#555,#777,#666,#555,#444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.tier-凡种{background:linear-gradient(90deg,#b0b0b0,#d0d0d0,#c8c8c8,#e0e0e0,#d0d0d0,#c8c8c8,#b0b0b0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.tier-良种{background:linear-gradient(90deg,#2e7d32,#4caf50,#43a047,#66bb6a,#4caf50,#43a047,#2e7d32);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.tier-精种{background:linear-gradient(90deg,#0d47a1,#1976d2,#1565c0,#42a5f5,#1e88e5,#1565c0,#0d47a1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.tier-珍种{background:linear-gradient(90deg,#4a148c,#7b1fa2,#6a1b9a,#ab47bc,#8e24aa,#6a1b9a,#4a148c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.tier-异种{background:linear-gradient(90deg,#f06292,#f48fb1,#fce4ec,#f8bbd0,#f48fb1,#ec407a,#f06292);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.tier-仙种{background:linear-gradient(90deg,#fbc02d,#ffee58,#fff9c4,#fff176,#ffee58,#fdd835,#fbc02d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.tier-圣种{background:linear-gradient(90deg,#e65100,#ff9800,#ffe0b2,#ffcc80,#ff9800,#f57c00,#e65100);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.tier-神种{background:linear-gradient(90deg,#7f0000,#c62828,#b71c1c,#f44336,#e53935,#b71c1c,#7f0000);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.tier-特殊{background:linear-gradient(90deg,#7c4dff,#448aff,#00b0ff,#00e5ff,#76ff03,#ffea00,#ff6d00,#f06292,#ff6d00,#ffea00,#76ff03,#00e5ff,#00b0ff,#448aff,#7c4dff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.c-废种{--tc:#888;--bg:#161412;--ti:linear-gradient(90deg,#444,#666,#555,#777,#666,#555,#444);--co:#aaa;--cm:#777}
.c-凡种{--tc:#c0c0c0;--bg:#ede4d3;--ti:linear-gradient(90deg,#b0b0b0,#d0d0d0,#c8c8c8,#e0e0e0,#d0d0d0,#c8c8c8,#b0b0b0);--co:#3d3226;--cm:#6b5d4a;--ca:#8b7355}
.c-良种{--tc:#4caf50;--bg:#1a241e;--ti:linear-gradient(90deg,#2e7d32,#4caf50,#43a047,#66bb6a,#4caf50,#43a047,#2e7d32);--co:#c8e6c9;--cm:#81c784}
.c-精种{--tc:#2196f3;--bg:#181e2a;--ti:linear-gradient(90deg,#0d47a1,#1976d2,#1565c0,#42a5f5,#1e88e5,#1565c0,#0d47a1);--co:#bbdefb;--cm:#64b5f6}
.c-珍种{--tc:#9c27b0;--bg:#20182a;--ti:linear-gradient(90deg,#4a148c,#7b1fa2,#6a1b9a,#ab47bc,#8e24aa,#6a1b9a,#4a148c);--co:#e1bee7;--cm:#ba68c8}
.c-异种{--tc:#f06292;--bg:#2a1820;--ti:linear-gradient(90deg,#f06292,#f48fb1,#fce4ec,#f8bbd0,#f48fb1,#ec407a,#f06292);--co:#f8bbd0;--cm:#f48fb1}
.c-仙种{--tc:#fbc02d;--bg:#2a2410;--ti:linear-gradient(90deg,#fbc02d,#ffee58,#fff9c4,#fff176,#ffee58,#fdd835,#fbc02d);--co:#fff9c4;--cm:#fff176}
.c-圣种{--tc:#ff6d00;--bg:#2a1c0a;--ti:linear-gradient(90deg,#e65100,#ff9800,#ffe0b2,#ffcc80,#ff9800,#f57c00,#e65100);--co:#ffe0b2;--cm:#ffcc80}
.c-神种{--tc:#e53935;--bg:#2a1414;--ti:linear-gradient(90deg,#7f0000,#c62828,#b71c1c,#f44336,#e53935,#b71c1c,#7f0000);--co:#ffcdd2;--cm:#ef9a9a}
.c-特殊{--tc:#81d8d0;--bg:#102a28;--ti:linear-gradient(90deg,#00695c,#26a69a,#80cbc4,#b2dfdb,#80cbc4,#26a69a,#00695c);--co:#b2dfdb;--cm:#80cbc4}

@keyframes bs-shimmer{0%{background-position:0% center}100%{background-position:200% center}}
.bs-card{display:block;width:100%;max-width:480px;margin:10px 0;border-radius:9px;position:relative;padding:1px;background:var(--ti);background-size:200% auto;animation:bs-shimmer 4s linear infinite;font-family:'DouyinSans','Noto Serif SC','Source Han Serif SC','Microsoft YaHei',serif}
.bs-card .bs-inner{border-radius:8px;overflow:hidden;position:relative;background:var(--bg)}
.bs-card .bs-hd{display:flex;align-items:center;gap:8px;padding:12px 16px 8px;background:rgba(255,255,255,.06)}
.bs-card .bs-hd .bs-ico{display:inline-block;width:1.1em;height:1.1em;vertical-align:-.2em;color:var(--tc);flex-shrink:0}
.bs-card .bs-nm{font-weight:700;font-size:1.2em;letter-spacing:.04em;background-size:200% auto!important;animation:bs-shimmer 4s linear infinite}
.bs-card .bs-tier{font-size:.68em;padding:2px 8px;color:var(--tc);white-space:nowrap;letter-spacing:.06em;border:1px solid var(--tc);border-radius:4px;background:rgba(255,255,255,.03);margin-left:auto}
.bs-card .bs-bd{padding:8px 16px 10px;font-size:.85em;line-height:1.7;background:rgba(255,255,255,.03);color:var(--co)}
.bs-card .bs-bd .bs-row{display:flex;align-items:baseline;gap:6px;margin-bottom:3px}
.bs-card .bs-bd .bs-row:last-child{margin-bottom:0}
.bs-card .bs-bd .bs-lbl{font-size:.78em;color:var(--cm);white-space:nowrap;min-width:2.5em}
.bs-card .bs-ft{display:flex;align-items:center;gap:8px;padding:7px 16px;font-size:.74em;color:#b8a890;background:rgba(0,0,0,.08);border-top:1px solid rgba(255,255,255,.06)}
.bs-card .bs-ft .bs-ico{display:inline-block;width:1em;height:1em;vertical-align:-.15em;margin-right:2px;color:var(--tc)}
.bs-card .bs-ft .bs-drop{display:flex;align-items:center;gap:3px;padding:3px 8px;border:1px solid var(--tc);border-radius:4px;background:rgba(255,255,255,.025)}
</style>
</head>
<body style="background:#1a1a1a;padding:20px;">

<div class="bs-inner">

<div class="bs-bd">
<div class="bs-row"><span class="bs-lbl">种族</span><span class="bs-val">真龙</span><span style="color:var(--cm);margin:0 4px">·</span><span class="bs-val">纯血真龙·异色樱粉</span></div>

</div>
</div>
</div>

<span style="display:flex;align-items:center;gap:2px;padding:3px 8px;border:1px solid rgba(156,39,176,.25);border-radius:4px;background:rgba(255,255,255,.025);margin-left:auto">白芙澪赠予</span>
