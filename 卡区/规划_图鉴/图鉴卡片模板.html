.bs-card{display:block;width:100%;margin:10px 0;border-radius:9px;position:relative;padding:1px;background:var(--ti,linear-gradient(90deg,#444,#666));background-size:200% auto;animation:bs-shimmer 4s linear infinite,bs-ent .45s ease-out;font-family:'DouyinSans','Noto Serif SC','Source Han Serif SC',serif}

.bs-card .bs-bd .bs-row:last-child{margin-bottom:0}
.bs-card .bs-bd .bs-lbl{font-size:.78em;color:var(--cm,#8a7e6e);white-space:nowrap;min-width:3em}
.bs-card .bs-bd .bs-val{color:var(--co,#d5c8b2)}
.bs-card .bs-ft{display:flex;align-items:center;gap:8px;padding:7px 16px;font-size:.74em;color:#b8a890;background:rgba(0,0,0,.08);border-top:1px solid rgba(255,255,255,.06)}
.bs-card .bs-ft .bs-ico{display:inline-block;width:1em;height:1em;vertical-align:-.15em;margin-right:2px;color:var(--tc,#c4a87a)}
.bs-card .bs-ft .bs-drop{display:flex;align-items:center;gap:3px;padding:3px 8px;border:1px solid var(--tc,rgba(200,160,110,.14));border-radius:4px;background:rgba(255,255,255,.025)}
