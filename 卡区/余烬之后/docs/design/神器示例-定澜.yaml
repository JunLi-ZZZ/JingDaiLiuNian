---
定澜:
  简介: >-
    原初冲突震动虚海时，众多尚未成形的位面被卷向同一处崩塌。
    本源中维系方位与动势的部分，在撕裂中凝成了一柄长枪。它落下的地方，乱流第一次有了绕行的中心。
    后来的渡海者将它称作定澜。最早留下的图像里，它没有握在谁的手中，只斜斜插在一座载满人的断桥上。
  武器种类: 长枪
  本质序列: 本源
  本源侧面: 支点与动势。使事物在变化中保持自身的位置，并将承受的推动传向选定的方向。

  外观与特征:
    初始形态:
      轮廓: 枪身修长，通长约两米三；窄长的双刃枪尖微微偏离中轴，一侧完整，另一侧保留着潮水侵蚀般的缺口。枪尾装有短锥，可倒持点地。
      材质: 枪刃呈乳白色半透明质地，内部悬着一线凝固的橙金色潮光。枪杆外层是烟青色结晶，沿握持处向两端渐渐透亮，深处能看见缓慢移动的细小碎片。
      细节: 枪缨由七根长短不一的银白细链组成，末端各悬一粒没有棱角的透明碎晶。静止时，细链朝向附近最强的流动；承受冲击后，它们逐根亮起，轻轻叩击枪杆。
      配色: 乳白枪刃、烟青枪杆、银白细链，橙金潮光从内部透出。
    觉醒显征:
      轮廓: 枪刃的缺口延伸出半透明的另一半刃缘，实刃与虚刃之间留着一道细长空隙。枪杆内的碎片围绕中轴排列，随着持有者的动作改变间距。
      动态: 蓄势时，周围的雨、尘与碎光绕枪身形成倾斜的环。出枪的一瞬，环形轨迹被拉成一条笔直的亮线；收枪之后，迟到的潮声才沿着枪缨响起。
      辨识: 枪尖、枪尾与所有立下的支点之间，偶尔出现极细的橙金连线。旁观者能够借此发现它正在支撑什么，也能看见支点逐渐失守。

  核心能力:
    立点: 枪尖或枪尾触及某处时，可以将其确立为支点。支点提供一处可供施力、辨认方向和维持相对位置的依据；在水面、半空与位面裂隙中也能成立。
    承势: 持有者借枪身格挡、抵住坍塌的结构或撑住乱流时，支点承担其中一部分冲击，并将其留存在枪内。枪杆里的碎片会朝来力方向偏移，形成可见的余势。
    回澜: 留存的余势可以沿枪尖释放，加入刺击、挑击、推送或牵引。力量的去向由持枪动作决定；一记刺击足以破开敌阵，同样的积蓄也能把一条将沉的渡船送回岸边。

  初始解放:
    适用状态: 刚刚建立共鸣、能够稳定握持时的起始尺度。后续成长将改变承载量、距离、作用对象与控制精度。
    余势:
      定义: 枪内已承接且仍可调用的冲击，以独立储能记录。
      容量: 持有者当前攻击的三倍。
      蓄积: 成功以定澜正面承接攻击时，将防御与抗性结算后、本将由持有者承受的伤害中的三成转入余势；本次减伤量以剩余容量为上限，其余伤害照常承受。
      留存: 余势保留十分钟。再次承接或主动释放时重新计时；计时结束，枪杆中的碎光散尽，余势归零。
      溢出表现: 枪缨全部绷直，握持处开始震颤。此时继续承受的力量会落在持有者与支点所依附的结构上。
    枪术:
      基础攻击: 依照持有者的攻击、武技与目标防护结算。普通刺击的初始伤害倍率为1.2，挑拨与扫击按实际动作取得各自的命中范围和效果。
      回澜一击: 持有者选择释放的余势量，将其八成加入本次攻击的防御前伤害；一次攻击可以耗尽全部余势，也可以只释放其中一部分。
      借势转向: 成功接住可推动、拨转的实物或冲击时，可消耗余势改变其去向。转向距离、夹角与目标体量共同决定消耗，先确定本次作用尺度，再结算储能。
    定潮桩:
      施展: 消耗10点能量，以枪尖或枪尾立下一个支点，可在十米内移动握枪位置并继续借力。
      维持: 初始可同时维持一个支点，持续三十秒。持续承载每十秒消耗5点能量，主动松开后支点消散。
      承载: 初始足以稳住持有者及一名体量相近的同行者，或承担相近尺度的牵拉。更大的负荷会使支点出现裂纹，余势与持有者的能量可用于延缓其崩解。
      战斗运用: 借支点在空中回身、抵抗击退、将枪身作杠杆改变敌人的重心；同一支点也可作为同伴攀援、转移或跃向下一处落脚点的支撑。

  深层解放:
    形成方式: 当持有者在真实经历中拓展了对支点、承载与动势的理解，定澜会回应新的用法。觉醒沿着实际使用积累展开，新的能力定义记录其触发、作用尺度、消耗与表现。
    本源潜力: >-
      支点可由具体的落脚处扩展到相对位置与位面间的联系。
      足够深入的共鸣能够撑住正在合拢的通路，让离散的两岸暂时保持可跨越的距离；
      也能将多处支点之间承受的冲击引向同一枪尖，使整片战场的动势参与一次出枪。
      作用范围越大、持续越久，参与承载的能量与支点就越多；支点的布置、同伴的协作和地形都会改变结果。
    代价表现: 过度承载会把震颤传入身体，留下肌肉撕裂、骨骼损伤与方向感紊乱。枪杆中暂时沉寂的碎片对应尚未恢复的承载能力，可通过休整、修复或适合的力量滋养逐步复原。

  相关线索:
    留存记录: 虚海渡路的旧航图上，曾有一处画着断桥的空白。数个彼此没有往来的位面都流传着相近的讲述：海已经退走，桥下却仍有潮声，桥中插着一根无人拔起的长杆。
    现场迹象: 临近定澜的沉睡处，坠落的砂石会短暂停在某个高度，再沿相同方向滑开。经过的人常感觉身体突然轻了一点，随后听见一声很轻的金属叩响。
    接触: 枪身会映出接触者此刻承受的重量。救援时背着的人、搏斗中抵住的重压、跨越裂隙时拉紧的绳索，都可能成为第一次共鸣的媒介。
    共鸣: 接近其他本源碎片时，枪缨会各自指向不同方位。若两件神器同时被调用，连线会显露出它们之间尚可衔接的力路。

  神器交互:
    断界: 断界切出的裂隙可由定澜立点支撑。裂隙的两端因此获得暂时稳定的位置，供同行者依次通过；两件神器的持有者共同承担维持通路的负荷。
    永誓: 永誓承住正面的冲击，定澜为其建立可转移力量的支点。守护者可以将一次重击引向预先选择的空地，也可以让同伴借势冲出包围。
    归一: 归一连接的两处空间可以成为一对相互借力的支点。渡行者能够从另一端拉住正在倾覆的舟船，或为失去地面的队伍铺设短暂的跨界落脚处。
