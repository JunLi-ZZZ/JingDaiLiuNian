---
定澜:
  简介: >-
    原初冲突中，诸界赖以维系方位的本源法则被撕开。尚未形成边界的世界彼此穿透，古老宇宙的昼夜在同一瞬间重叠。
    一枚本源碎片在崩解的中心凝成长枪。枪尖落定，无数位面重新显出各自的界膜，万象围绕它恢复了位置。
    定澜之名由此流传。古代界域图上，它以一道贯穿诸天的银线标记，银线两侧，是重新分开的宇宙。
  武器种类: 长枪
  本质序列: 本源
  本源侧面: 存在的锚定与诸界的动势。为变化中的事物确立坐标，汇集、引导并释放作用于其上的力量。

  外观与特征:
    初始形态:
      轮廓: 通长约两米三，枪锋纤长，双刃如两片相合的银白界膜。刃间留有一线贯穿的空隙，透过空隙可以看见与所在世界不同的天穹。
      材质: 枪杆呈通透的烟晶色，内部悬浮着细小的位面投影。投影随持有者的呼吸缓缓改变方位，偶尔显露大陆的轮廓或一整片旋转的星系。
      细节: 七缕银白光丝垂在枪锋下，末端各环绕一枚橙金刻印。立下支点时，光丝舒展为同心的界环；收枪后，界环逐一叠回枪身。
      配色: 银白锋刃、烟晶枪杆、橙金刻印，极淡的全谱反光沿刃间空隙流动。
    深层显现:
      轮廓: 枪锋可依作用对象延展，跨越距离时仍与持有者的动作完整相连。它在每个相关位面留下同一柄枪的投影，所有投影共享一个枪尖。
      动态: 发动时，周围事物的运动轨迹显露为细密光线，汇向枪锋下的界环。出枪的轨迹笔直，界环依次展开，远处的位面气泡在同一瞬间显出清晰的边缘。
      辨识: 静置时仅有刃间的异界天穹缓缓变化。持有者可让显征收束到枪身，也可展开对应当前权能的界域投影。

  核心能力:
    立点: 将枪锋抵达之处确立为支点。支点可依附于个体、物体、空间位置或界域联系，为其保留稳定坐标。
    承势: 定澜接住冲击时，将可承接的力量转入枪内储备。界环中的光线记录来力方向，持有者可将其汇聚、分流或重新定向。
    贯界: 出枪时以支点相连的路径传递力量。刺击可以穿行空间缝隙，挑拨可以改变被锚定对象的运动，枪尾落定则能为整片结构提供支撑。

  数值与机制:
    基础攻击-界锋:
      作用: 依照当前解放层次与持有者的枪术登记攻击参数，枪锋与本次确立的空间路径共同决定可触及的目标。
      结算: 命中、伤害与消耗取当前能力档案；本源序列表达权能性质，实际可调用规模由神器共鸣与储备记录。
    被动效果-万象承势:
      作用: 成功以定澜承接的冲击，一部分转入独立的余势储备。单次转化量与储存上限记在当前能力档案。
      储备: 余势可以跨次行动积蓄，并与神器自身恢复的本源储备分别记录。未使用的储备保持稳定，达到容量后停止继续转存。
    主动技能-一线定界:
      作用: 在枪锋触及的位置确立支点，维持选定对象之间的相对位置。可在虚空中建立落脚处，也可使正在错位的界门重新对齐。
      运用: 支点随持有者的意图连成可供借力的路径。枪术可以沿路径回身、突进、牵引或守住目标，具体动作现场展开。
      结算: 登记支点的对象、范围、持续时间及本次储备消耗；规模随实际解放程度成长。
    主动技能-诸天回响:
      作用: 将储备沿选定支点释放。聚于枪锋时形成贯穿打击，沿界环展开时可推动或托住大片结构，分流时可同时回应不同方向的冲击。
      显征: 出枪处只留一线银白，力量抵达的各处同时显出橙金界环，随后所有光线沿枪锋归拢。
    深层权能-万界同锚:
      作用: 在彼此分离的世界间保留共同坐标，让空间漂移、界膜闭合或局部法则改变之后的通路仍可重新寻回。
      展开: 共鸣深入时，可将一个正在解体的位面锚在其尚且完整的结构上，争取修复所需的时间；也可召集多处支点承接的力量，使诸界动势汇于一次出枪。
      储备: 神器以自身本源支撑作用，当前规模由储备与解放程度决定。收束后自行恢复，持有者可主动调整作用范围与持续时间。

  成长空间:
    共鸣: 对空间结构的理解、枪术的形成、与其他本源碎片的联系以及旅途中的实际运用，都能使新的权能逐渐清晰。
    演变: 新的运用由既有法则与真实经历推演，落档时记录对象、作用尺度、触发与消耗。支点的形态、传力方式与跨界联系可以随持有者形成独特的发展。
    亲和: 定澜回应持有者为某个存在保留位置的意图。它能撑住濒临崩解的世界，也能在喧闹的人群里，为一只伸来的手保持恰好可以握住的距离。

  相关线索:
    最后记录: 数个位面的古老星图，在互不相关的天区记下同一道银白直线。将星图按各自界膜的方位展开，直线会汇于一处尚未命名的虚空坐标。
    界域遗迹: 该坐标附近漂浮着早已失去中心的巨大界环。残环内侧仍映着完整世界的天空，彼此之间的距离历经漫长岁月也未改变。
    神器共鸣: 其他本源碎片接近时，枪中的位面投影依次转向，显出可与对方衔接的法则轨迹。

  特殊交互:
    神器联动-断界立门: 断界切开界膜，定澜为裂隙两端确立共同坐标，形成可供往来的稳定通路。
    神器联动-永誓承天: 永誓展开守护，定澜将守护边界化为相互支撑的界环，把散落各处的冲击汇入共同储备。
    神器联动-归一枢衡: 归一连接诸界，定澜保留各端坐标与相对关系，使跨界行动与力量传递沿选定路径抵达。
