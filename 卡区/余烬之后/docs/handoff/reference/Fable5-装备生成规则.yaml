装备生成规则:
  定位: 装备提供固定或条件触发的被动效果，不占用能力位，主要覆盖防护、抗性、负重、感知增强等辅助作用。

  来源:
    位面本土工艺按该世界的技术水平、材料体系和制作传统生成；战利品击败携带装备的敌对实体后掉落，品质与对方实力相称；交易获得从商人、工匠或其他角色处购买或委托制作；任务奖励完成委托、探索或救助后获得的报酬。

  生成约束:
    效果明确，每件装备最多3个效果，写清数值、触发条件和持续时间。代价平衡，更强的效果需要更高的负重、更苛刻的使用条件、或明显的副作用。位面适配，装备的材料、工艺和命名符合该位面的文化与技术水平。品阶采用通用标准：凡常、精良、稀有、史诗、传说、神话、本源。按实际作用层次、结构完整度与稀缺性定阶。

  必填字段:
    名称简短直观，体现核心特征；类型为武器、防具、饰品、工具；品阶为凡常、精良、稀有、史诗、传说、神话、本源；效果数组，每项包含作用描述、数值、触发条件、持续时间；负重0-10，影响携带上限和行动灵活度；装备位为头部、躯干、手部、腿部、饰品、背包；来源说明简述获得方式或制作背景。

  生成时机:
    战斗结束后检查敌方装备，按掉落率判定是否获得；进入有交易功能的地点时，生成符合当地工艺水平的装备供选购；完成任务时，按任务难度和委托方身份生成对应品阶的奖励装备。

