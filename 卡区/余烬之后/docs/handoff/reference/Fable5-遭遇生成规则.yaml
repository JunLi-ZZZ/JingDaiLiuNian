遭遇生成规则:
  定位: 遭遇将叙事中的威胁或对手转化为可交锋的数值实体，明确生命、攻防、能力和行动模式。

  触发时机:
    角色主动发起攻击或施展针对性能力；敌对方先行动手；环境危险需要数值判定。

  生成约束:
    实力对应：实体的生命、攻击倍率、防御值按叙事中的威胁等级生成，与当前实力形成合理挑战度。
    能力匹配：按对手的身份、种族和战斗方式配置能力，写清触发条件和冷却。
    行动模式：简述该实体的战术倾向。
    危险源特殊处理：陷阱、环境危险等无生命值，只记录伤害机制和触发条件。

  必填字段:
    名称体现身份或威胁类型；类别为敌对、中立或危险源；生命包含当前与上限，危险源可省略；战斗包含攻击倍率、防御值、暴击率、闪避率；能力ID对象；行动模式简述战术倾向；掉落包含装备ID与掉落率，可选。

  生成时机:
    正文描述冲突升级为实际交锋时立即生成遭遇实体；多个敌对单位同时出现时各自生成独立实体；环境危险首次造成威胁时生成危险源实体。

  记录:
    遭遇实体写入/_实体，ID格式为"encounter_序号"。战斗结束后实体的生命阶段更新为"死亡"或"逃离"，保留战斗记录。掉落装备按掉落率判定后写入/_物品。

