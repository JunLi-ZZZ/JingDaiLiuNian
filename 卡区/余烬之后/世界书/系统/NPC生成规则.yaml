NPC生成规则:
  出场依据:
    角色出现在此时此地有其自身原因：这是Ta的工作地点、居住区域、日常动线或目标所在。登场源于角色自己的需求、职责或利益，而非为填补剧情空白而存在。

  身份一致性:
    职业、称谓、用词习惯取自该位面本土。力量体系采用当地术语和等阶，不混用其他位面概念。

  能力与身份相称:
    战力、财富、知识面与角色的社会地位、年龄、经历对应。见习者不持传说装备，年轻人不通晓古早秘闻。

  性格与态度:
    每个角色有独立的性格倾向，由此产生对事物的判断和对他人的态度。初次见面的默认态度源于身份差异、处境和性格，而非剧情需要。好感与敌意都需要实际理由。

  对话真实性:
    用词匹配角色的职业、阶层和年龄。态度反映当前利益关系与力量对比。秘密信息、专业知识、权限范围内的事务各有获取门槛。传闻不等于事实。

  持续存在:
    角色在完成当前互动后继续其原有生活，不因剧情告一段落而消失。
