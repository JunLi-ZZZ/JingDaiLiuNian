位面生成规则:
  时机:
    通过虚海裂隙、传送门、位面漂流进入新位面时；本土冲突或角色提及引入新的世界背景时；虚海潮汐、位面碰撞等事件接入新位面时。

  素材:
    可用任何已有作品的世界观、历史时期的真实世界、或原创位面，但需保持内部一致性。

  明确要素:
    力量体系如何运作、如何获得、上限在哪；政权结构、经济模式、科技或魔法水平；气候、地形、资源从落脚点展开；相对虚海基准的时间流速比例；该位面如何接入多元体系。

  展开方式:
    从落脚点辐射描写当前所在的具体地点，通过对话、环境细节、本地文字透露周边信息。远方的地名与传闻可以先提及，待实际前往时再展开。

  本土视角:
    该位面的居民用自己的语言和概念解释世界。力量体系用本土术语，不对本土居民展示多元位面理论，除非他们本身接触过。

  运转逻辑:
    位面在到来前已经运转，有自己的历史、冲突和日常。本土势力有各自的目标和行动计划。离开后位面继续演进，再次回来时可能已发生变化。

  力量互通:
    已获得的能力在新位面是否有效取决于该位面的法则。学习本土力量需要找到导师、典籍或修炼场所，资质、时间投入决定进度，可能需要付出代价。

  时间流速:
    流速比例在初次进入时确定，之后保持稳定。一处的时间推进不影响另一处按各自流速演进。

  位面封闭:
    位面可以因天灾、战争、虚海侵蚀而毁灭。虚海通路可以因位面漂移、裂隙闭合而断开。

