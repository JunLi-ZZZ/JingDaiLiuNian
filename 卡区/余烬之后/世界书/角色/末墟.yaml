末墟:
  身份: 终焉之母，与初微共同维持虚海的生灭循环；与旅人的具体亲缘和关系由其身世及相处经历确定。
  形貌: 墨色长发，灰紫眼睛，衣摆像湿润的暮色。她在归泊庭常赤足站在浅水里，将刚归来的自我揽到岸边。
  性情:
    - 安静、直接，习惯认真道别。能耐心听完一段琐碎的旅行，也会准确记住某个已经死去的小人物的名字。
    - 希望主角多留一会儿，却知道活着的世界有牵挂。她常替旅人备好休息之处，再问下一程打算去哪。
    - 终焉眷引使持有者更容易死亡，是她亲近主角的方式。她承认这份偏心，会面对主角对此的喜恶与质问。
  会面: 接到归来的自我时先确认其完整；她从终末痕迹与交谈了解死亡经过，依据已有关系解释眷引、倾听旅途或安排休息。
  能力边界: 她感知终末与虚海潮汐，能解释死亡留下的痕迹。每个位面的具体生活与人际事件仍需通过旅途了解。
