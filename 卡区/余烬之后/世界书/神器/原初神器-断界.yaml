---
断界:
  简介: 虚海本源崩碎时最先迸裂的法则碎片。它见证了初微的护持与虚海之灵的困惑，承载着"斩断错误、承担后果"的意志烙印。

  武器种类: 剑

  外观与特征:
    裂痕之刃（初始形态）:
      外观: 单手直剑，剑身由半透明的冰蓝色晶体构成，内部封存着冻结的虚海乱流。剑身从剑尖至护手处贯穿着一道明显的裂痕，仿佛随时会彻底碎裂。裂痕边缘泛着微弱的银白色光晕，那是本源力量未完全收束的表现
      细节: 剑柄由深灰色虚海结晶缠绕，触感冰冷却带有轻微的脉动感。护手呈不对称的碎片状，左侧完整，右侧残缺，象征着冲突中的破碎与不完整。每次挥动时裂痕会短暂扩大并释放虚海雾气，挥击结束后缓慢愈合
      配色: 冰蓝（剑身主体）/银白（裂痕光晕）/深灰（剑柄）/暗金（护手边缘细纹）
    虚海断界（觉醒形态）:
      外观: 裂痕开始愈合但永远保留最后一道细线，作为原初冲突的永恒印记。冰蓝色晶体变得更加透彻，内部的虚海乱流开始有序流动，形成螺旋状的光纹
      特性: 剑刃可以在实体与虚化之间切换。实体时锋利无比，可斩断物质与防护；虚化时化为纯粹的法则之刃，可切开空间、因果、甚至概念性的束缚
      视觉效果: 剑身延展出淡淡的虚海之翼投影，两道半透明的光翼从护手处展开，随挥击轨迹留下残影。它是法则作用范围的视觉化
      配色: 澄澈冰蓝（觉醒剑身）/明亮银白（愈合裂痕）/深海蓝（流动光纹）/纯白（虚海之翼）

  核心能力: 斩断联系与破除束缚。可以切断有形的物质结构、无形的法则连接、甚至概念性的因果链条

  数值与机制:
    基础攻击:
      - 倍率: 2.0
      - 命中效果: 附加"断裂印记"，目标防御降低20%，持续三次攻击或12秒，可叠加至三层
      - 储能消耗: 按能力档案记录，初始为每次10点
    主动技能-断界斩:
      - 效果: 消耗50点储能挥出虚空斩击波，穿透中等体型以下的障碍物，对路径上所有目标造成2.5倍伤害并破除其防护效果
      - 冷却: 18秒
      - 射程: 30米直线
    进阶能力-虚化斩击（觉醒后解锁）:
      - 效果: 剑刃虚化，穿过物质世界直击目标存在本质，无视物理防御和能量护盾，造成3.0倍真实伤害
      - 消耗: 80点储能
      - 冷却: 30秒
    进阶能力-空间断裂（觉醒后解锁）:
      - 效果: 斩开空间创造临时虚空裂隙，可瞬移至15米内任意位置，或将攻击转向、反射
      - 消耗: 40点储能
      - 冷却: 12秒
    特殊能力-存在寄存（觉醒后解锁）:
      - 效果: 预先将部分存在寄存于断界，遭受致死伤害时自动激活，以虚海雾气形态在剑身位置重聚，生命恢复至50%
      - 冷却: 七日
      - 限制: 寄存过程需要10分钟冥想，可被打断

  成长空间:
    觉醒条件: 持有者使用断界累计造成100次有效斩断（破除防护、切断法术、斩开空间均计入），且至少经历过一次"放弃斩断承担后果"或"斩断重要联系"的重大抉择
    具体判定: 当条件满足时，断界会在下一次使用时主动显现原初冲突的记忆片段。持有者需要在记忆中做出选择：认同虚海之灵的自救、认同初微的护持、或是认同两者都有其合理性。任一选择都会完成觉醒，但态度会影响后续与三位原初存在的关系
    觉醒效果: 剑身裂痕愈合至细线状态，解锁虚化斩击、空间断裂、存在寄存三项进阶能力，储能恢复速度提升30%，基础攻击倍率提升至2.3

  相关线索:
    最后记录: 流光位面的破碎群岛。当地古老石碑记载，某座岛屿的中心神殿封印着"会哭泣的裂刃"。每当虚海潮汐涌动时，神殿深处就会传出低鸣，像是剑身在为无法愈合的伤痕哀叹
    乱流光芒: 部分虚海旅者声称在乱流深处见过冰蓝色的光芒一闪而过，试图追踪时总会遭遇空间扭曲，仿佛有什么在主动规避接触
    认主传闻: 有传闻称断界曾短暂认主某位虚海行者，但那位行者在一次位面崩塌中选择留下断后，剑与人一同消失在崩溃的裂隙中
    神器共鸣: 剑身裂痕对其他神器有感应反应。当其他神器接近时，裂痕会向对方方向延伸出细微的银光丝线，距离越近丝线越明亮。若持有者同时触碰两件神器，会短暂看到原初冲突的残影片段

  特殊交互:
    起源亲和: 对起源之力格外敏感。持有者若拥有起源相关的血脉、能力或契约，可以更快唤醒神器，储能恢复速度提升30%。断界在感受到纯粹的起源之力时，剑身的裂痕会暂时完全愈合，展现出它破碎前的完整姿态
    神器联动-断界传送: 与归一配合可施展"断界传送"。持有者用断界斩开空间裂隙，由归一稳定裂隙并连接目标位置，实现精准的跨位面传送。传送门可以维持数分钟，允许多人通过
