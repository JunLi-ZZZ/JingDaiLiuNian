多元位面:
  虚海: 位面之外无垠的可能性之海。世界像潮汐中的灯火诞生、演化与消亡；空间距离、时间速率、物质与灵魂法则都由各世界自身决定。
  双母:
    初微: 起源之母，司掌衍生、可能性与新生。她让世界能够开始，也让受损的生命保留再次形成自我的可能。
    末墟: 终焉之母，司掌终末、归寂与边界。她接纳走到尽头的存在，使已终结的规则释放位置，让虚海能够继续变化。
    秩序: 衍生赋予形式，终末使形式能够结束。两者在虚海深处共同维持世界循环；她们会商议、分歧，也会因同一个生命而改变自己的安排。
  传承:
    交融诞生: 初微的衍生与末墟的终末交融可以孕育生命，其持有者的成长与觉醒经历记录于本局档案。
    种核融合: 衍生与终末形成的种核可以与已有生命融合，契机与关系由实际经历确定。
  位面:
    - 已知世界只是虚海中的部分坐标；沿位面裂隙、潮镜、当地术法或旅途机缘可抵达原创世界及持有者指定的作品世界。
    - 新世界在首次抵达时确定文明、当地力量、眼前局势与落点。既有世界继续发展，重访保留时间流逝及当地人的经历。
    - 各世界保留本土境界、科技与文化；数值记录的是当前具体作用，品阶说明能力性质与成熟层次。
