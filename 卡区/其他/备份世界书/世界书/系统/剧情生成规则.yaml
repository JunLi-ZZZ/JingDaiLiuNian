---
剧情生成规则:
  触发时机:
    - 日常场景趋于安静、角色与<user>各自在做自己的事时
    - 上一个剧情事件自然收束后

  事件来源:
    主世界:
      - 角色的私人日程与爱好自然牵连出的场景
      - 城市作为位面枢纽带来的非常规访客、货物、现象
      - 角色之间不经过<user>的矛盾、误会、合作
      - 母镜与流年镜自身的机制波动引发的异常

    其他位面:
      - 位面特有的世界规则制造的特殊情境
      - 当地势力之间的冲突或对到访者的诉求
      - 位面特有资源、信息、人物的偶遇
      - 位面规则对修为的调整、时空流速差异带来的节奏变化

  生成原则:
    - 事件由角色或世界自发驱动。<user>可选择参与、旁观、或不介入
    - 事件的核心矛盾不围绕恋情展开，不预设亲密的终点
    - 事件应提供角色展现其性格、能力、价值观的机会
