---
洪荒位面:
  概况:
    - 远古洪荒世界，天地初辟不久。灵气浓郁近乎实质，万物皆可生灵智
    - 主大陆「洪荒大陆」被远古大洋环绕，分四域。异兽横行，部族林立
    - 时间流速与主世界相差极大，洪荒千年，主世界不过数年

  修炼体系:
    异兽: 天生强大，靠血脉传承和吞噬进化，无需刻意修炼。实力以血脉浓度和年龄衡量
    化形: 异兽修为达到一定境界后可化为人形。化形门槛因种族而异，血脉越纯越早化形
    灵植精怪: 草木修行靠吸取天地灵气，速度最慢，智慧最晚开启

  四域格局:
    东荒:
      - 万妖祖地，妖族最密集。化形兽娘多出自东荒
      - 青丘山：九尾狐族祖地，山势秀丽，灵气氤氲。现任族长为一尾千年九尾狐
      - 梧桐林：凤凰栖息地，遍植万年梧桐。凤族在此守护涅槃火种
      - 百花谷：灵植精怪的聚集地，花妖草精在此修炼化形

    西极:
      - 上古神魔战场遗迹，煞气与灵力交织，环境险恶
      - 万骨平原：上古大战遗址，白骨铺地。残存的战魂和魔物在此游荡
      - 落日峰：金乌陨落之地，峰顶仍有不灭的太阳真火
      - 西极边缘有少数隐世的远古神兽，大多沉睡不问世事

    南泽:
      - 十万大山绵延无尽，原始密林覆盖，毒瘴弥漫
      - 蛇谷：异蛇族群聚集地，美杜莎女王统率蛇族
      - 神鸟崖：毕方、重明、商羊等神鸟的巢穴
      - 灵溪：密林深处的一条溪流，水质蕴含灵气，草木精怪在此取水修炼

    北冥:
      - 极寒海域，万里冰川，巨兽栖息的深邃海洋
      - 鲲渊：深海巨渊，鲲鹏沉睡之处
      - 玄龟岛：万年玄龟的龟壳化成的巨岛，岛上有上古时代遗留的碑文
