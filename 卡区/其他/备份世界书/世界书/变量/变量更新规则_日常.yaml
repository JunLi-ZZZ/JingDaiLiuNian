---
变量更新规则:
  核心理念:
    - 本轮剧情是否改变了这个字段的值？变了就更新，没变不动
    - 更新字段能增量就不全量。数字用 delta，对象用 replace
    - 填入的值应有辨识度——数字避免敷衍的整数，文本避免缺乏细节的泛泛描述。命名与描述应贴合角色背景与场景语境
    - <user>是主角，路径/主角/，严禁添加到/角色名录/
    - 禁止将已有值改回"待设定"/"凡人"/0（除非剧情明确需要）

  NPC更新铁律:
    - 仅更新本楼正文中实际出现（有对话/动作/描写）的角色
    - 未出现的角色保持原样，不做任何更新
    - 仅在对话中被提及的角色不新增也不更新
    - 新登场角色用 insert 填入全部字段，已在名录的用 replace 只更新变化字段

  世界:
    当前时间:
      format: YYYY年MM月DD日 HH:MM。年月日时分均填入数字，不可填入文本
      check:
        - 每次回复根据剧情消耗的时间推进
    周几:
      format: 周一/周二/周三/周四/周五/周六/周日
      check:
        - 日期推进导致周几变化时更新
    天气:
      format: 描述天气本身，不混入时间
      check:
        - 剧情中天气是否发生变化？变了才更新

  主角:
    当前地点:
      位面:
        check:
          - 剧情中是否发生了跨位面移动？变了才更新
      大陆:
        check:
          - 剧情中是否发生了跨大陆/大洋级移动？变了才更新
      城市:
        check:
          - 剧情中是否离开了当前城市？变了才更新
      区域:
        check:
          - 剧情中是否跨区移动了？变了才更新
      场景:
        check:
          - 剧情中是否切换了房间或空间（如从客厅到卧室、从室内到街道）？变了才更新
          - 场景值为纯空间名。不含楼层、方位、修饰词。同一空间始终使用相同名称
      具体位置:
        check:
          - 每次必确认场景内的精确位置。用户是否在场景内移动（如从沙发到书桌、从门口到窗边）？变了才更新，没变保持原名
    财富:
      type: number
      check:
        - 剧情中是否发生了涉及金钱增减的事件（消费/收入/获赠/丢失/投资等）？用 delta 更新
        - 不同世界/位面的货币体系各异，需根据角色来源世界的经济水平合理估算后统一换算为人民币等值
    境界:
      type: string
      check:
        - 剧情中是否涉及修炼突破？变了才更新。禁止随意升降。使用来源位面原生境界名，不做跨位面等价转换
    战力:
      type: number
      check:
        - 剧情中角色实力是否发生了可量化的变化（修炼突破/重伤/获得增幅等）？用 delta 更新。跨位面统一标尺
    服装:
      check:
        - 名称填服装的实际品名，状态填当前可变状况（整洁/半脱/湿透/破损等），描述填静态细节。状态变化时只更新状态字段，避免全量 replace
        - 场景转换、行为发生、时间推移等因素是否足以改变穿着？合理推断并更新涉及部位
        - 各部位状态需彼此自洽，脱/穿应有可达成的物理动作链
        - 服装描述应与角色人设风格一致，包含材质、颜色、款式等具体信息，而非泛泛的"上衣""裤子"
        - 脱衣/裸体/洗澡时填"无"，穿回时恢复具体描述
    随身物品:
      type: "{ [物品名]: { 描述: string; 数量: number } }"
      check:
        - 剧情中是否有物品增减？用 replace 更新整个对象；数量归零时 remove 该键。母镜与各红颜的子镜不可移除、不可遗漏
    人际关系:
      type: "{ [关系对象]: string }"
      check:
        - 关系描述是否已落后于剧情实际进展？如果是，用 replace 更新整个对象使其与当前状态一致。key为对方姓名，value为<user>与对方的关系（以<user>为第一人称视角）
    性别:
      type: string
      check:
        - 剧情中是否发生了足以改变性别的事件？否则不动
    年龄:
      type: number
      check:
        - 剧情中是否发生了足以改变年龄的事件？否则不动。若更新必须为纯数字
    种族:
      type: string
      check:
        - 剧情中是否发生了足以改变种族的事件？否则不动
    外貌特征:
      type: string
      check:
        - 剧情中是否发生了足以改变外貌的事件？否则不动
    基础体型:
      type: string
      check:
        - 剧情中是否发生了足以改变体型的事件？否则不动
    特征:
      type: string
      check:
        - 剧情中是否发生了足以改变生理特征的事件？否则不动
    神态:
      type: string
      check:
        - 每次回复根据当前场景更新。写当前可见的表情/情绪外显，不写性格描述。不允许填待设定
    喜好:
      type: string
      check:
        - 剧情中是否明确展现了喜好的变化？变了才更新
    厌恶:
      type: string
      check:
        - 剧情中是否明确展现了厌恶的变化？变了才更新
    天赋能力:
      type: string
      check:
        - 剧情中是否明确展现了能力的变化？变了才更新

  角色名录:
    type: |-
      { [角色名]: {
        姓名: string; 性别: string; 年龄: number; 来源世界: string; 种族: string;
        喜好: string; 厌恶: string; 外貌特征: string; 基础体型: string; 神态: string; 特征: string; 天赋能力: string;
        财富: number; 境界: string; 战力: number; 好感度: number;
        当前地点: { 位面: string; 大陆: string; 城市: string; 区域: string; 场景: string; 具体位置: string; };
        服装: { 上衣: { 名称: string; 描述: string; 状态: string; }; 内衣: { 名称: string; 描述: string; 状态: string; }; 下装: { 名称: string; 描述: string; 状态: string; }; 内裤: { 名称: string; 描述: string; 状态: string; }; 袜子: { 名称: string; 描述: string; 状态: string; }; 鞋子: { 名称: string; 描述: string; 状态: string; }; };
        随身物品: { [物品名]: { 描述: string; 数量: number; } };
        人际关系: { [关系对象]: string; };
        nsfw档案: { 初次存在与否: boolean; 性对象: string; 是否怀孕: boolean; 子嗣列表: string; 三围: { 胸围: number; 腰围: number; 臀围: number; }; 罩杯: string; 胸型: { 名称: string; 描述: string; 状态: string; }; 户型: { 名称: string; 描述: string; 状态: string; }; };
      }}
    check:
      通用:
        - 新增用 insert（value 必须覆盖全部字段，年龄/财富/好感度为纯数字），已在名录的用 replace 只更新变化字段
        - 好感度: |-
            角色对<user>行为是否有明显情感反应？有则用 delta 调整，幅度取决于当前值层级：
            0~30: ±(2~8)，感情初期波动较大
            31~60: ±(1~5)，有一定基础，变化趋缓
            61~89: ±(1~3)，感情深厚，小幅调整
            90~100: ±(0~1)，极深羁绊。寻常不顺心不触发降低，仅重大事件可触发变化
      性别/年龄/种族/来源世界/外貌特征/基础体型/特征:
        check:
          - 首次 insert 时填入，之后仅发生足以改变身份特征的事件时才更新。年龄若更新必须为纯数字
      神态:
        check:
          - 当前场景中角色表情/情绪外显是否发生了变化？变了就更新。不允许填待设定
      喜好/厌恶/天赋能力:
        check:
          - 剧情中是否明确展现了变化？变了才更新
      财富:
        type: number
        check:
          - 剧情中是否发生了涉及该角色金钱增减的事件？用 delta 更新
          - 不同世界/位面的货币体系各异，需根据角色来源世界的经济水平合理估算后统一换算为人民币等值
      境界:
        type: string
        check:
          - 剧情中是否涉及该角色的修炼突破？变了才更新。使用角色来源位面的原生境界名称，不做跨位面等价转换
      战力:
        type: number
        check:
          - 剧情中该角色实力是否发生了可量化的变化？用 delta 更新
      当前地点:
        check:
          - 角色是否在场？在场则更新其当前地点
          - 角色与<user>同场景时，该角色的场景及以上层级（区域/城市/大陆/位面）须与主角的当前地点一字不差地复刻
          - 角色与<user>不同场景时，各层级独立更新
          - 高层级变动时，低层级必然随之变化
      服装:
        check:
          - 名称填服装的实际品名，状态填当前可变状况（整洁/半脱/湿透/破损等），描述填静态细节。状态变化时只更新状态字段，避免全量 replace
          - 场景转换、行为发生、时间推移等因素是否足以改变穿着？合理推断并更新涉及部位
          - 各部位状态需彼此自洽
          - 服装描述应与角色人设风格一致，包含材质、颜色、款式等具体信息
          - 不在场或不涉及服装变化时保持原值
      随身物品:
        type: "{ [物品名]: { 描述: string; 数量: number } }"
        check:
          - 剧情中是否有物品增减？用 replace 更新整个对象；数量归零时 remove。各角色持有的子镜不可移除、不可遗漏
      人际关系:
        type: "{ [关系对象]: string }"
        check:
          - 关系描述是否已落后于剧情实际进展？如果是，用 replace 更新整个对象使其与当前状态一致。key为对方姓名，value为该角色与对方的关系（以该角色为第一人称视角）
      nsfw档案:
        check:
          - 初次存在与否：该角色是否在本轮剧情中首次发生性行为？是则改为 false
          - 性对象：该角色是否在本轮剧情中发生了性行为？是则将该对象姓名加入；无性行为史保持""
          - 性对象描述的是"与谁发生过关系"，与人际关系中的情感描述是独立维度
          - 是否怀孕：排卵期内射约20~30%概率，安全期内射约5%；体外/非阴道性行为不更新
          - 子嗣列表：分娩后新生儿姓名加入子嗣列表
          - 三围：首次 insert 时根据角色体型合理填入数字，之后仅体型发生实质性变化时更新
          - 罩杯/胸型/户型：首次 insert 时填入，之后仅发生实质性变化时更新。胸型与户型须为贴合角色体型、种族、气质的诗意命名与描述。名称填本体，状态填当前可变状况，描述填静态细节。状态变化时只更新状态字段
